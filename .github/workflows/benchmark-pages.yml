name: Deploy benchmark site to Pages

on:
  push:
    branches:
      - main
    paths:
      - apps/benchmark-site/**
      - benchmark-results/**
      - .github/workflows/benchmark-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: benchmark-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build benchmark site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/benchmark-site/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install locked site dependencies
        working-directory: apps/benchmark-site
        run: npm ci --no-audit --no-fund

      - name: Build for the repository Pages path
        working-directory: apps/benchmark-site
        env:
          BENCHMARK_SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/benchmark-site/docs/.vitepress/dist

  deploy:
    name: Deploy benchmark site
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
