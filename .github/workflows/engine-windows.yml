# Builds shot.exe on Windows, then runs the checks that need it.
#
# READ THIS BEFORE RUNNING IT.
#
# This is an experiment, not a green tick. A GitHub-hosted runner gives 4 cores
# and a six-hour job limit, and a from-scratch build of this tree takes a night
# on four cores. So the first run is expected to be killed by the time limit.
#
# It is still worth running, for two reasons. It reports exactly where it dies,
# which is the only honest way to find out whether the disk, the toolchain fetch
# or the clock is the binding constraint. And the build directory is stored even
# when ninja runs out of time, so the next run restores it and carries on -- the
# build bootstraps across several runs rather than needing one long one. Once it
# is complete a run is minutes.
#
# If you want it green in one go, point `runs-on` at a self-hosted Windows
# runner, or at a larger GitHub runner. Nothing else needs to change.
#
# One more difference from a local build, and it is not cosmetic. Chromium
# normally builds against a toolchain package that depot_tools downloads, which
# is not available outside Google; so this builds against the Visual Studio and
# the Windows SDK that the runner image happens to ship. build/vs_toolchain.py
# pins an SDK version no hosted runner has, so the `windows sdk` step below
# finds the installed one and overrides the pin through
# CHROMIUM_WIN_SDK_VERSION. The headers are therefore older than the ones a
# local build uses, and code that assumes the newer SDK will say so at compile
# time. That is worth knowing before reading a failure as "the build is broken".
#
# The checkout is a fork, so gclient must not manage `src`: a managed sync would
# reset the tree to upstream and undo everything this repository is. That is
# what "managed": False below is for, and it is not optional.

name: engine (windows)

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'ninja -j (4 cores; blink layout TUs peak at ~1.2 GB each)'
        default: '4'
      run_checks:
        description: 'run the check suites if the build finishes'
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 350   # just under GitHub's six-hour ceiling, so the
                           # "save the cache" step still gets to run

    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'   # use the runner's Visual Studio; Google's
                                       # packaged toolchain is not public
      # GYP_MSVS_VERSION is deliberately unset. The runner image currently
      # carries Visual Studio 18, and vs_toolchain.py picks that up on its own;
      # naming a version here would only be a claim that goes stale.
      DEPOT_TOOLS_UPDATE: '0'

    steps:
      - name: free up disk
        shell: pwsh
        # A Windows runner ships with several toolchains this build has no use
        # for, and the checkout plus toolchains plus object files do not fit
        # around them.
        run: |
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free
          $junk = @(
            "$env:ProgramFiles\dotnet",
            "${env:ProgramFiles(x86)}\Android",
            "$env:ProgramFiles\Microsoft SDKs\Azure",
            "$env:AGENT_TOOLSDIRECTORY\Ruby",
            "$env:AGENT_TOOLSDIRECTORY\go",
            "$env:AGENT_TOOLSDIRECTORY\PyPy",
            "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk"
          )
          foreach ($p in $junk) {
            if (Test-Path $p) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free

      - name: checkout
        uses: actions/checkout@v4
        with:
          path: src
          # The history is not a build input, but it is a timestamp input: the
          # step that makes ninja's incremental state usable reads, per file,
          # the commit that last touched it. See tools/shot/ci_stamp_mtimes.py.
          fetch-depth: 0
          submodules: false   # gclient fetches the DEPS-managed ones itself

      - name: depot_tools
        shell: pwsh
        # The bootstrap has to be invoked by hand. gclient.bat only reaches it
        # through update_depot_tools.bat, and DEPOT_TOOLS_UPDATE=0 -- which is
        # here so a run pins the depot_tools it cloned rather than pulling a
        # newer one mid-build -- jumps straight past that call. The bootstrap is
        # not only the self-update: it also writes depot_tools' git wrappers,
        # and git_cache.py spawns "git.bat" by that literal name. Without it
        # gclient dies with WinError 2 while merely working out its cache path,
        # before it has looked at a single dependency.
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          & C:\depot_tools\bootstrap\win_tools.bat
          if (-not (Test-Path C:\depot_tools\git.bat)) { throw "depot_tools bootstrap produced no git.bat" }
          "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: windows sdk
        shell: pwsh
        # Google's packaged Windows toolchain is not downloadable outside
        # Google, so this builds against the runner's Visual Studio -- and
        # therefore against whatever SDK is installed on it, which is never the
        # exact one build/vs_toolchain.py pins. That pin is a directory name,
        # not a compatibility statement, so the fix is to name the installed SDK
        # rather than to demand the packaged one. "Complete" means it has both
        # the headers and the x64 import libraries: the runner images carry SDK
        # directories that have only one of the two.
        run: |
          $root = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $usable = Get-ChildItem "$root\Include" -Directory -ErrorAction SilentlyContinue |
            Where-Object {
              (Test-Path "$root\Include\$($_.Name)\um\windows.h") -and
              (Test-Path "$root\Lib\$($_.Name)\um\x64\kernel32.lib")
            } | Sort-Object { [version]$_.Name }
          $usable | ForEach-Object { Write-Host "usable SDK: $($_.Name)" }
          if (-not $usable) { throw "no complete Windows SDK under $root" }
          $sdk = $usable[-1].Name
          "CHROMIUM_WIN_SDK_VERSION=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "building against $sdk"

          # And the NTDDI symbol has to come from the same SDK. An identifier
          # the preprocessor has never heard of compares as 0, so naming a
          # newer one than the SDK defines is not an error -- it quietly turns
          # off every version-guarded declaration, and the failure surfaces
          # thousands of lines later as "unknown type name". Take the highest
          # one this SDK actually defines.
          $ddk = "$root\Include\$sdk\shared\sdkddkver.h"
          $ntddi = Select-String -Path $ddk -Pattern '^\s*#define\s+(NTDDI_WIN\w+)\s+0x([0-9A-Fa-f]{8})\s*$' |
            ForEach-Object {
              [pscustomobject]@{
                Name  = $_.Matches[0].Groups[1].Value
                Value = [Convert]::ToUInt32($_.Matches[0].Groups[2].Value, 16)
              }
            } | Sort-Object Value | Select-Object -Last 1
          if (-not $ntddi) { throw "no NTDDI_WIN* symbols in $ddk" }
          "WIN_NTDDI_VERSION=$($ntddi.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "targeting $($ntddi.Name) (0x$('{0:X8}' -f $ntddi.Value))"

      - name: gclient solution
        shell: pwsh
        # "managed": False is the whole point -- see the note at the top.
        # checkout_configuration=small drops the parts of DEPS that only tests
        # and the Android build need.
        run: |
          @'
          solutions = [{
            "name": "src",
            "url": "https://github.com/${{ github.repository }}.git",
            "managed": False,
            "custom_deps": {},
            "custom_vars": {"checkout_configuration": "small"},
          }]
          target_os = ["win"]
          '@ | Out-File -FilePath .gclient -Encoding ascii

      - name: gclient sync
        shell: pwsh
        run: |
          gclient sync --nohooks --no-history --shallow --verbose
          gclient runhooks
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free

      - name: make source timestamps content-faithful
        shell: pwsh
        # Without this the cached build directory is useless: checkout and
        # gclient stamp every file with "now", so every source looks newer than
        # every restored object and ninja rebuilds all 14,906 edges. See the
        # script for what each kind of file gets.
        run: |
          python src/tools/shot/ci_stamp_mtimes.py .

      - name: restore the build directory
        uses: actions/cache/restore@v4
        # This is what makes a killed run useful to the next one. ninja is
        # already incremental; all it needs is its output directory back, so
        # the cache is the build directory itself rather than a compiler cache
        # in front of it. (sccache was here first and could not be used: it
        # talks to the retired v1 Actions cache API, which now answers 400.)
        with:
          path: src/out/Shot
          key: out-shot-${{ github.run_id }}
          restore-keys: |
            out-shot-

      - name: gn gen
        shell: pwsh
        working-directory: src
        # args.gn imports the checked-in configuration rather than passing it
        # as --args: the file has quoted values in it, and those do not survive
        # being interpolated into a command line. Writing the same one byte for
        # byte every run is also what keeps the restored build directory valid
        # -- a different args.gn would invalidate every object in it.
        run: |
          New-Item -ItemType Directory -Force out/Shot | Out-Null
          @(
            'import("//build/args/shot.gn")'
            "win_ntddi_version = ""$env:WIN_NTDDI_VERSION"""
          ) | Out-File -FilePath out/Shot/args.gn -Encoding ascii
          Get-Content out/Shot/args.gn
          gn gen out/Shot

      - name: ninja
        shell: pwsh
        working-directory: src
        continue-on-error: true
        timeout-minutes: 280   # leaves the job time to store what got built
        run: |
          ninja -C out/Shot shot -j ${{ github.event.inputs.jobs }}

      - name: save the build directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: src/out/Shot
          key: out-shot-${{ github.run_id }}

      - name: did the build finish
        shell: pwsh
        working-directory: src
        # ninja is allowed to run out of time; the job is not allowed to call
        # that a success. Re-running picks up where this left off.
        run: |
          if (-not (Test-Path out/Shot/shot.exe)) {
            throw "shot.exe was not produced -- the build got further, but is not done. Run this workflow again; the cache carries the objects over."
          }
          Get-Item out/Shot/shot.exe | Select-Object Length,LastWriteTime


      - name: package
        if: success()
        shell: pwsh
        working-directory: src
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/Shot/shot.exe,out/Shot/icudtl.dat,out/Shot/shot_data.pak,out/Shot/shot_strings.pak dist/
          Get-ChildItem dist | Select-Object Name,Length

      - name: upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shot-windows-x64
          path: src/dist/
          if-no-files-found: error

      - name: checks
        if: success() && github.event.inputs.run_checks == 'true'
        shell: pwsh
        working-directory: src
        # The three suites, in the order they cost: protocol and geometry first
        # because they are seconds, then the network one, then the pool. Any
        # failure fails the job -- there is no point publishing an engine that
        # does not pass its own checks.
        run: |
          python tools/shot/serve_check.py out/Shot/shot.exe
          python tools/shot/net_check.py out/Shot/shot.exe
          node tools/shot/node_check.cjs out/Shot/shot.exe
