# Builds shotium.exe on Windows, then runs the checks that need it.
#
# READ THIS BEFORE RUNNING IT.
#
# This is an experiment, not a green tick. A GitHub-hosted runner gives 4 cores
# and a six-hour job limit, and a from-scratch build of this tree takes a night
# on four cores. So the first run is expected to be killed by the time limit.
#
# It is still worth running, for two reasons. It reports exactly where it dies,
# which is the only honest way to find out whether the disk, the toolchain fetch
# or the clock is the binding constraint. And the build directory is stored even
# when ninja runs out of time, so the next run restores it and carries on -- the
# build bootstraps across several runs rather than needing one long one. Once it
# is complete a run is minutes.
#
# If you want it green in one go, point `runs-on` at a self-hosted Windows
# runner, or at a larger GitHub runner. Nothing else needs to change.
#
# One more difference from a local build, and it is not cosmetic. Chromium
# normally builds against a toolchain package that depot_tools downloads, which
# is not available outside Google; so this builds against the Visual Studio and
# the Windows SDK that the runner image happens to ship. build/vs_toolchain.py
# pins an SDK version no hosted runner has, so the `windows sdk` step below
# finds the installed one and overrides the pin through
# CHROMIUM_WIN_SDK_VERSION. The headers are therefore older than the ones a
# local build uses, and code that assumes the newer SDK will say so at compile
# time. That is worth knowing before reading a failure as "the build is broken".
#
# The checkout is a fork, so gclient must not manage `src`: a managed sync would
# reset the tree to upstream and undo everything this repository is. That is
# what "managed": False below is for, and it is not optional.

name: engine (windows)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'x64 (native) or arm64 (cross-compiled from this x64 host)'
        type: choice
        options: [x64, arm64]
        default: x64
      jobs:
        description: 'ninja -j (4 cores; blink layout TUs peak at ~1.2 GB each)'
        default: '4'
      run_checks:
        description: 'run the check suites if the build finishes'
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 350   # just under GitHub's six-hour ceiling, so the
                           # "save the cache" step still gets to run

    permissions:
      contents: write  # the release step creates and uploads to a draft release
      actions: write   # so the run can delete the cache entries it supersedes

    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'   # use the runner's Visual Studio; Google's
                                       # packaged toolchain is not public
      # GYP_MSVS_VERSION is deliberately unset. The runner image currently
      # carries Visual Studio 18, and vs_toolchain.py picks that up on its own;
      # naming a version here would only be a claim that goes stale.
      DEPOT_TOOLS_UPDATE: '0'

    steps:
      - name: free up disk
        shell: pwsh
        # A Windows runner ships with several toolchains this build has no use
        # for, and the checkout plus toolchains plus object files do not fit
        # around them.
        run: |
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free
          $junk = @(
            "$env:ProgramFiles\dotnet",
            "${env:ProgramFiles(x86)}\Android",
            "$env:ProgramFiles\Microsoft SDKs\Azure",
            "$env:AGENT_TOOLSDIRECTORY\Ruby",
            "$env:AGENT_TOOLSDIRECTORY\go",
            "$env:AGENT_TOOLSDIRECTORY\PyPy",
            "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk"
          )
          foreach ($p in $junk) {
            if (Test-Path $p) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free

      - name: checkout
        uses: actions/checkout@v7
        with:
          path: src
          # The history is not a build input, but it is a timestamp input: the
          # step that makes ninja's incremental state usable reads, per file,
          # the commit that last touched it. See tools/shot/ci_stamp_mtimes.py.
          fetch-depth: 0
          submodules: false   # gclient fetches the DEPS-managed ones itself

      - name: set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: depot_tools
        shell: pwsh
        # The bootstrap has to be invoked by hand. gclient.bat only reaches it
        # through update_depot_tools.bat, and DEPOT_TOOLS_UPDATE=0 -- which is
        # here so a run pins the depot_tools it cloned rather than pulling a
        # newer one mid-build -- jumps straight past that call. The bootstrap is
        # not only the self-update: it also writes depot_tools' git wrappers,
        # and git_cache.py spawns "git.bat" by that literal name. Without it
        # gclient dies with WinError 2 while merely working out its cache path,
        # before it has looked at a single dependency.
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          & C:\depot_tools\bootstrap\win_tools.bat
          if (-not (Test-Path C:\depot_tools\git.bat)) { throw "depot_tools bootstrap produced no git.bat" }
          "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Deliberately not cached: depot_tools, the gclient git cache, and the
      # synced working copies. Not because they are cheap -- the sync is 15 to
      # 30 minutes -- but because the 10 GB the repository gets is shared by
      # everything, and the build directory is worth about four hours of it.
      # Anything else put in that budget competes with the one entry that
      # matters, and loses the comparison while still evicting it.

      - name: windows sdk
        shell: pwsh
        # Google's packaged Windows toolchain is not downloadable outside
        # Google, so this builds against the runner's Visual Studio -- and
        # therefore against whatever SDK is installed on it, which is never the
        # exact one build/vs_toolchain.py pins. That pin is a directory name,
        # not a compatibility statement, so the fix is to name the installed SDK
        # rather than to demand the packaged one. "Complete" means it has both
        # the headers and the import libraries *for the target architecture*:
        # the runner images carry SDK directories that have only one of the
        # two, and an arm64 cross-compile needs Lib\...\um\arm64, which is a
        # separate Visual Studio component that may simply not be installed.
        #
        # Checking it here is the point. clang-cl and lld-link come from
        # third_party/llvm-build and target anything, so nothing else in this
        # job would notice a missing arm64 SDK until the link, hours in.
        run: |
          $target = "${{ github.event.inputs.arch }}"
          $root = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $usable = Get-ChildItem "$root\Include" -Directory -ErrorAction SilentlyContinue |
            Where-Object {
              (Test-Path "$root\Include\$($_.Name)\um\windows.h") -and
              (Test-Path "$root\Lib\$($_.Name)\um\$target\kernel32.lib")
            } | Sort-Object { [version]$_.Name }
          $usable | ForEach-Object { Write-Host "usable SDK: $($_.Name)" }
          if (-not $usable) {
            throw "no Windows SDK under $root has both um\windows.h and um\$target\kernel32.lib"
          }

          # The MSVC runtime for the target has to be there too, and it is a
          # different component from the SDK.
          $crt = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\lib\$target\libcmt.lib" `
                   -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $crt) {
            throw "no MSVC libcmt.lib for $target -- the Visual Studio on this runner has no $target toolset"
          }
          Write-Host "target CRT: $($crt.FullName)"
          $sdk = $usable[-1].Name
          "CHROMIUM_WIN_SDK_VERSION=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "building against $sdk"

          # And the NTDDI symbol has to come from the same SDK. An identifier
          # the preprocessor has never heard of compares as 0, so naming a
          # newer one than the SDK defines is not an error -- it quietly turns
          # off every version-guarded declaration, and the failure surfaces
          # thousands of lines later as "unknown type name". Take the highest
          # one this SDK actually defines.
          $ddk = "$root\Include\$sdk\shared\sdkddkver.h"
          $ntddi = Select-String -Path $ddk -Pattern '^\s*#define\s+(NTDDI_WIN\w+)\s+0x([0-9A-Fa-f]{8})\s*$' |
            ForEach-Object {
              [pscustomobject]@{
                Name  = $_.Matches[0].Groups[1].Value
                Value = [Convert]::ToUInt32($_.Matches[0].Groups[2].Value, 16)
              }
            } | Sort-Object Value | Select-Object -Last 1
          if (-not $ntddi) { throw "no NTDDI_WIN* symbols in $ddk" }
          "WIN_NTDDI_VERSION=$($ntddi.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "targeting $($ntddi.Name) (0x$('{0:X8}' -f $ntddi.Value))"

      - name: gclient solution
        shell: pwsh
        # "managed": False is the whole point -- see the note at the top.
        # checkout_configuration=small drops the parts of DEPS that only tests
        # and the Android build need.
        run: |
          @'
          solutions = [{
            "name": "src",
            "url": "https://github.com/${{ github.repository }}.git",
            "managed": False,
            "custom_deps": {},
            "custom_vars": {"checkout_configuration": "small"},
          }]
          target_os = ["win"]
          '@ | Out-File -FilePath .gclient -Encoding ascii

      - name: gclient sync
        shell: pwsh
        run: |
          gclient sync --nohooks --no-history --shallow --verbose
          gclient runhooks
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free

      - name: make source timestamps content-faithful
        shell: pwsh
        # Without this the cached build directory is useless: checkout and
        # gclient stamp every file with "now", so every source looks newer than
        # every restored object and ninja rebuilds all 14,906 edges. See the
        # script for what each kind of file gets.
        run: |
          python src/tools/shot/ci_stamp_mtimes.py .

      - name: restore the build directory
        uses: actions/cache/restore@v6
        # This is what makes a killed run useful to the next one. ninja is
        # already incremental; all it needs is its output directory back, so
        # the cache is the build directory itself rather than a compiler cache
        # in front of it. (sccache was here first and could not be used: it
        # talks to the retired v1 Actions cache API, which now answers 400.)
        #
        # The key carries the platform because a matrix would otherwise have
        # every target restoring whichever build directory happened to be
        # newest, which is worse than starting cold: ninja would rebuild
        # everything anyway and the wrong entry would be the one kept.
        #
        # Excluding anything from this path is a trap worth naming. The .pdb
        # files are 13% of the directory and look like debug baggage under
        # symbol_level = 0, but dropping them makes ninja redo 757 CXX edges,
        # not just the links -- measured, not assumed.
        with:
          path: src/out/Shot
          key: out-shot-windows-${{ github.event.inputs.arch }}-${{ github.run_id }}
          restore-keys: |
            out-shot-windows-${{ github.event.inputs.arch }}-

      - name: patch the DEPS checkouts
        shell: pwsh
        working-directory: src
        # gclient restores third_party/icu and third_party/skia from their own
        # upstreams, so anything this repository changes there has to be
        # reapplied on every run. The ICU patch is worth 5.8 MB of shotium.exe:
        # icu_data_dir_override picks the "cast"
        # filtered data set (5.0 MB) over the platform default "common"
        # (10.8 MB), and icu_use_data_file = false links whichever one it is
        # into the binary.
        #
        # This runs after the mtime stamping and the cache restore on purpose.
        # The patched files then carry the current time, which is newer than
        # any restored object built from the unpatched ones, so ninja rebuilds
        # exactly those and nothing else.
        #
        # A failure here is not something to swallow. If a DEPS roll moves the
        # file out from under the patch, the build has to stop and say so --
        # the alternative is a silently different binary, which is the state
        # this step exists to end.
        run: |
          git -C third_party/icu apply --verbose ../../patches/third_party_icu.patch
          if ($LASTEXITCODE -ne 0) { throw "patches/third_party_icu.patch did not apply" }
          git -C third_party/skia apply --verbose ../../patches/third_party_skia_parallel_blur.patch
          if ($LASTEXITCODE -ne 0) { throw "patches/third_party_skia_parallel_blur.patch did not apply" }

      - name: build the shot ICU data set
        shell: pwsh
        working-directory: src
        # args.gn asks for icu_data_dir_override = "shot", which is not one of
        # the nine sets third_party/icu ships: it is `cast` with the six CJK
        # converter tables removed, since Blink decodes those encodings itself.
        # Like the patch above this has to be redone on every run, because
        # gclient owns that directory.
        #
        # Failing here rather than falling back to `cast` is deliberate. A
        # missing input would stop gn gen anyway; what must not happen is the
        # build quietly picking a different data set than the one the size
        # numbers were measured against.
        run: |
          New-Item -ItemType Directory -Force third_party/icu/shot | Out-Null
          python tools/shot/icu_repack.py `
            third_party/icu/cast/icudtl.dat `
            third_party/icu/shot/icudtl.dat --preset shot
          if ($LASTEXITCODE -ne 0) { throw "icu_repack.py failed" }

      - name: gn gen
        shell: pwsh
        working-directory: src
        # args.gn imports the checked-in configuration rather than passing it
        # as --args: the file has quoted values in it, and those do not survive
        # being interpolated into a command line. Writing the same one byte for
        # byte every run is also what keeps the restored build directory valid
        # -- a different args.gn would invalidate every object in it.
        run: |
          New-Item -ItemType Directory -Force out/Shot | Out-Null
          @(
            'import("//build/args/shot.gn")'
            "win_ntddi_version = ""$env:WIN_NTDDI_VERSION"""
            "target_cpu = ""${{ github.event.inputs.arch }}"""
          ) | Out-File -FilePath out/Shot/args.gn -Encoding ascii
          Get-Content out/Shot/args.gn
          gn gen out/Shot

      - name: forget the previous binary
        # The build directory is restored from cache, so out/Shot still
        # holds the previous run's executable -- and when a compile fails,
        # "did the build finish" would find that stale binary, call the run
        # a success, and ship yesterday's build as today's artifact. It
        # did, once. Deleting it first means only this run's link can
        # satisfy the check; the relink costs a couple of minutes.
        working-directory: src
          # pwsh, not bash: rm is Remove-Item, whose flags differ.
        run: |
          foreach ($stale in 'out/Shot/shotium.exe', 'out/Shot/shotium.dll') {
            if (Test-Path $stale) { Remove-Item -Force $stale }
          }

      - name: ninja
        shell: pwsh
        working-directory: src
        continue-on-error: true
        timeout-minutes: 280   # leaves the job time to store what got built
        run: |
          # shot_c is the same engine behind a C ABI, for shotium's node
          # addon. It is a second link of the same 43 MB, which sounds like
          # doubling the job and is not: both links share the ThinLTO cache
          # this build directory already carries, so the second one reuses the
          # codegen the first one did and costs minutes rather than an hour.
          ninja -C out/Shot shot shot_c -j ${{ github.event.inputs.jobs }}

      - name: save the build directory
        if: always()
        uses: actions/cache/save@v6
        with:
          path: src/out/Shot
          key: out-shot-windows-${{ github.event.inputs.arch }}-${{ github.run_id }}

      - name: drop the build directories this one replaces
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # A repository gets 10 GB of Actions cache in total, evicted least
        # recently used, and one Chromium build directory is 6.1 GB before
        # compression. Saving a new entry every run and never removing the old
        # ones means the budget is full after three or four runs, and eviction
        # then starts taking entries that are still wanted -- including,
        # eventually, the one this run just wrote.
        #
        # So the run that writes a build directory removes the older ones it
        # supersedes. Keeping one spare is deliberate: if this run's entry is
        # somehow unusable, the previous one is still there to restore from.
        #
        # Failing here must not fail the job. The cache is an optimisation; a
        # build that finished is still a build that finished.
        run: |
          $keep = 2
          try {
            $stale = gh cache list --repo ${{ github.repository }} `
                       --key "out-shot-windows-${{ github.event.inputs.arch }}-" --limit 100 `
                       --sort created_at --order desc --json id,key,sizeInBytes |
                     ConvertFrom-Json
          } catch {
            Write-Output "could not list caches: $_"
            exit 0
          }
          if (-not $stale) { exit 0 }
          $freed = 0
          foreach ($entry in $stale | Select-Object -Skip $keep) {
            Write-Output ("deleting {0} ({1:N0} bytes)" -f $entry.key, $entry.sizeInBytes)
            gh cache delete $entry.id --repo ${{ github.repository }} 2>&1 | Out-Null
            $freed += $entry.sizeInBytes
          }
          Write-Output ("kept {0}, freed {1:N2} GB" -f
                        [math]::Min($keep, $stale.Count), ($freed / 1GB))

      - name: did the build finish
        shell: pwsh
        working-directory: src
        # ninja is allowed to run out of time; the job is not allowed to call
        # that a success. Re-running picks up where this left off.
        run: |
          foreach ($wanted in 'out/Shot/shotium.exe', 'out/Shot/shotium.dll') {
            if (-not (Test-Path $wanted)) {
              throw "$wanted was not produced -- the build got further, but is not done. Run this workflow again; the cache carries the objects over."
            }
          }
          Get-Item out/Shot/shotium.exe,out/Shot/shotium.dll |
            Select-Object Name,Length,LastWriteTime


      - name: package
        if: success()
        shell: pwsh
        working-directory: src
        run: |
          # icudtl.dat is deliberately not shipped. icu_use_data_file = false
          # builds with ICU_UTIL_DATA_STATIC, so the table is linked into
          # shotium.exe and the loose copy is never opened -- verified by
          # rendering the same page with the file present and absent and
          # getting byte-identical PNGs.
          #
          # The payload is 7z rather than zip because the difference is large
          # and one-sided. Measured on the three files below:
          #
          #   zip  -mx9 (deflate)   18.29 MB
          #   7z   -mx6 (LZMA2)     13.48 MB
          #   7z   -mx9 (LZMA2)     12.80 MB
          #
          # Two things account for it. deflate looks back 32 KB, LZMA2 at -mx9
          # looks back 64 MB, and the repetition in a 41 MB executable is
          # spread much further apart than 32 KB. On top of that 7z applies the
          # x86 BCJ filter to executables, which rewrites relative CALL/JMP
          # offsets as absolute addresses so that the same call compresses the
          # same way wherever it appears -- worth 0.71 MB here on its own.
          #
          # Decompression costs about half a second, once, when the user
          # unpacks. It is not on any per-render path.
          #
          # The archive holds exactly one directory, named for the platform and
          # the architecture and nothing else. The version lives in the file
          # name instead, so unpacking a newer build over an older one replaces
          # it in place rather than leaving two versioned directories side by
          # side.
          $version = (Get-Content shotium/package.json -Raw | ConvertFrom-Json).version
          $stem = "shotium-win-${{ github.event.inputs.arch }}"
          $archive = "$stem-v$version.7z"
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path $archive) { Remove-Item -Force $archive }
          New-Item -ItemType Directory "dist/$stem" | Out-Null
          # shotium.dll ships beside shotium.exe rather than in an archive of its
          # own: they are the same engine, the resource packs serve both, and
          # a caller who wants the addon should not have to work out which two
          # downloads go together.
          Copy-Item out/Shot/shotium.exe,out/Shot/shotium.dll,out/Shot/shotium_data.pak,out/Shot/shotium_strings.pak "dist/$stem/"
          Get-ChildItem "dist/$stem" | Select-Object Name,Length
          # windows-2025 ships 7-Zip on PATH; fall back to its install path
          # rather than silently producing no archive if that ever changes.
          $sevenzip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenzip) { $sevenzip = "$env:ProgramFiles\7-Zip\7z.exe" }
          if (-not (Test-Path $sevenzip)) { throw "no 7z on this runner" }
          Push-Location dist
          & $sevenzip a -t7z -mx=9 "../$archive" $stem
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "7z failed with $code" }
          Get-Item $archive |
              Select-Object Name,@{n='MB';e={[math]::Round($_.Length/1MB,2)}}
          "SHOT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SHOT_STEM=$stem"       | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SHOT_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: upload
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SHOT_STEM }}
          path: src/${{ env.SHOT_ARCHIVE }}
          if-no-files-found: error
          # upload-artifact always wraps what it is handed in a zip and only
          # lets you pick a deflate level; no switch turns the wrapper off.
          # Level 0 stores the .7z as-is; anything higher spends CI time
          # re-compressing data that is already compressed and gives back
          # nothing. The release step below is where a download is the .7z
          # itself.
          compression-level: 0

      - name: checks
        # x64 only, for the reason the Linux job gives: this runner is x64 and
        # cannot execute an arm64 binary, so asking would fail on a host
        # limitation and read as a broken engine. An arm64 artifact ships
        # checked by nothing but the compiler and the linker.
        if: success() && github.event.inputs.run_checks == 'true'
             && github.event.inputs.arch == 'x64'
        shell: pwsh
        working-directory: src
        # In the order they cost: protocol and geometry first because they are
        # seconds, then the network one, then the addon build, then the node
        # suites that load it, then the two that render. Any failure fails the
        # job -- there is no point publishing an engine that does not pass its
        # own checks.
        #
        # charset_check and demo_check run here for the same reason they run on
        # Linux and macOS: they are the only suites that compare pixels, and a
        # cut that breaks layout produces a wrong page rather than a build
        # error. The demos travel because they are reftests -- each one renders
        # its own reference on the same host, so a platform's fonts and
        # antialiasing cancel out instead of needing a blessed image per
        # platform. Windows was simply the one still not running them.
        run: |
          python -m pip install --quiet pillow
          python tools/shot/serve_check.py out/Shot/shotium.exe
          python tools/shot/net_check.py out/Shot/shotium.exe
          # The node addon, and the C ABI under it. Built here rather than
          # taken from anywhere else, because the library it links against is
          # the one this job has just produced -- an addon checked against a
          # different build would be checking nothing.
          #
          # Before the node suites, not after: the addon is what they load. An
          # A package-manager install carries the library and the addon and not the
          # executable, so there is no second path for them to fall back to.
          #
          # node-gyp 13 and not 11, because this runner image ships Visual
          # Studio 18 (2026) at "Microsoft Visual Studio\18\Enterprise", and
          # every node-gyp before 13 stops at `unknown version "undefined"`
          # and then reports that no Visual Studio is installed at all. 13 is
          # the release that maps installationVersion 18 to VS2026 and its
          # v145 toolset. Chromium's own build is unaffected -- it uses clang
          # and only borrows the SDK and the CRT.
          $env:SHOT_INCLUDE_DIR = "$PWD/shot"
          $env:SHOT_LIB_DIR = "$PWD/out/Shot"
          Push-Location shotium/native
          pnpm dlx node-gyp@13 rebuild
          Pop-Location
          Copy-Item out/Shot/shotium.dll,out/Shot/shotium_data.pak,out/Shot/shotium_strings.pak `
                    shotium/native/build/Release/
          # The package is TypeScript, so what the check suites import is a
          # build output rather than a file in the tree. There is no frozen
          # lockfile -- see checks.yml for why it cannot carry the six
          # optionalDependencies yet.
          Push-Location shotium
          pnpm install --no-lockfile
          pnpm run build
          Pop-Location
          node tools/shot/node_check.cjs out/Shot/shotium.exe
          node tools/shot/daemon_check.cjs out/Shot/shotium.exe
          python tools/shot/charset_check.py out/Shot/shotium.exe
          python tools/shot/demo_check.py out/Shot/shotium.exe

      - name: npm platform package
        if: success()
        shell: pwsh
        working-directory: src
        # One of the six @shotkit/shotium-<os>-<arch> packages: the shared
        # library, the addon linked against it, and the two resource packs, in
        # a package npm can install. @shotkit/shotium depends on all six as
        # optionalDependencies with os/cpu set, so an install pulls the one
        # that matches and skips the rest. See tools/shot/make_platform_package.cjs.
        #
        # Not the executable. It is a second, independent copy of the same
        # engine -- shot_core is a source_set, so its objects link into both
        # the executable and the library, and the two came out 22 KB apart with
        # no reference between them -- and node has no use for it now that
        # rendering is in-process. It still goes out in the .7z on the releases
        # page, for using the engine without node.
        #
        # Which makes the addon the only thing in the package that node can
        # call, so this fails rather than warns if there is not one. It used to
        # warn and ship anyway, back when a package without an addon could
        # still drive the worker pool; there is no pool to fall back to.
        #
        # On x64 the addon already exists: the checks step built it against
        # this job's own library and proved it renders the same bytes as the
        # executable. On arm64 the checks did not run -- this runner cannot
        # execute an arm64 binary -- so it is cross-compiled here and ships
        # having been checked by nothing but the compiler and the linker.
        run: |
          $arch = "${{ github.event.inputs.arch }}"
          $addon = "shotium/native/build/Release/shotium.node"
          if (-not (Test-Path $addon)) {
            $env:SHOT_INCLUDE_DIR = "$PWD/shot"
            $env:SHOT_LIB_DIR = "$PWD/out/Shot"
            Push-Location shotium/native
            pnpm dlx node-gyp@13 rebuild --arch=$arch
            $built = $LASTEXITCODE -eq 0
            Pop-Location
            if (-not $built) { throw "the $arch addon did not cross-compile" }
          }
          if (-not (Test-Path $addon)) {
            throw "no $addon -- the package would install and then be unable to render, since the addon is the only thing in it node can call"
          }
          node tools/shot/make_platform_package.cjs `
            --build out/Shot --os win --arch $arch --dest dist/npm `
            --addon $addon
          if ($LASTEXITCODE -ne 0) { throw "make_platform_package failed" }
          Push-Location "dist/npm/shotium-win-$arch"
          npm pack --pack-destination ..
          $packed = $LASTEXITCODE
          Pop-Location
          if ($packed -ne 0) { throw "npm pack failed with $packed" }
          $tgz = Get-ChildItem dist/npm/*.tgz | Select-Object -First 1
          if (-not $tgz) { throw "npm pack produced no tarball" }
          Get-Item $tgz.FullName |
            Select-Object Name,@{n='MB';e={[math]::Round($_.Length/1MB,2)}}
          # Relative to src/, which is this step's working directory: one value
          # that upload-artifact accepts.
          "SHOT_NPM_TARBALL=dist/npm/$($tgz.Name)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: upload the npm package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: npm-shotium-win-${{ github.event.inputs.arch }}
          path: src/${{ env.SHOT_NPM_TARBALL }}
          if-no-files-found: error
          compression-level: 0
