# Builds shotium.exe on Windows, then runs the checks that need it.
#
# READ THIS BEFORE RUNNING IT.
#
# This is an experiment, not a green tick. A GitHub-hosted runner gives 4 cores
# and a six-hour job limit, and a from-scratch build of this tree takes a night
# on four cores. So the first run is expected to be killed by the time limit.
#
# It is still worth running, for two reasons. It reports exactly where it dies,
# which is the only honest way to find out whether the disk, the toolchain fetch
# or the clock is the binding constraint. And the build directory is stored even
# when ninja runs out of time, so the next run restores it and carries on -- the
# build bootstraps across several runs rather than needing one long one. Once it
# is complete a run is minutes.
#
# If you want it green in one go, point `runs-on` at a self-hosted Windows
# runner, or at a larger GitHub runner. Nothing else needs to change.
#
# One more difference from a local build, and it is not cosmetic. Chromium
# normally builds against a toolchain package that depot_tools downloads, which
# is not available outside Google; so this builds against the Visual Studio and
# the Windows SDK that the runner image happens to ship. build/vs_toolchain.py
# pins an SDK version no hosted runner has, so the `windows sdk` step below
# finds the installed one and overrides the pin through
# CHROMIUM_WIN_SDK_VERSION. The headers are therefore older than the ones a
# local build uses, and code that assumes the newer SDK will say so at compile
# time. That is worth knowing before reading a failure as "the build is broken".
#
# The checkout is a fork, so gclient must not manage `src`: a managed sync would
# reset the tree to upstream and undo everything this repository is. That is
# what "managed": False below is for, and it is not optional.

name: engine-windows
run-name: "engine-windows: ${{ inputs.arch }} build (${{ inputs.shards }} shards)"

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'amd64 (native) or arm64 (cross-compiled from this amd64 host)'
        type: choice
        options: [amd64, arm64]
        default: amd64
      jobs:
        description: 'ninja -j (4 cores; blink layout TUs peak at ~1.2 GB each)'
        default: '4'
      run_checks:
        description: 'run the check suites if the build finishes'
        type: boolean
        default: true
      shards:
        description: 'auto: one runner when a build directory saved at this fingerprint exists, platform defaults otherwise; integer: explicit shard count'
        default: auto

  # engine.yml calls this for every architecture it finds missing at the
  # current fingerprint; the dispatch above stays for building one platform
  # by hand. Both declare the same inputs, because every step below reads
  # `inputs.*` -- never `github.event.inputs`, which under workflow_call is
  # the caller's event and would silently skip every conditional step.
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      fingerprint:
        description: 'the engine fingerprint the artifacts are named after; computed here when empty'
        type: string
        default: ''
      jobs:
        type: string
        default: '4'
      run_checks:
        type: boolean
        default: true
      shards:
        type: string
        default: auto

# GN and the Node SDK spell the 64-bit architecture x64; the names
# people see spell it amd64. The build-directory artifacts are named with
# the public spelling; the toolchain cache keeps the GN one.
env:
  SHOT_CPU: ${{ inputs.arch == 'arm64' && 'arm64' || 'x64' }}

jobs:
  # Every job name below carries the engine fingerprint, and every artifact
  # is named after it. A job name can read an earlier job's outputs but not
  # a file, so one small job computes it first, along with how many shards
  # to use and which saved build directory to start from.
  meta:
    permissions:
      contents: read
      actions: read
    name: "resolve: shotium-windows-${{ inputs.arch }}"
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      compile_shards: ${{ steps.shards.outputs.list }}
      shard_count: ${{ steps.shards.outputs.count }}
      final_shard: ${{ steps.shards.outputs.final }}
      build_dir_run_id: ${{ steps.shards.outputs.build_dir_run_id }}
    steps:
      # A blobless sparse checkout: `git ls-tree` reads trees, which it has,
      # and the fingerprint reads nothing else.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            package.json
            scripts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - run: pnpm -C scripts install --frozen-lockfile
      - id: fingerprint
        env:
          FROM_CALLER: ${{ inputs.fingerprint }}
        # The caller computed it for the tree it is building; a dispatch
        # computes it here. Either way it names every artifact of this run.
        run: |
          if [ -n "$FROM_CALLER" ]; then
            echo "fingerprint=$FROM_CALLER" >> "$GITHUB_OUTPUT"
            echo "$FROM_CALLER (from the caller)"
          else
            pnpm ci:fingerprint --output
          fi
      - id: shards
        env:
          GH_TOKEN: ${{ github.token }}
          SHOT_PLATFORM: windows
          SHOT_SHARDS: ${{ inputs.shards }}
          SHOT_FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: pnpm ci:select-shards

  # Sharding. ninja's idea of "up to date" is the outputs plus .ninja_log and
  # .ninja_deps, and N runners that ran the same gn gen share one graph. So
  # each shard builds every Nth object of the graph (with whatever generated
  # files and host tools that needs), tars what it built with its two logs,
  # and the final job transplants the tars into its own build directory
  # (scripts/build/shards.ts merge) and finds only the link left to do.
  # Measured on Linux amd64: 73 minutes cold as one job, 47 as four shards
  # plus the final job; a warm run 18 minutes.
  #
  # These jobs are slices 0 to N-2. The last slice is the final job's, and it
  # starts with them rather than after them: the setup is the same work --
  # source, DEPS, gn gen, 13 minutes on Windows -- and running it after the
  # shards instead of beside them added that to every run for nothing.
  #
  # Every shard restores the build-directory cache too, so a warm run costs
  # what it did before sharding: a shard whose slice is already built packs
  # nothing (--since keeps the cache's files out of the tar). What travels
  # is more than objects: the generated sources GN writes at gen time (the
  # jumbo units) and the depfiles of edges that keep theirs on disk, because
  # the final job's own gn gen would write them newer than the objects and
  # ninja would rebuild everything below them.
  compile:
    name: "compile: shotium-windows-${{ inputs.arch }}-${{ needs.meta.outputs.fingerprint }} ${{ matrix.shard }}/${{ needs.meta.outputs.shard_count }}"
    needs: meta
    if: needs.meta.outputs.shard_count != '1'
    runs-on: windows-2025
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.meta.outputs.compile_shards) }}

    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'   # use the runner's Visual Studio; Google's
                                       # packaged toolchain is not public
      # GYP_MSVS_VERSION is deliberately unset. The runner image currently
      # carries Visual Studio 18, and vs_toolchain.py picks that up on its own;
      # naming a version here would only be a claim that goes stale.
      DEPOT_TOOLS_UPDATE: '0'

    steps:
      # Everything this job writes from here on is newer than this moment;
      # everything the build-directory cache restores is older. That is how
      # the pack step tells the shard's own work from the cache's.
      - name: remember when this job started
        shell: pwsh
        run: '[DateTimeOffset]::UtcNow.ToUnixTimeSeconds() | Set-Content "$env:RUNNER_TEMP/job-started"'

      # The setup steps live in .github/actions/windows-source so the shards and
      # this job cannot drift apart. A local action has to be on disk before it
      # can be used, hence the sparse checkout of .github first.
      - name: this repository's actions
        uses: actions/checkout@v7
        with:
          path: actions
          sparse-checkout: .github/actions

      - name: source, DEPS, build directory, gn gen
        uses: ./actions/.github/actions/windows-source
        with:
          arch: ${{ inputs.arch }}
          cpu: ${{ env.SHOT_CPU }}
          platform: windows-${{ inputs.arch }}
          build-dir-run-id: ${{ needs.meta.outputs.build_dir_run_id }}

      - name: this shard's slice of the objects
        shell: pwsh
        working-directory: src
        # -t inputs walks the graph below the two engine targets and names
        # every file it would read, objects included, in every toolchain.
        # `slice` spreads them by cost -- last run's durations from the
        # restored .ninja_log, or an estimate from the path -- longest first
        # onto the least-loaded shard, so the shards finish together; every
        # shard computes the same assignment from the same inputs.
        run: |
          $objects = @(ninja -C out/Shot -t inputs shot shot_c shot_node | Where-Object { $_ -match '\.obj$' })
          $slice = @($objects | pnpm --silent build:shards slice --build-dir out/Shot --shards '${{ needs.meta.outputs.shard_count }}' --index '${{ matrix.shard }}')
          if ($LASTEXITCODE -ne 0) { throw "build:shards slice failed" }
          ($slice -join "`n") | Set-Content -NoNewline -Encoding ascii "$env:RUNNER_TEMP/slice.txt"

      - name: ninja
        shell: pwsh
        working-directory: src
        continue-on-error: true
        timeout-minutes: 280
        # The checked-in ninja.exe, not depot_tools' `ninja`: on Windows that
        # is a .bat wrapper, and cmd caps a command line at 8 KB ("The command
        # line is too long" -- five of eight batches of the first sharded run
        # never started). CreateProcess allows 32 KB, so 100 targets a batch
        # is safe with room. -k 0 so one shard's log names every broken unit
        # in its slice, and continue-on-error so what did compile still
        # reaches the final job, which reports the failure.
        run: |
          $ninja = (Resolve-Path third_party/ninja/ninja.exe).Path
          $slice = @(Get-Content "$env:RUNNER_TEMP/slice.txt")
          $failed = $false
          for ($i = 0; $i -lt $slice.Count; $i += 100) {
            $end = [math]::Min($i + 99, $slice.Count - 1)
            & $ninja -C out/Shot -j ${{ inputs.jobs }} -k 0 @($slice[$i..$end])
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: pack what this shard built
        shell: pwsh
        working-directory: src
        run: |
          $since = Get-Content "$env:RUNNER_TEMP/job-started"
          $built = @(pnpm --silent build:shards list --build-dir out/Shot --since $since)
          if ($LASTEXITCODE -ne 0) { throw "build:shards list failed" }
          ($built -join "`n") | Set-Content -NoNewline -Encoding ascii "$env:RUNNER_TEMP/built.txt"
          "$($built.Count) outputs built by this shard"
          tar --format=pax -C out/Shot -cf "$env:GITHUB_WORKSPACE/shard.tar" -T "$env:RUNNER_TEMP/built.txt" .ninja_log .ninja_deps
          if ($LASTEXITCODE -ne 0) { throw "tar failed" }
          Get-Item "$env:GITHUB_WORKSPACE/shard.tar" | Select-Object Name,@{n='MB';e={[math]::Round($_.Length/1MB)}}

      - name: upload the shard
        uses: actions/upload-artifact@v7
        with:
          name: shard-windows-${{ inputs.arch }}-${{ matrix.shard }}
          path: shard.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  build:
    name: "build: shotium-windows-${{ inputs.arch }}-${{ needs.meta.outputs.fingerprint }}"
    # Deliberately not `needs: compile`. This job builds the last slice
    # itself and waits for the others' artifacts below, so its setup runs
    # while they compile instead of after them. A shard that fails is not
    # fatal either way: the merge brings in whatever did compile, ninja
    # rebuilds the rest, and the failure is reported here with the real
    # error rather than as a missing artifact.
    needs: meta
    runs-on: windows-2025
    timeout-minutes: 350   # just under GitHub's six-hour ceiling, so the
                           # "save the cache" step still gets to run

    permissions:
      contents: read
      actions: write   # so the run can prune the build-directory artifacts it supersedes

    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'   # use the runner's Visual Studio; Google's
                                       # packaged toolchain is not public
      # GYP_MSVS_VERSION is deliberately unset. The runner image currently
      # carries Visual Studio 18, and vs_toolchain.py picks that up on its own;
      # naming a version here would only be a claim that goes stale.
      DEPOT_TOOLS_UPDATE: '0'

    steps:
      # The setup steps live in .github/actions/windows-source so the shards and
      # this job cannot drift apart. A local action has to be on disk before it
      # can be used, hence the sparse checkout of .github first.
      - name: this repository's actions
        uses: actions/checkout@v7
        with:
          path: actions
          sparse-checkout: .github/actions

      - name: source, DEPS, build directory, gn gen
        uses: ./actions/.github/actions/windows-source
        with:
          arch: ${{ inputs.arch }}
          cpu: ${{ env.SHOT_CPU }}
          platform: windows-${{ inputs.arch }}
          build-dir-run-id: ${{ needs.meta.outputs.build_dir_run_id }}

      - name: this job's slice of the objects
        if: ${{ needs.meta.outputs.shard_count != '1' }}
        shell: pwsh
        working-directory: src
        # The last slice, by the same assignment every shard computes.
        run: |
          $objects = @(ninja -C out/Shot -t inputs shot shot_c shot_node | Where-Object { $_ -match '\.obj$' })
          $slice = @($objects | pnpm --silent build:shards slice --build-dir out/Shot --shards '${{ needs.meta.outputs.shard_count }}' --index '${{ needs.meta.outputs.final_shard }}')
          if ($LASTEXITCODE -ne 0) { throw "build:shards slice failed" }
          ($slice -join "`n") | Set-Content -NoNewline -Encoding ascii "$env:RUNNER_TEMP/slice.txt"

      - name: ninja this job's slice
        if: ${{ needs.meta.outputs.shard_count != '1' }}
        shell: pwsh
        working-directory: src
        continue-on-error: true
        timeout-minutes: 280
        # The checked-in ninja.exe in batches of 100, for the reason the
        # compile job gives: depot_tools' `ninja` is a .bat and cmd drops
        # anything past 8 KB of command line without saying so.
        run: |
          $ninja = (Resolve-Path third_party/ninja/ninja.exe).Path
          $slice = @(Get-Content "$env:RUNNER_TEMP/slice.txt")
          $failed = $false
          for ($i = 0; $i -lt $slice.Count; $i += 100) {
            $end = [math]::Min($i + 99, $slice.Count - 1)
            & $ninja -C out/Shot -j ${{ inputs.jobs }} -k 0 @($slice[$i..$end])
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: wait for the other shards
        if: ${{ needs.meta.outputs.shard_count != '1' }}
        shell: pwsh
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Polls this run's artifact list. It returns as soon as every shard
        # has uploaded, and also when every shard job has finished without
        # uploading -- ninja below then builds whatever never arrived.
        run: |
          pnpm --silent ci:await-shards `
            --prefix 'shard-windows-${{ inputs.arch }}-' `
            --shards '${{ needs.meta.outputs.shard_count }}' `
            --job-prefix 'compile: shotium-windows-${{ inputs.arch }}-${{ needs.meta.outputs.fingerprint }}'
          if ($LASTEXITCODE -ne 0) { throw "waiting for the shards failed" }

      - name: download the shards
        if: ${{ needs.meta.outputs.shard_count != '1' }}
        continue-on-error: true   # no artifact at all is a slow build, not a failed one
        uses: actions/download-artifact@v8
        with:
          pattern: shard-windows-${{ inputs.arch }}-*
          path: shards

      - name: merge the shards into the build directory
        if: ${{ needs.meta.outputs.shard_count != '1' }}
        shell: pwsh
        working-directory: src
        # One shard at a time, deleting each as it goes: the runner's disk
        # holds the build directory plus one unpacked shard, not plus all.
        run: |
          # download-artifact v8 flattens a single matching artifact.
          foreach ($tarball in Get-ChildItem "$env:GITHUB_WORKSPACE/shards" -Recurse -File -Filter shard.tar) {
            $dir = Join-Path $tarball.DirectoryName 'out'
            New-Item -ItemType Directory -Force $dir | Out-Null
            tar -C $dir -xf $tarball.FullName
            if ($LASTEXITCODE -ne 0) { throw "could not unpack $($tarball.FullName)" }
            Remove-Item $tarball.FullName
            pnpm build:shards merge --build-dir out/Shot --shard $dir
            if ($LASTEXITCODE -ne 0) { throw "merge failed for $dir" }
            Remove-Item -Recurse -Force $dir
          }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free

      - name: forget the previous binary
        # The build directory is restored from cache, so out/Shot still
        # holds the previous run's executable -- and when a compile fails,
        # "did the build finish" would find that stale binary, call the run
        # a success, and ship yesterday's build as today's artifact. It
        # did, once. Deleting it first means only this run's link can
        # satisfy the check; the relink costs a couple of minutes.
        working-directory: src
          # pwsh, not bash: rm is Remove-Item, whose flags differ.
        run: |
          foreach ($stale in 'out/Shot/shotium.exe', 'out/Shot/shotium.dll', 'out/Shot/shotium.node') {
            if (Test-Path $stale) { Remove-Item -Force $stale }
          }

      # A restored build directory can hold a depfile that names a file the
      # tree no longer has; ninja refuses to start on it ("missing and no
      # known rule to make it"). Dropping the depfile makes the action rerun.
      - name: drop depfiles that name deleted files
        shell: pwsh
        working-directory: src
        run: pnpm depfiles:prune out/Shot

      - name: why is the restored build directory dirty
        shell: pwsh
        working-directory: src
        # Diagnosis only, nothing is built: -d explain makes ninja say why each
        # dirty edge is dirty, and the root causes come first. This is how the
        # Linux job found LASTCHANGE, the Skia patches and angle_commit.h.
        run: ninja -C out/Shot shot shot_c shot_node -n -d explain 2>&1 | Select-Object -First 120

      - name: ninja
        shell: pwsh
        working-directory: src
        continue-on-error: true
        timeout-minutes: 280   # leaves the job time to store what got built
        run: |
          # shot_c preserves the standalone C ABI; shot_node is the Node entry. It is a second link of the same 43 MB, which sounds like
          # doubling the job and is not: both links share the ThinLTO cache
          # this build directory already carries, so the second one reuses the
          # codegen the first one did and costs minutes rather than an hour.
          ninja -C out/Shot shot shot_c shot_node -j ${{ inputs.jobs }}

      # What this build read: ninja's inputs and deps log, gn's build.ninja.d,
      # the jumbo source lists. `pnpm trim-tree plan` takes the six platforms'
      # exports and computes which tracked files no build opens.
      - name: export the build graph
        if: always()
        continue-on-error: true
        working-directory: src
        run: pnpm graph:export --build-dir out/Shot --out ../graph

      - name: upload the build graph
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: graph-windows-${{ inputs.arch }}
          path: graph
          if-no-files-found: warn

      - name: pack the build directory
        if: always()
        shell: bash
        working-directory: src
        # The build directory is what makes the next run warm, so it is
        # saved whether or not ninja finished. It goes to an artifact rather
        # than the Actions cache: the cache is 10 GB for the whole repository
        # and evicts whatever went unused for seven days, and an entry
        # written on a branch was invisible to every other branch -- both of
        # which turned warm builds cold. An artifact is visible repository-
        # wide for 90 days. The marker uploaded after "did the build finish"
        # says which fingerprint this directory is complete at, which is how
        # select-shards knows the next run at that fingerprint needs one
        # runner and no compiling.
        run: |
          tar --format=pax -cf - out/Shot | zstd -T0 -3 --long=27 -o "$RUNNER_TEMP/build-dir.tar.zst"
          ls -l "$RUNNER_TEMP/build-dir.tar.zst"

      - name: save the build directory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-dir-windows-${{ inputs.arch }}
          path: ${{ runner.temp }}/build-dir.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: true

      - name: drop the build directories this one replaces
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        # Artifact storage is not metered on a public repository, but a list
        # that only grows is slow to search. Three per platform: this run's
        # and two to fall back on. Never fatal: a build that finished is
        # still a build that finished.
        run: pnpm ci:engine-artifacts prune --name build-dir-windows-${{ inputs.arch }} --keep 3

      - name: did the build finish
        shell: pwsh
        working-directory: src
        # ninja is allowed to run out of time; the job is not allowed to call
        # that a success. Re-running picks up where this left off.
        run: |
          foreach ($wanted in 'out/Shot/shotium.exe', 'out/Shot/shotium.dll', 'out/Shot/shotium.node') {
            if (-not (Test-Path $wanted)) {
              throw "$wanted was not produced -- the build got further, but is not done. Run this workflow again; the cache carries the objects over."
            }
          }
          Get-Item out/Shot/shotium.exe,out/Shot/shotium.dll |
            Select-Object Name,Length,LastWriteTime

      - name: mark the build directory as complete at this fingerprint
        # Only after "did the build finish": an exact marker is how the next
        # run at this fingerprint knows it may use one runner, and a build
        # that ran out of time must not say that.
        shell: bash
        working-directory: src
        run: pnpm ci:engine-artifacts marker --platform windows-${{ inputs.arch }} --fingerprint ${{ needs.meta.outputs.fingerprint }} --out "$RUNNER_TEMP/build-dir.json"

      - uses: actions/upload-artifact@v7
        with:
          name: build-dir-windows-${{ inputs.arch }}-${{ needs.meta.outputs.fingerprint }}
          path: ${{ runner.temp }}/build-dir.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true


      - name: package
        if: success()
        shell: pwsh
        working-directory: src
        run: |
          # icudtl.dat is deliberately not shipped. icu_use_data_file = false
          # builds with ICU_UTIL_DATA_STATIC, so the table is linked into
          # shotium.exe and the loose copy is never opened -- verified by
          # rendering the same page with the file present and absent and
          # getting byte-identical PNGs.
          #
          # The payload is 7z rather than zip because the difference is large
          # and one-sided. Measured on the three files below:
          #
          #   zip  -mx9 (deflate)   18.29 MB
          #   7z   -mx6 (LZMA2)     13.48 MB
          #   7z   -mx9 (LZMA2)     12.80 MB
          #
          # Two things account for it. deflate looks back 32 KB, LZMA2 at -mx9
          # looks back 64 MB, and the repetition in a 41 MB executable is
          # spread much further apart than 32 KB. On top of that 7z applies the
          # x86 BCJ filter to executables, which rewrites relative CALL/JMP
          # offsets as absolute addresses so that the same call compresses the
          # same way wherever it appears -- worth 0.71 MB here on its own.
          #
          # Decompression costs about half a second, once, when the user
          # unpacks. It is not on any per-render path.
          #
          # Independent CLI and C ABI packages have stable archive/root names;
          # version identity belongs to the Release tag and build provenance.
          $cliStem = "shotium-cli-windows-${{ inputs.arch }}"
          $abiStem = "shotium-c-abi-windows-${{ inputs.arch }}"
          $nodeStem = "shotium-node-windows-${{ inputs.arch }}"
          $stage = [IO.Path]::GetFullPath((Join-Path (Get-Location) 'dist'))
          if ([IO.Path]::GetDirectoryName($stage) -ne (Get-Location).Path) { throw "Unexpected staging path: $stage" }
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          foreach ($archive in "$cliStem.7z", "$abiStem.7z", "$nodeStem.7z") {
            if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          }
          pnpm package:cli --build out/Shot --os win --dest "dist/$cliStem"
          if ($LASTEXITCODE -ne 0) { throw "CLI packaging failed" }
          pnpm package:c-abi --build out/Shot --os win --dest "dist/$abiStem"
          if ($LASTEXITCODE -ne 0) { throw "C ABI packaging failed" }
          # The addon delivery carries no version: publish.yml and the
          # previews turn it into the npm platform package for whatever
          # version they ship (pnpm package:platform --from-archive).
          pnpm package:node --build out/Shot --os win --dest "dist/$nodeStem"
          if ($LASTEXITCODE -ne 0) { throw "node packaging failed" }
          pnpm ci:engine-artifacts provenance --platform "windows-${{ inputs.arch }}" `
            --fingerprint "${{ needs.meta.outputs.fingerprint }}" --out dist/provenance.json
          if ($LASTEXITCODE -ne 0) { throw "provenance failed" }
          $sevenzip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenzip) { $sevenzip = "$env:ProgramFiles\7-Zip\7z.exe" }
          if (-not (Test-Path -LiteralPath $sevenzip)) { throw "no 7z on this runner" }
          Push-Location dist
          try {
            foreach ($packageStem in $cliStem, $abiStem, $nodeStem) {
              & $sevenzip a -t7z -mx=9 "../$packageStem.7z" $packageStem
              if ($LASTEXITCODE -ne 0) { throw "7z failed for $packageStem" }
            }
          } finally { Pop-Location }
          Get-Item "$cliStem.7z", "$abiStem.7z", "$nodeStem.7z" | Select-Object Name,Length
          "SHOT_CLI_ARCHIVE=$cliStem.7z" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SHOT_C_ABI_ARCHIVE=$abiStem.7z" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SHOT_NODE_ARCHIVE=$nodeStem.7z" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: upload the engine
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: engine-windows-${{ inputs.arch }}-${{ needs.meta.outputs.fingerprint }}
          path: |
            src/${{ env.SHOT_CLI_ARCHIVE }}
            src/${{ env.SHOT_C_ABI_ARCHIVE }}
            src/${{ env.SHOT_NODE_ARCHIVE }}
            src/dist/provenance.json
          if-no-files-found: error
          # upload-artifact always wraps what it is handed in a zip and only
          # lets you pick a deflate level; no switch turns the wrapper off.
          # Level 0 stores the .7z as-is; anything higher spends CI time
          # re-compressing data that is already compressed and gives back
          # nothing.
          compression-level: 0
          retention-days: 90
          overwrite: true

      - name: checks
        # x64 only, for the reason the Linux job gives: this runner is x64 and
        # cannot execute an arm64 binary, so asking would fail on a host
        # limitation and read as a broken engine. An arm64 artifact ships
        # checked by nothing but the compiler and the linker.
        if: success() && inputs.run_checks && inputs.arch == 'amd64'
        shell: pwsh
        working-directory: src
        # In the order they cost: protocol and geometry first because they are
        # seconds, then the network one, then the addon build, then the node
        # suites that load it, then the two that render. Any failure fails the
        # job -- there is no point publishing an engine that does not pass its
        # own checks.
        #
        # charset_check and demo_check run here for the same reason they run on
        # Linux and macOS: they are the only suites that compare pixels, and a
        # cut that breaks layout produces a wrong page rather than a build
        # error. The demos travel because they are reftests -- each one renders
        # its own reference on the same host, so a platform's fonts and
        # antialiasing cancel out instead of needing a blessed image per
        # platform. Windows was simply the one still not running them.
        run: |
          pnpm verify:serve out/Shot/shotium.exe
          if ($LASTEXITCODE -ne 0) { throw "serve checks failed" }
          pnpm verify:net out/Shot/shotium.exe
          if ($LASTEXITCODE -ne 0) { throw "net checks failed" }
          # The GN build already produced the self-contained Node addon.
          # The package is TypeScript, so what the check suites import is a
          # build output rather than a file in the tree. There is no frozen
          # lockfile -- see checks.yml for why it cannot carry the six
          # optionalDependencies yet.
          Push-Location apps/typescript
          pnpm install --no-lockfile
          pnpm run build
          Pop-Location
          pnpm verify:node out/Shot/shotium.exe
          if ($LASTEXITCODE -ne 0) { throw "node checks failed" }
          pnpm verify:node-entry
          if ($LASTEXITCODE -ne 0) { throw "Node entry checks failed" }
          pnpm verify:bilibili --package apps/typescript
          if ($LASTEXITCODE -ne 0) { throw "Bilibili regression checks failed" }
          pnpm verify:daemon out/Shot/shotium.exe
          if ($LASTEXITCODE -ne 0) { throw "daemon checks failed" }
          pnpm verify:daemon-protocol
          if ($LASTEXITCODE -ne 0) { throw "daemon protocol checks failed" }
          pnpm verify:charset out/Shot/shotium.exe
          if ($LASTEXITCODE -ne 0) { throw "charset checks failed" }
          pnpm verify:demos out/Shot/shotium.exe
          if ($LASTEXITCODE -ne 0) { throw "reftests failed" }

  ffi:
    needs: [meta, build]
    if: ${{ inputs.run_checks }}
    uses: ./.github/workflows/check-ffi.yml
    with:
      runner: ${{ inputs.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
      platform: windows-${{ inputs.arch }}
      artifact: engine-windows-${{ inputs.arch }}-${{ needs.meta.outputs.fingerprint }}
      evidence: ffi-evidence-windows-${{ inputs.arch }}-${{ needs.meta.outputs.fingerprint }}
