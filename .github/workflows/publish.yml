# Publishes the eight packages to npm, then announces them as a release.
#
# The tag is the trigger, not the product. Pushing `vX.Y.Z` starts this; there
# is no button to press afterwards and no draft to remember to publish. That
# ordering is the whole point of the file, so it is worth saying what the
# previous one did instead: the six platform packages accumulated on a draft
# release, a human dispatched this workflow, and the tag came into existence
# only when someone finally clicked publish on the draft. v0.1.0 spent an hour
# fully published on npm with no tag in the repository at all, and the draft it
# was waiting on pointed fifteen commits back -- at the first engine run that
# happened to create it, since the five after that found the release already
# there and left its target alone. A tag that is created last records whatever
# was true when someone got round to it.
#
# The release is created after npm and only if npm succeeded. Both directions
# of that failure are possible and they are not equally bad: npm-without-a-
# release is a missing announcement, fixed by creating one; a release without
# npm is a published version number that nobody can install, and it is on the
# repository's front page. npm also has no unpublish worth relying on, so the
# irreversible half goes first and the reversible half confirms it.
#
# The bytes come from workflow artifacts named after the engine fingerprint
# -- a hash of every tracked file the six native builds read
# (scripts/ci/fingerprint.ts) -- not from release assets and not from "the
# run on this commit". The engine job below calls engine.yml, which builds
# whichever platform has no engine-<platform>-<fingerprint> artifact yet
# and otherwise reuses what an earlier run built; the artifacts it hands
# on are version-free, and the npm platform packages are assembled here
# with the version being released. So the version bump, a README edit or a
# benchmark change never costs a rebuild, and a tag never needs anything
# dispatched by hand first. Release assets are still never a source: they
# carry no link to the tree they came from.
#
# ---------------------------------------------------------------------------
# The release procedure, which this workflow is only the last step of:
#
#   1. Bump the version in apps/typescript/package.json. SEVEN lines: `version`, and
#      the six optionalDependencies that pin the platform packages to it. They
#      must match exactly -- checks.yml fails the build if they do not.
#   2. Commit, push, merge. Wait for checks.yml; if the engine changed,
#      engine.yml builds it on main in the background.
#   3. Rehearse: dispatch this workflow with dry_run on. It reuses or builds
#      the engines, runs the package suites against one, and publishes
#      nothing.
#   4. `git tag vX.Y.Z && git push origin vX.Y.Z`. This runs.
# ---------------------------------------------------------------------------
#
# Publishing order within the job is also not cosmetic. @pixel.js/shotium
# declares the six as optionalDependencies pinned to its own version, so it
# goes after them: a registry that has the main package but not the platform
# package it names hands out an install that cannot take a screenshot. And
# @shotkit/shotium, the package's previous name, goes last of all. It is a
# shim that depends on @pixel.js/shotium at this exact version and re-exports
# it (scripts/package/legacy.ts), published beside every release so that an
# install pinned to the old name keeps receiving them. It is sent only once
# the registry has been seen to serve the seven it depends on: a shim that
# resolves before its target is the same broken install from the other side.
# The six old platform packages, @shotkit/shotium-<os>-<arch>, stay at 0.7.2;
# nothing depends on them any more.
#
# There is no npm token. This workflow authenticates by trusted publishing:
# GitHub mints a short-lived OIDC token for the job, npm checks that its
# claims -- this repository, this workflow file -- match what the package has
# on record, and issues credentials good for that one publish. Nothing
# long-lived exists to leak, and a stolen workflow file is useless because the
# claims are asserted by GitHub rather than by the workflow.
#
# Two consequences of that, both of which have bitten people:
#
#   - The filename matters. npm records `publish.yml`, not the `name:` below
#     and not the job id, so renaming this file silently invalidates every
#     trusted publisher configured against it. Rename it and you are back to
#     "404 Not Found" on publish, which is what npm returns when it cannot
#     tell an unauthenticated caller from an unauthorised one. Changing the
#     trigger, as this commit does, is safe for the same reason: the claim is
#     about the file, not about how it started.
#   - Each of the eight packages carries its own trusted publisher, set on
#     npmjs.com under the package's settings, and npm has no way to configure
#     one for a package that does not exist yet. Hence the 0.0.1 placeholders:
#     publish once by hand, attach the publisher, and every version after that
#     comes from here.
#
# Provenance follows from the same token and is on by default -- a signed
# statement, in a public transparency log, that these bytes came out of this
# workflow at this commit. It needs every package.json to carry a `repository`
# that matches this repository, case for case, or the publish fails outright.
# The six platform manifests inherit theirs from apps/typescript/package.json in
# scripts/package/platform.ts, so a platform tarball built before that
# field existed cannot be published from here. Rebuild it rather than reaching
# for --no-provenance; an unattested engine binary is the one package in the
# seven where the attestation is worth something.
#
# workflow_dispatch remains, for rehearsal only. It publishes nothing unless
# dry_run is turned off, it never creates a release, and it reads the version
# from the tree rather than from a tag. A dry run does not authenticate, so it
# proves tarballs, versions, the shim, the 17 archives and SHA256SUMS, but
# nothing about the trust configuration.

name: publish
run-name: "publish: ${{ github.ref_name }}${{ inputs.dry_run && ' dry run' || '' }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'rehearse against this ref and publish nothing'
        type: boolean
        default: true

jobs:
  # Every job name below carries the package version. A job name can
  # read an earlier job's outputs but not a file, so one small job
  # reads package.json first.
  meta:
    name: "resolve: shotium"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: apps/typescript/package.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(jq -r .version apps/typescript/package.json)" >> "$GITHUB_OUTPUT"

  # The six engines at this tree's fingerprint: reused when they exist,
  # built here when they do not. Either way the tag waits for nothing
  # dispatched by hand.
  engine:
    uses: ./.github/workflows/engine.yml
    permissions:
      contents: read
      actions: write

  # The TypeScript package against a real engine, before anything is
  # published: the same suites a pull request runs, on the tagged tree.
  contract:
    needs: engine
    uses: ./.github/workflows/contract.yml
    permissions:
      contents: read
      actions: read
    with:
      fingerprint: ${{ needs.engine.outputs.fingerprint }}

  publish:
    name: "publish: shotium-v${{ needs.meta.outputs.version }}"
    needs: [meta, engine, contract]
    runs-on: ubuntu-latest
    permissions:
      # The OIDC token. Without it npm has nothing to check and falls back to
      # looking for a token it will not find.
      id-token: write
      # Creating the release at the end.
      contents: write
      # Read artifacts from other runs and dispatch the published-version
      # benchmark after creating the release.
      actions: write
    env:
      FINGERPRINT: ${{ needs.engine.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      # No registry-url, and so no .npmrc: setup-node's registry-url exists to
      # write an _authToken line pointing at NODE_AUTH_TOKEN, and an .npmrc
      # naming an empty token is worse than no .npmrc at all -- npm sends the
      # empty credential instead of asking for an OIDC one.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: an npm that can do this
        # Trusted publishing landed in npm 11.5.1. Node 24 ships something
        # newer than that already, but the runner image's bundled npm is not a
        # thing this repository controls, and the failure if it is too old is
        # an authentication error that says nothing about versions.
        run: |
          pnpm add --global npm@latest
          echo "node $(node --version), npm $(npm --version)"

      - name: what this run is
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        # Two triggers, one job. A tag push is always for real and takes its
        # version from the tag; a dispatch is a rehearsal and takes it from the
        # tree. Deciding that once, here, keeps every step below from having to
        # ask which one it is.
        run: |
          version=$(node -p "require('./apps/typescript/package.json').version")
          if [ "$EVENT" = "push" ]; then
            tag="$REF_NAME"
            dry_run=false
            release=true
          else
            tag="v$version"
            dry_run="${INPUT_DRY_RUN:-true}"
            release=false
          fi
          {
            echo "TAG=$tag"
            echo "VERSION=$version"
            echo "DRY_RUN=$dry_run"
            echo "RELEASE=$release"
          } >> "$GITHUB_ENV"
          echo "event=$EVENT tag=$tag version=$version" \
               "dry_run=$dry_run release=$release"

      - name: the tag and the package agree
        # A tag that does not match the version in the tree publishes the wrong
        # number under the right name, which cannot be taken back. On a
        # dispatch this is a tautology; on a tag push it is the check that
        # catches a tag pushed before the version bump was committed.
        run: |
          if [ "v$VERSION" != "$TAG" ]; then
            echo "apps/typescript/package.json is $VERSION, the tag is $TAG"
            echo "the tag must be pushed after the version bump, not before"
            exit 1
          fi
          echo "publishing $VERSION"

      - name: build the main package
        working-directory: apps/typescript
        # The package is TypeScript and dist/ is not committed, so until this
        # runs there is nothing to publish. `npm publish ./apps/typescript` would run
        # prepack and build it anyway -- but it would do that after the six
        # platform packages were already public, and a build failure has to
        # land before anything is irreversible rather than between the sixth
        # package and the seventh.
        run: |
          pnpm install --no-lockfile
          pnpm run build
          node -e '
            const fs = require("fs");
            for (const f of ["dist/index.js", "dist/index.d.ts",
                             "dist/daemon_main.js"]) {
              if (!fs.existsSync(f)) throw new Error("no " + f);
            }
            console.log("ok");
          '

      - name: the legacy shim, generated from the manifest just built
        # @shotkit/shotium is the old name, kept as a package that depends on
        # this version of @pixel.js/shotium and re-exports it. Generated here
        # rather than committed, so its version and exports map cannot drift
        # from the manifest they mirror; the generator refuses an exports map
        # it does not know how to mirror.
        run: |
          pnpm -C scripts install --frozen-lockfile
          pnpm package:legacy --dest dist/legacy/shotium
          for f in package.json index.js index.d.ts README.md; do
            test -f "dist/legacy/shotium/$f" || { echo "missing dist/legacy/shotium/$f"; exit 1; }
          done
          node -e '
            const shim = require("./dist/legacy/shotium/package.json");
            const main = require("./apps/typescript/package.json");
            if (shim.version !== main.version) throw new Error("shim is " + shim.version + ", main is " + main.version);
            if (shim.dependencies[main.name] !== main.version) throw new Error("shim does not pin " + main.name + "@" + main.version);
            console.log("ok: " + shim.name + "@" + shim.version + " -> " + main.name + "@" + main.version);
          '

      - name: the engine artifacts at this tree's fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        # Six engines and their evidence, by fingerprint rather than by
        # commit, from whichever trusted run built them (this one, if the
        # engine job above had to). The node archives become the npm
        # platform packages here, with the version being released; the
        # CLI and C ABI archives go to the Release as they are.
        #
        # All six, by name, rather than a glob over what happens to be
        # there: a missing architecture must stop the run, not produce a
        # main package pointing at a platform package that was never
        # published. download-set refuses an incomplete set.
        run: |
          mkdir -p dist/npm dist/release
          if ! command -v 7z >/dev/null; then sudo apt-get update && sudo apt-get install -y p7zip-full; fi
          pnpm ci:engine-artifacts download-set --fingerprint "$FINGERPRINT" \
            --engine-dir dist/engine --node-dir dist/node --evidence-dir dist/evidence
          for plat in windows-amd64 windows-arm64 linux-amd64 linux-arm64 macos-amd64 macos-arm64; do
            case "$plat" in windows-*) os=win;; linux-*) os=linux;; macos-*) os=mac;; esac
            cpu=${plat#*-}; [ "$cpu" = amd64 ] && cpu=x64
            pnpm package:platform --from-archive "dist/node/$plat/shotium-node-$plat.7z" \
              --os "$os" --arch "$cpu" --dest dist/npm-stage
            ( cd "dist/npm-stage/shotium-$os-$cpu" && npm pack --pack-destination ../../npm )
          done

          # The filenames, too, and not just the packages: the version in
          # the tarball is the one being released, by construction, but the
          # publish step below names the files, so they had better exist.
          for plat in win32-x64 win32-arm64 darwin-x64 darwin-arm64 \
                      linux-x64 linux-arm64; do
            f="dist/npm/pixel.js-shotium-$plat-$VERSION.tgz"
            if [ ! -f "$f" ]; then
              echo "$f is missing -- the staging holds:"
              ls dist/npm
              exit 1
            fi
          done

          ls -l dist/npm dist/engine/* dist/node/*

      - name: every tarball names this repository
        env:
          REPO: ${{ github.repository }}
        # Provenance compares package.json's repository against this one and
        # rejects a mismatch, after uploading. Six tarballs published and the
        # seventh refused is the worst outcome available here, so the check
        # happens before anything is sent -- and on the tarballs themselves,
        # not on the tree, because the tree is not what gets published. The
        # shim is a directory, checked the same way.
        run: |
          fail=0
          for tarball in dist/npm/*.tgz; do
            url=$(tar -xzOf "$tarball" package/package.json \
                  | node -e 'let s="";process.stdin.on("data",d=>s+=d)
                             .on("end",()=>{const r=JSON.parse(s).repository
                               process.stdout.write(
                                 (r && (r.url || r)) || "")})')
            case "$url" in
              *"github.com/$REPO"*) ;;
              '') echo "$tarball has no repository field"; fail=1 ;;
              *)  echo "$tarball says $url, not $REPO"; fail=1 ;;
            esac
          done
          url=$(node -p 'const r=require("./dist/legacy/shotium/package.json").repository;(r&&(r.url||r))||""')
          case "$url" in
            *"github.com/$REPO"*) ;;
            *) echo "the legacy shim says '$url', not $REPO"; fail=1 ;;
          esac
          if [ "$fail" = 1 ]; then
            echo "rebuild the engine workflows: the tarballs predate the" \
                 "repository field, and provenance will refuse them"
            exit 1
          fi
          echo "all six tarballs and the shim name $REPO"

      - name: package language examples
        run: |
          pnpm -C scripts install --frozen-lockfile
          if ! command -v 7z >/dev/null; then sudo apt-get update && sudo apt-get install -y p7zip-full; fi
          pnpm package:examples --dest dist/release
          pnpm package:checksums --collect dist/engine --dir dist/release

      - uses: actions/upload-artifact@v7
        with:
          name: release-attachments
          path: dist/release/
          if-no-files-found: error

      - name: publish
        # --access public because the scope is new and npm defaults a scoped
        # package to restricted, which would publish successfully and install
        # for nobody.
        run: |
          flags="--access public"
          if [ "$DRY_RUN" = "true" ]; then
            flags="$flags --dry-run"
            echo "=== dry run: nothing below becomes public ==="
          fi
          # By name and in order, not a glob: the glob sorts the main tarball
          # before darwin-*, and the main package must not go out before the
          # six it points at.
          for plat in win32-x64 win32-arm64 darwin-x64 darwin-arm64 \
                      linux-x64 linux-arm64; do
            echo "--- @pixel.js/shotium-$plat"
            npm publish "dist/npm/pixel.js-shotium-$plat-$VERSION.tgz" $flags
          done
          echo "--- @pixel.js/shotium"
          npm publish ./apps/typescript $flags

      - name: the packages are actually there
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          # Publication can precede CDN visibility by 15 minutes. Wait before
          # declaring success; a timeout requires registry inspection, not blindly
          # republishing already accepted immutable versions.
          wait_for() {
            for pkg in "$@"; do
              url="https://registry.npmjs.org/$pkg/$VERSION"
              for attempt in $(seq 1 45); do
                code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
                [ "$code" = "200" ] && break
                sleep 20
              done
              echo "$code  $pkg@$VERSION"
              [ "$code" = "200" ] || { echo "Registry visibility timed out; inspect publication before retrying." >&2; exit 1; }
            done
          }
          wait_for @pixel.js/shotium-win32-x64 @pixel.js/shotium-win32-arm64 \
                   @pixel.js/shotium-darwin-x64 @pixel.js/shotium-darwin-arm64 \
                   @pixel.js/shotium-linux-x64 @pixel.js/shotium-linux-arm64 \
                   @pixel.js/shotium

      - name: publish the legacy name
        # Last, and only now: the shim depends on @pixel.js/shotium at this
        # version, and the step above is what proves the registry serves it.
        run: |
          flags="--access public"
          if [ "$DRY_RUN" = "true" ]; then
            flags="$flags --dry-run"
            echo "=== dry run: nothing below becomes public ==="
          fi
          echo "--- @shotkit/shotium"
          npm publish ./dist/legacy/shotium $flags

      - name: the legacy name is actually there
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          # Publication can precede CDN visibility by 15 minutes. Wait before
          # declaring success; a timeout requires registry inspection, not blindly
          # republishing already accepted immutable versions.
          wait_for() {
            for pkg in "$@"; do
              url="https://registry.npmjs.org/$pkg/$VERSION"
              for attempt in $(seq 1 45); do
                code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
                [ "$code" = "200" ] && break
                sleep 20
              done
              echo "$code  $pkg@$VERSION"
              [ "$code" = "200" ] || { echo "Registry visibility timed out; inspect publication before retrying." >&2; exit 1; }
            done
          }
          wait_for @shotkit/shotium

      - name: release
        if: ${{ env.RELEASE == 'true' && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # Last, and only because npm got there first. --target pins it to the
        # commit the tag is on, which is the commit npm's provenance attests
        # to. The engines may predate it: they were built from a tree with
        # the same fingerprint, which is the same engine inputs, and the
        # notes say which runs built them.
        #
        # Not a draft. A draft release does not create the tag -- but the tag
        # already exists here, because it is what started this run, so there is
        # nothing left for a human to click.
        run: |
          {
            echo "## @pixel.js/shotium $VERSION"
            echo
            echo "### 📦 安装 / Installation"
            echo
            echo '```bash'
            echo "# pnpm 9.15.9"
            echo "pnpm add @pixel.js/shotium@$VERSION"
            echo '```'
            echo
            echo "Also published as \`@shotkit/shotium@$VERSION\`, the previous name: a compatibility alias that depends on this package. Existing installs keep updating without changes. / 同时以旧包名 \`@shotkit/shotium@$VERSION\` 发布为兼容别名包，依赖本包；已有项目无需改动。"
            echo
            echo "---"
            echo
            echo "### CLI and C ABI / 独立命令行与动态库"
            echo "- **English**: Download \`shotium-cli-<platform>.7z\` for the CLI, or \`shotium-c-abi-<platform>.7z\` for the shared library, header and guides. Each archive includes its own resource packs. npm installs its platform package automatically."
            echo "- **简体中文**：命令行用户下载 \`shotium-cli-<平台>.7z\`；语言集成下载 \`shotium-c-abi-<平台>.7z\`，其中包含动态库、头文件和接入说明。两类包各自包含资源文件；npm 用户由包管理器自动安装平台依赖。"
            echo
            echo "---"
            echo
            echo "### Language examples / 语言示例"
            echo "Download \`shotium-example-<language>.7z\` (go, python, rust, csharp or java) and the matching C ABI platform archive. Example sources contain no native binaries. Archive and root-directory names are stable across releases."
            echo "下载 \`shotium-example-<语言>.7z\` 和对应平台的 C ABI 包。示例包含源码、文档和页面，不内置原生库；附件名和解压目录不带版本号。"
            echo
            echo "### SHA256 verification / 校验"
            echo "One \`SHA256SUMS\` covers all 17 archives (6 CLI, 6 C ABI, 5 examples). Verify the selected downloads against it; downloading every archive is unnecessary."
            echo "统一的 \`SHA256SUMS\` 覆盖全部 17 个压缩包（6 个 CLI、6 个 C ABI、5 个示例），只需校验自己下载的附件。发布共 18 个上传附件，另有 GitHub 自动生成的两个源码包。"
            echo
            echo "### 📝 验证与来源 / Provenance"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Engine fingerprint / 引擎指纹: \`${FINGERPRINT}\` -- the hash of every tracked file the native builds read; the engines were built by / 引擎构建自:"
            for plat in windows-amd64 windows-arm64 linux-amd64 linux-arm64 macos-amd64 macos-arm64; do
              run=$(jq -r .run_id "dist/node/$plat/provenance.json")
              echo "  - $plat: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run"
            done
            echo "- npm provenance attests the publish run (this one), which packaged the engines above / npm Provenance 证明的是本次发布运行，它打包了上面的引擎。"
          } > /tmp/notes.md

          # The .7z archives and not the .tgz files. A platform package's home
          # is the registry: once npm has it, a copy here is a second place to
          # get the same bytes, one of which nothing resolves against and
          # neither of which says which is current. They were on the v0.1.0
          # release only because that is where the engine workflows staged
          # them for publishing, which is now what artifacts are for.
          pnpm package:checksums --dir dist/release --check
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --notes-file /tmp/notes.md \
            dist/release/*.7z dist/release/SHA256SUMS

      - name: dispatch the published-version benchmark
        if: ${{ env.RELEASE == 'true' && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made by GITHUB_TOKEN does not recursively trigger ordinary
        # release-event workflows. workflow_dispatch is the documented
        # exception, so schedule the exact package version explicitly after
        # both npm and the GitHub Release have succeeded. This records release
        # quality but cannot roll back or block the version that now exists.
        run: |
          gh workflow run benchmark.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f shotium_version="$VERSION" \
            -f profile=full \
            -f commit_results=true \
            -f seed="$GITHUB_SHA" \
            -f source_sha="$GITHUB_SHA"
