# Publishes the seven packages to npm, then announces them as a release.
#
# The tag is the trigger, not the product. Pushing `vX.Y.Z` starts this; there
# is no button to press afterwards and no draft to remember to publish. That
# ordering is the whole point of the file, so it is worth saying what the
# previous one did instead: the six platform packages accumulated on a draft
# release, a human dispatched this workflow, and the tag came into existence
# only when someone finally clicked publish on the draft. v0.1.0 spent an hour
# fully published on npm with no tag in the repository at all, and the draft it
# was waiting on pointed fifteen commits back -- at the first engine run that
# happened to create it, since the five after that found the release already
# there and left its target alone. A tag that is created last records whatever
# was true when someone got round to it.
#
# The release is created after npm and only if npm succeeded. Both directions
# of that failure are possible and they are not equally bad: npm-without-a-
# release is a missing announcement, fixed by creating one; a release without
# npm is a published version number that nobody can install, and it is on the
# repository's front page. npm also has no unpublish worth relying on, so the
# irreversible half goes first and the reversible half confirms it.
#
# The bytes come from workflow artifacts, not from release assets. An artifact
# belongs to a run and a run belongs to a commit, so asking for the artifacts
# at $GITHUB_SHA cannot return a binary built from a different tree. Release
# assets carry no such link -- anything uploaded under a tag looks like it
# belongs to that tag.
#
# ---------------------------------------------------------------------------
# The release procedure, which this workflow is only the last step of:
#
#   1. Bump the version in shotium/package.json. SEVEN lines: `version`, and
#      the six optionalDependencies that pin the platform packages to it. They
#      must match exactly -- checks.yml fails the build if they do not.
#   2. Commit and push. Wait for checks.yml.
#   3. Run the six engine workflows against that commit. This is the slow part
#      and it comes before the tag for a reason: the version is stamped into
#      the platform tarballs, both in the filename and in the package.json
#      inside, so a tarball built before step 1 carries the old version and is
#      useless. Artifacts from an earlier commit cannot be reused across a
#      version bump.
#   4. All six green -- `git tag vX.Y.Z && git push origin vX.Y.Z`.
#   5. This runs.
#
# Step 3 before step 4 is the one part of that order people get wrong, and the
# failure is late: everything looks fine until the collect step below reports
# a platform missing at this commit.
# ---------------------------------------------------------------------------
#
# Publishing order within the job is also not cosmetic. @shotkit/shotium
# declares the six as optionalDependencies pinned to its own version, so it
# goes last: a registry that has the main package but not the platform package
# it names hands out an install that cannot take a screenshot.
#
# There is no npm token. This workflow authenticates by trusted publishing:
# GitHub mints a short-lived OIDC token for the job, npm checks that its
# claims -- this repository, this workflow file -- match what the package has
# on record, and issues credentials good for that one publish. Nothing
# long-lived exists to leak, and a stolen workflow file is useless because the
# claims are asserted by GitHub rather than by the workflow.
#
# Two consequences of that, both of which have bitten people:
#
#   - The filename matters. npm records `publish.yml`, not the `name:` below
#     and not the job id, so renaming this file silently invalidates every
#     trusted publisher configured against it. Rename it and you are back to
#     "404 Not Found" on publish, which is what npm returns when it cannot
#     tell an unauthenticated caller from an unauthorised one. Changing the
#     trigger, as this commit does, is safe for the same reason: the claim is
#     about the file, not about how it started.
#   - Each of the seven packages carries its own trusted publisher, set on
#     npmjs.com under the package's settings, and npm has no way to configure
#     one for a package that does not exist yet. Hence the 0.0.1 placeholders:
#     publish once by hand, attach the publisher, and every version after that
#     comes from here.
#
# Provenance follows from the same token and is on by default -- a signed
# statement, in a public transparency log, that these bytes came out of this
# workflow at this commit. It needs every package.json to carry a `repository`
# that matches this repository, case for case, or the publish fails outright.
# The six platform manifests inherit theirs from shotium/package.json in
# tools/shot/make_platform_package.cjs, so a platform tarball built before that
# field existed cannot be published from here. Rebuild it rather than reaching
# for --no-provenance; an unattested engine binary is the one package in the
# seven where the attestation is worth something.
#
# workflow_dispatch remains, for rehearsal only. It publishes nothing unless
# dry_run is turned off, it never creates a release, and it reads the version
# from the tree rather than from a tag. A dry run does not authenticate, so it
# proves the tarballs and the versions and nothing about the trust
# configuration.

name: npm publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'rehearse against this ref and publish nothing'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # The OIDC token. Without it npm has nothing to check and falls back to
      # looking for a token it will not find.
      id-token: write
      # Creating the release at the end.
      contents: write
      # Reading artifacts that belong to the engine runs, which are other
      # workflows' runs. contents:write does not cover that.
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      # No registry-url, and so no .npmrc: setup-node's registry-url exists to
      # write an _authToken line pointing at NODE_AUTH_TOKEN, and an .npmrc
      # naming an empty token is worse than no .npmrc at all -- npm sends the
      # empty credential instead of asking for an OIDC one.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: an npm that can do this
        # Trusted publishing landed in npm 11.5.1. Node 24 ships something
        # newer than that already, but the runner image's bundled npm is not a
        # thing this repository controls, and the failure if it is too old is
        # an authentication error that says nothing about versions.
        run: |
          pnpm add --global npm@latest
          echo "node $(node --version), npm $(npm --version)"

      - name: what this run is
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        # Two triggers, one job. A tag push is always for real and takes its
        # version from the tag; a dispatch is a rehearsal and takes it from the
        # tree. Deciding that once, here, keeps every step below from having to
        # ask which one it is.
        run: |
          version=$(node -p "require('./shotium/package.json').version")
          if [ "$EVENT" = "push" ]; then
            tag="$REF_NAME"
            dry_run=false
            release=true
          else
            tag="v$version"
            dry_run="${INPUT_DRY_RUN:-true}"
            release=false
          fi
          {
            echo "TAG=$tag"
            echo "VERSION=$version"
            echo "DRY_RUN=$dry_run"
            echo "RELEASE=$release"
          } >> "$GITHUB_ENV"
          echo "event=$EVENT tag=$tag version=$version" \
               "dry_run=$dry_run release=$release"

      - name: the tag and the package agree
        # A tag that does not match the version in the tree publishes the wrong
        # number under the right name, which cannot be taken back. On a
        # dispatch this is a tautology; on a tag push it is the check that
        # catches a tag pushed before the version bump was committed.
        run: |
          if [ "v$VERSION" != "$TAG" ]; then
            echo "shotium/package.json is $VERSION, the tag is $TAG"
            echo "the tag must be pushed after the version bump, not before"
            exit 1
          fi
          echo "publishing $VERSION"

      - name: build the main package
        working-directory: shotium
        # The package is TypeScript and dist/ is not committed, so until this
        # runs there is nothing to publish. `npm publish ./shotium` would run
        # prepack and build it anyway -- but it would do that after the six
        # platform packages were already public, and a build failure has to
        # land before anything is irreversible rather than between the sixth
        # package and the seventh.
        run: |
          pnpm install --no-lockfile
          pnpm run build
          node -e '
            const fs = require("fs");
            for (const f of ["dist/index.js", "dist/index.d.ts",
                             "dist/daemon_main.js"]) {
              if (!fs.existsSync(f)) throw new Error("no " + f);
            }
            console.log("ok");
          '

      - name: collect the engine artifacts for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        # Every engine run that succeeded at this exact commit, and the
        # artifacts belonging to it. Not "the most recent run" and not a
        # release's assets: an artifact is reachable only through the run that
        # produced it, and a run names one commit, so nothing built from
        # another tree can arrive here by accident.
        #
        # Two artifacts per platform. The .tgz is what npm publishes; the .7z
        # is the standalone engine, which goes on the release for people who
        # want the binary without npm.
        #
        # All six, by name, rather than a glob over what happens to be there: a
        # missing architecture must stop the run, not produce a main package
        # pointing at a platform package that was never published.
        run: |
          mkdir -p dist/npm dist/archive

          gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --status success --limit 100 --json databaseId,name \
            -q '.[] | select(.name | startswith("engine")) | .databaseId' \
            > /tmp/runs.txt
          echo "engine runs that succeeded at $GITHUB_SHA:"
          sed 's/^/  /' /tmp/runs.txt

          # The artifact name says which run holds it; the runs themselves are
          # indistinguishable from here, since one workflow file builds both
          # architectures and the arch is an input rather than part of the run
          # name. So ask each run in turn and take the first that has it.
          fetch() {
            for run in $(cat /tmp/runs.txt); do
              if gh run download "$run" --repo "$GITHUB_REPOSITORY" \
                   --name "$1" --dir "$2" >/dev/null 2>&1; then
                echo "  $1 <- run $run"
                return 0
              fi
            done
            echo "  $1 -- NOT FOUND at this commit"
            return 1
          }

          fail=0
          # npm platform id : engine workflow's platform id. They differ:
          # npm wants process.platform, the engine archives were named for
          # people.
          for pair in win32-x64:win-x64 win32-arm64:win-arm64 \
                      darwin-x64:mac-x64 darwin-arm64:mac-arm64 \
                      linux-x64:linux-x64 linux-arm64:linux-arm64; do
            engine=${pair##*:}
            fetch "npm-shotium-$engine" dist/npm     || fail=1
            fetch "shotium-$engine"     dist/archive || fail=1
          done

          if [ "$fail" = 1 ]; then
            echo
            echo "Something this tag needs was not built at $GITHUB_SHA."
            echo "The engine workflows have to run against the commit the tag"
            echo "points at, after the version bump: the version is stamped"
            echo "into the tarball, so an older build carries the wrong one."
            exit 1
          fi

          # The filenames, too, and not just the artifacts. An artifact named
          # for a platform can still hold a tarball built at the wrong version
          # if someone dispatched the engine workflow against an older tree.
          for plat in win32-x64 win32-arm64 darwin-x64 darwin-arm64 \
                      linux-x64 linux-arm64; do
            f="dist/npm/shotkit-shotium-$plat-$VERSION.tgz"
            if [ ! -f "$f" ]; then
              echo "$f is missing -- the artifact holds:"
              ls dist/npm
              exit 1
            fi
          done

          ls -l dist/npm dist/archive

      - name: every tarball names this repository
        env:
          REPO: ${{ github.repository }}
        # Provenance compares package.json's repository against this one and
        # rejects a mismatch, after uploading. Six tarballs published and the
        # seventh refused is the worst outcome available here, so the check
        # happens before anything is sent -- and on the tarballs themselves,
        # not on the tree, because the tree is not what gets published.
        run: |
          fail=0
          for tarball in dist/npm/*.tgz; do
            url=$(tar -xzOf "$tarball" package/package.json \
                  | node -e 'let s="";process.stdin.on("data",d=>s+=d)
                             .on("end",()=>{const r=JSON.parse(s).repository
                               process.stdout.write(
                                 (r && (r.url || r)) || "")})')
            case "$url" in
              *"github.com/$REPO"*) ;;
              '') echo "$tarball has no repository field"; fail=1 ;;
              *)  echo "$tarball says $url, not $REPO"; fail=1 ;;
            esac
          done
          if [ "$fail" = 1 ]; then
            echo "rebuild the engine workflows: the tarballs predate the" \
                 "repository field, and provenance will refuse them"
            exit 1
          fi
          echo "all six name $REPO"

      - name: publish
        # --access public because the scope is new and npm defaults a scoped
        # package to restricted, which would publish successfully and install
        # for nobody.
        run: |
          flags="--access public"
          if [ "$DRY_RUN" = "true" ]; then
            flags="$flags --dry-run"
            echo "=== dry run: nothing below becomes public ==="
          fi
          for tarball in dist/npm/*.tgz; do
            echo "--- $tarball"
            npm publish "$tarball" $flags
          done
          echo "--- shotium"
          npm publish ./shotium $flags

      - name: the packages are actually there
        if: ${{ env.DRY_RUN != 'true' }}
        # `npm publish` prints `+ name@version` on success -- and prints the
        # same line on a dry run, which makes it useless as evidence on its
        # own. So ask the registry. A 404 here is not proof of failure either:
        # the CDN took several minutes to serve one of the seven at v0.1.0
        # while npm had already accepted it. Hence the retry, and hence this
        # being a report rather than a gate -- the publish already happened
        # and cannot be undone by failing the job.
        continue-on-error: true
        run: |
          for pkg in shotium-win32-x64 shotium-win32-arm64 \
                     shotium-darwin-x64 shotium-darwin-arm64 \
                     shotium-linux-x64 shotium-linux-arm64 shotium; do
            url="https://registry.npmjs.org/@shotkit/$pkg/$VERSION"
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              [ "$code" = "200" ] && break
              sleep 20
            done
            echo "$code  @shotkit/$pkg@$VERSION"
          done

      - name: release
        if: ${{ env.RELEASE == 'true' && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # Last, and only because npm got there first. --target pins it to the
        # commit the tag is on, which is also the commit every artifact above
        # came from and the commit npm's provenance attests to; all three agree
        # by construction rather than by anyone checking.
        #
        # Not a draft. A draft release does not create the tag -- but the tag
        # already exists here, because it is what started this run, so there is
        # nothing left for a human to click.
        run: |
          {
            echo "## @shotkit/shotium $VERSION"
            echo
            echo "### 📦 安装 / Installation"
            echo
            echo '```bash'
            echo "# pnpm 9.15.9"
            echo "pnpm add @shotkit/shotium@$VERSION"
            echo '```'
            echo
            echo "---"
            echo
            echo "### 🚀 独立可执行文件 / Standalone Binaries"
            echo "- **English**: The attached \`.7z\` archives contain the standalone engine (executables, shared libraries, and resource packs) for environments without Node.js. If you are using \`@shotkit/shotium\` via npm/pnpm/yarn/bun, platform dependencies are installed automatically and you do not need to download these archives manually."
            echo "- **简体中文**：下方附加的 \`.7z\` 压缩包为独立引擎二进制文件（包含单文件命令行工具、共享库及资源包），适用于无 Node.js 的运行环境。若通过 npm/pnpm/yarn/bun 安装使用，包管理器会自动下载对应的预编译平台依赖，无需手动下载此处的附件。"
            echo
            echo "---"
            echo
            echo "### 📝 验证与来源 / Provenance"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Verified with npm provenance / 已通过 npm 官方签名与 Provenance 溯源验证。"
          } > /tmp/notes.md

          # The .7z archives and not the .tgz files. A platform package's home
          # is the registry: once npm has it, a copy here is a second place to
          # get the same bytes, one of which nothing resolves against and
          # neither of which says which is current. They were on the v0.1.0
          # release only because that is where the engine workflows staged
          # them for publishing, which is now what artifacts are for.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --notes-file /tmp/notes.md \
            dist/archive/*.7z

      - name: dispatch the published-version benchmark
        if: ${{ env.RELEASE == 'true' && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made by GITHUB_TOKEN does not recursively trigger ordinary
        # release-event workflows. workflow_dispatch is the documented
        # exception, so schedule the exact package version explicitly after
        # both npm and the GitHub Release have succeeded. This records release
        # quality but cannot roll back or block the version that now exists.
        run: |
          gh workflow run benchmark.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f shotium_version="$VERSION" \
            -f profile=full \
            -f commit_results=true \
            -f seed="$GITHUB_SHA" \
            -f source_sha="$GITHUB_SHA"
