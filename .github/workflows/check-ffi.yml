# The engine, exercised the way users receive it: the five language demos
# against the extracted CLI and C ABI archives, and a clean npm install of
# the platform package assembled from the node archive -- the same
# `package:platform --from-archive` path publish.yml takes, so what this
# checks is what ships. Runs on the architecture the engine is for, which
# for arm64 Windows and Linux is the only place the binary ever executes.
#
# The evidence artifact carries the engine's fingerprint, and it is uploaded
# only on success: publish.yml treats an engine as usable when the run that
# built it also produced this evidence.
name: check-ffi

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        description: 'public platform label: windows-amd64 ... macos-arm64'
        type: string
        required: true
      artifact:
        description: 'the engine artifact of this run: engine-<platform>-<fingerprint>'
        type: string
        required: true
      evidence:
        description: 'what to call the evidence: ffi-evidence-<platform>-<fingerprint>'
        type: string
        required: true

jobs:
  examples:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.3'
          cache-dependency-path: apps/go/go.sum
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ runner.os == 'Windows' && 'microsoft' || 'temurin' }}
          java-version: '21'
      - name: Rust toolchain
        shell: bash
        run: |
          toolchain=stable
          if [[ "$RUNNER_OS" == "Windows" && "$RUNNER_ARCH" == "ARM64" ]]; then toolchain=stable-aarch64-pc-windows-msvc; fi
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: out/ffi-archive
      - name: tooling and archive extraction
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          pnpm -C scripts install --frozen-lockfile
          sevenzip=$(command -v 7zz || command -v 7z || command -v 7za || true)
          if [ -z "$sevenzip" ]; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then brew install sevenzip;
            elif [[ "$RUNNER_OS" == "Linux" ]]; then sudo apt-get update && sudo apt-get install -y p7zip-full;
            fi
            sevenzip=$(command -v 7zz || command -v 7z || command -v 7za || true)
          fi
          [ -n "$sevenzip" ] || { echo "7-Zip is required" >&2; exit 1; }
          for archive in out/ffi-archive/*.7z; do "$sevenzip" x "$archive" -oout/ffi-native; done
          pnpm package:examples --dest out/language-examples --sevenzip "$sevenzip"
          for archive in out/language-examples/*.7z; do "$sevenzip" x "$archive" -oout/language-sources; done
          platform=$PLATFORM
          case "$RUNNER_OS" in Windows) os=win;; Linux) os=linux;; macOS) os=mac;; esac
          cpu=${platform#*-}; [ "$cpu" = amd64 ] && cpu=x64
          pnpm package:cli --os "$os" --dest "out/ffi-native/shotium-cli-$platform" --check
          pnpm package:c-abi --os "$os" --dest "out/ffi-native/shotium-c-abi-$platform" --check
          pnpm package:node --os "$os" --dest "out/ffi-native/shotium-node-$platform" --check
          # The npm platform package, from the node archive, exactly as
          # publish.yml assembles it; then packed so verify:delivery installs
          # the tarball a user would get.
          pnpm package:platform --from-archive "out/ffi-archive/shotium-node-$platform.7z" \
            --os "$os" --arch "$cpu" --dest out/ffi-npm-stage --sevenzip "$sevenzip"
          mkdir -p out/ffi-npm
          ( cd "out/ffi-npm-stage/shotium-$os-$cpu" && npm pack --pack-destination ../../ffi-npm )
          pnpm -C apps/typescript install --no-lockfile
          pnpm -C apps/typescript run build
      - name: five language runtimes against the extracted Release
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          platform=$PLATFORM
          cli="out/ffi-native/shotium-cli-$platform/shotium"
          if [[ "$RUNNER_OS" == "Windows" ]]; then cli="$cli.exe"; fi
          for language in go python rust csharp java; do
            pnpm verify:ffi --cli "$cli" --library-dir "out/ffi-native/shotium-c-abi-$platform" \
              --source-dir "out/language-sources/shotium-example-$language" \
              --languages "$language" --output "out/ffi-check/$language"
          done
      - name: clean npm installation without the CLI or the C ABI library
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        # The reference render comes from the CLI extracted above; the npm
        # package no longer carries one, and the check asserts that.
        run: |
          platform=$PLATFORM
          cli="out/ffi-native/shotium-cli-$platform/shotium"
          if [[ "$RUNNER_OS" == "Windows" ]]; then cli="$cli.exe"; fi
          pnpm verify:delivery --platform-dir out/ffi-npm --cli "$cli"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ${{ inputs.evidence }}
          path: |
            out/ffi-check/
            out/delivery-check/report.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
