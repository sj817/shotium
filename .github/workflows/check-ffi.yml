# Exercise the engine exactly as users receive it: five language examples,
# the standalone CLI, the C ABI archive and a clean npm install. glibc,
# Windows and macOS run directly on their native runners; musl runs in an
# Alpine container on the matching native architecture.
name: check-ffi

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        description: 'complete public label, including -musl when applicable'
        type: string
        required: true
      artifact:
        description: 'engine-<platform>-<fingerprint> from this run'
        type: string
        required: true
      evidence:
        description: 'ffi-evidence-<platform>-<fingerprint>'
        type: string
        required: true

jobs:
  examples:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ !endsWith(inputs.platform, '-musl') }}
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        if: ${{ !endsWith(inputs.platform, '-musl') }}
        with:
          version: 9.15.9
      - uses: actions/setup-python@v7
        if: ${{ !endsWith(inputs.platform, '-musl') }}
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7
        if: ${{ !endsWith(inputs.platform, '-musl') }}
        with:
          go-version: '1.25.3'
          cache-dependency-path: apps/go/go.sum
      - uses: actions/setup-dotnet@v6
        if: ${{ !endsWith(inputs.platform, '-musl') }}
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v6
        if: ${{ !endsWith(inputs.platform, '-musl') }}
        with:
          distribution: ${{ runner.os == 'Windows' && 'microsoft' || 'temurin' }}
          java-version: '21'
      - name: Rust toolchain
        if: ${{ !endsWith(inputs.platform, '-musl') }}
        shell: bash
        run: |
          toolchain=stable
          if [[ "$RUNNER_OS" == "Windows" && "$RUNNER_ARCH" == "ARM64" ]]; then toolchain=stable-aarch64-pc-windows-msvc; fi
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: out/ffi-archive

      - name: tooling, archives and npm platform package
        if: ${{ !endsWith(inputs.platform, '-musl') }}
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          pnpm -C scripts install --frozen-lockfile
          sevenzip=$(command -v 7zz || command -v 7z || command -v 7za || true)
          if [ -z "$sevenzip" ]; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then brew install sevenzip;
            elif [[ "$RUNNER_OS" == "Linux" ]]; then sudo apt-get update && sudo apt-get install -y p7zip-full;
            fi
            sevenzip=$(command -v 7zz || command -v 7z || command -v 7za || true)
          fi
          [ -n "$sevenzip" ] || { echo "7-Zip is required" >&2; exit 1; }
          for archive in out/ffi-archive/*.7z; do "$sevenzip" x "$archive" -oout/ffi-native; done
          pnpm package:examples --dest out/language-examples --sevenzip "$sevenzip"
          for archive in out/language-examples/*.7z; do "$sevenzip" x "$archive" -oout/language-sources; done

          case "$RUNNER_OS" in Windows) os=win;; Linux) os=linux;; macOS) os=mac;; esac
          base=${PLATFORM%-musl}
          cpu=${base#*-}; [ "$cpu" = amd64 ] && cpu=x64
          libc_args=()
          if [ "$os" = linux ]; then libc_args=(--libc glibc); fi
          pnpm package:cli --os "$os" --dest "out/ffi-native/shotium-cli-$PLATFORM" --check
          pnpm package:c-abi --os "$os" --dest "out/ffi-native/shotium-c-abi-$PLATFORM" --check
          pnpm package:node --os "$os" --dest "out/ffi-native/shotium-node-$PLATFORM" --check
          if [ "$os" = linux ]; then
            sh scripts/ci/check-linux-deps.sh glibc \
              "out/ffi-native/shotium-cli-$PLATFORM/shotium" \
              "out/ffi-native/shotium-c-abi-$PLATFORM/libshotium.so" \
              "out/ffi-native/shotium-node-$PLATFORM/shotium.node"
          fi
          pnpm package:platform --from-archive "out/ffi-archive/shotium-node-$PLATFORM.7z" \
            --os "$os" --arch "$cpu" "${libc_args[@]}" --dest out/ffi-npm-stage --sevenzip "$sevenzip"
          mkdir -p out/ffi-npm
          (cd "out/ffi-npm-stage/shotium-$os-$cpu" && npm pack --pack-destination ../../ffi-npm)
          pnpm -C apps/typescript install --no-lockfile
          pnpm -C apps/typescript run build

      - name: five language runtimes against the extracted release
        if: ${{ !endsWith(inputs.platform, '-musl') }}
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          cli="out/ffi-native/shotium-cli-$PLATFORM/shotium"
          if [[ "$RUNNER_OS" == "Windows" ]]; then cli="$cli.exe"; fi
          for language in go python rust csharp java; do
            pnpm verify:ffi --cli "$cli" --library-dir "out/ffi-native/shotium-c-abi-$PLATFORM" \
              --source-dir "out/language-sources/shotium-example-$language" \
              --languages "$language" --output "out/ffi-check/$language"
          done

      - name: clean npm installation
        if: ${{ !endsWith(inputs.platform, '-musl') }}
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          cli="out/ffi-native/shotium-cli-$PLATFORM/shotium"
          if [[ "$RUNNER_OS" == "Windows" ]]; then cli="$cli.exe"; fi
          pnpm verify:delivery --platform-dir out/ffi-npm --cli "$cli"

      - name: Alpine musl runtime, network, FFI and npm delivery
        if: ${{ endsWith(inputs.platform, '-musl') }}
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          docker run --rm \
            --env PLATFORM \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            alpine:3.22 sh scripts/ci/check-musl.sh

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ${{ inputs.evidence }}
          path: |
            out/ffi-check/
            out/delivery-check/report.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
