# The checks that do not need an engine binary.
#
# Everything worth knowing about shotium needs a built shotium.exe, and building
# one is hours of compute -- see engine-windows.yml. So this workflow covers the
# half that can be checked in seconds: that the package builds, that the bundle
# it produces loads and refuses a malformed request, that the generated types
# describe it, that the benchmark harness typechecks and passes its unit tests,
# and that the repository scripts typecheck. It runs on every push, and it is
# expected to always be green.
#
# What it deliberately does NOT do is claim the engine works. That claim is made
# by scripts/check-{serve,net,node,daemon,demos,bilibili}.ts against a real
# binary, and the engine-* workflows are where those run.

name: checks

on:
  push:
    branches: [main]
    paths:
      - 'shotium/**'
      - 'shot/testdata/bilibili/**'
      - 'scripts/**'
      - 'apps/benchmark/**'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'shotium/**'
      - 'shot/testdata/bilibili/**'
      - 'scripts/**'
      - 'apps/benchmark/**'
      - '.github/workflows/checks.yml'
  workflow_dispatch:

jobs:
  # Every job name below carries the package version. A job name can
  # read an earlier job's outputs but not a file, so one small job
  # reads package.json first.
  meta:
    name: "resolve: shotium"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: shotium/package.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(jq -r .version shotium/package.json)" >> "$GITHUB_OUTPUT"

  package:
    name: "check-package: shotium-v${{ needs.meta.outputs.version }}"
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: repository scripts typecheck
        working-directory: scripts
        # scripts/ is where new tooling goes, in TypeScript (CLAUDE.md rule 11).
        # Its lockfile is committed, so this is the one install here that can
        # be frozen.
        run: |
          pnpm install --frozen-lockfile
          pnpm run check:types

      - name: the build tooling
        working-directory: shotium
        # No frozen lockfile here, and it has to be. The six
        # platform packages are optionalDependencies pinned to this version,
        # and that version does not exist on the registry until a release is
        # cut -- so a lockfile cannot resolve them yet. `--no-optional` does
        # not help either: it would also skip
        # rolldown's own native binding, which the build needs. The
        # devDependencies are pinned exactly rather than by caret for this
        # reason. `--no-lockfile` makes the exception explicit.
        run: pnpm install --no-lockfile

      - name: build
        working-directory: shotium
        # Everything below is checked against dist/, because dist/ is what npm
        # publishes. Nothing a caller loads is committed to this repository.
        run: pnpm run build

      - name: types
        working-directory: shotium
        # Two things at once. That src/ typechecks -- tsdown emits declarations
        # without running the checker, so a green build says nothing about
        # that. And that test/consumer.ts compiles: it imports the package by
        # name, through the `exports` map, against the .d.ts that was just
        # generated, which is the only thing here that would notice a map
        # pointing at a file that is not written.
        run: pnpm run check:types

      - name: the package loads
        working-directory: shotium
        # Loading it must not start anything. Blink starts once per process and
        # cannot be restarted, so an import that started the engine would spend
        # the one start a caller gets -- and it would do it on a machine that
        # merely required the package to read its version.
        #
        # require() rather than import, because the package is an ES module and
        # a CommonJS caller reaching one is the case that breaks first. It needs
        # node 22.12 or 20.19, which this job has.
        #
        # There is no addon on this runner, and that is the point: none of this
        # may touch one. The engine ships in a platform package that is an
        # optionalDependency, so a machine with no build for it still has to be
        # able to load the package and get a legible error later.
        run: |
          node -e '
            const s = require("./dist/index.js");
            if (typeof s.screenshot !== "function") throw new Error("no screenshot()");
            if (typeof s.runtime.start !== "function") throw new Error("no runtime.start()");
            if (typeof s.daemon.connect !== "function") throw new Error("no daemon.connect()");
            if (s.runtime.running) throw new Error("importing started the engine");
            if (s.default.runtime !== s.runtime) throw new Error("default and named exports disagree");
            console.log("ok");
          '

      - name: options are validated before the engine is touched
        working-directory: shotium
        # toRequest() is the only check that can be made without an engine, and
        # it has to happen first -- on this runner there is no addon to load, so
        # a request that reached the engine would fail with "no engine for this
        # platform" and the validation would never be reached. `running` staying
        # false is the half of this that actually needs asserting.
        run: |
          node -e '
            const {Runtime} = require("./dist/index.js");
            const r = new Runtime();
            const rejects = async (method, options, what) => {
              // screenshot() is async, so a bad request is a rejected promise
              // rather than a throw.
              let rejected;
              await r[method](options).then(
                  () => { throw new Error("accepted " + what); },
                  (error) => { rejected = error; });
              if (!(rejected instanceof TypeError)) {
                throw new Error("did not reject " + what + " as a TypeError");
              }
              if (r.running) throw new Error("started the engine for " + what);
            };
            (async () => {
              await rejects("screenshot", {}, "a request with no file");
              await rejects("screenshot", {file: "x", fullpage: true}, "a misspelled option");
              for (const height of [0, 32001, 1.5, NaN, Infinity]) {
                await rejects("screenshotTiles", {file: "x", tile: {height}},
                              "invalid tile.height " + height);
              }
              console.log("ok");
            })().catch((e) => { console.error(e.message); process.exit(1); });
          '

      - name: daemon wire generations are isolated and negotiated
        run: pnpm verify:daemon-protocol

      - name: Bilibili fixtures are complete and offline
        run: pnpm verify:bilibili --fixtures-only

      - name: repository script unit tests
        run: pnpm scripts:test

      - name: the six platform packages are declared consistently
        working-directory: shotium
        # The list of six exists twice: in optionalDependencies, which is what
        # the package manager installs, and in the lookup table that goes looking for them
        # afterwards. A rename that touches one and not the other installs
        # the engine and then reports that there is no engine for this
        # platform.
        #
        # Read back out of the bundle rather than out of src/, because the
        # bundle is what ships: a table that is right in the source and wrong
        # in the build is exactly the failure this exists to catch.
        #
        # The version is pinned rather than ranged for the same class of
        # reason: seven packages that must be installed together cannot be
        # allowed to drift apart by a caret.
        run: |
          node -e '
            const fs = require("fs");
            const pkg = require("./package.json");
            const bundle = fs.readdirSync("dist")
                .filter((f) => f.endsWith(".js"))
                .map((f) => fs.readFileSync("dist/" + f, "utf8"))
                .join("\n");
            const used = [...new Set(bundle.match(
                /@shotkit\/shotium-[a-z0-9]+-[a-z0-9]+/g) || [])].sort();
            const declared = Object.keys(pkg.optionalDependencies || {}).sort();
            if (declared.join(",") !== used.join(",")) {
              throw new Error("optionalDependencies and the bundle disagree:\n  " +
                  declared.join(" ") + "\n  " + used.join(" "));
            }
            if (used.length !== 6) {
              throw new Error(used.length + " platform packages, expected 6");
            }
            for (const [name, pin] of Object.entries(pkg.optionalDependencies)) {
              if (pin !== pkg.version) {
                throw new Error(name + " is pinned to " + pin + ", not " + pkg.version);
              }
            }
            console.log("ok: 6 platform packages at " + pkg.version);
          '

      - name: the tarball holds what it should and nothing else
        working-directory: shotium
        # `npm pack --dry-run` is the only way to see what `files` actually
        # resolves to. It runs prepack, so it also demonstrates that a publish
        # from a clean checkout builds the package rather than shipping
        # whatever dist/ happened to contain.
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const fs = require("fs");
            // prepack writes to the same stdout, so the JSON is the tail of
            // the file rather than the whole of it. Found by the line it
            // starts on and not by the first "[": on a runner tsdown colours
            // its output, and the first "[" in the file belongs to an ANSI
            // escape. Every line npm and tsdown write before this one begins
            // with a glyph or an escape, so column zero is the array.
            const raw = fs.readFileSync("pack.json", "utf8");
            const at = raw.search(/^\[/m);
            if (at < 0) throw new Error("npm pack --json printed no array");
            const [entry] = JSON.parse(raw.slice(at));
            const names = entry.files.map((f) => f.path).sort();
            const missing = ["dist/index.js", "dist/index.d.ts",
                             "dist/daemon_main.js",
                             "package.json", "README.md"]
                .filter((f) => !names.includes(f));
            if (missing.length) {
              throw new Error("not in the tarball: " + missing.join(" "));
            }
            const strays = names.filter(
                (f) => !/^(dist|src|native)\//.test(f) &&
                       !["package.json", "README.md"].includes(f));
            if (strays.length) {
              throw new Error("unexpected in the tarball: " + strays.join(" "));
            }
            console.log("ok: " + names.length + " files, " + entry.size + " bytes");
          '
          rm -f pack.json

  harness:
    name: "check-harness: shotium-v${{ needs.meta.outputs.version }}"
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: apps/benchmark

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/benchmark/pnpm-lock.yaml

      - name: the benchmark harness
        working-directory: apps/benchmark
        # No browsers. This job checks the harness, not the engines it drives,
        # and downloading three Chromiums would cost more than everything else
        # in this workflow put together.
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: typecheck and unit tests
        working-directory: apps/benchmark
        # Nothing ran these on push before, so a change to the harness was only
        # ever exercised by dispatching the six-platform benchmark by hand --
        # which is how a deadlocking process sampler reached all ten Windows
        # jobs of a full run and burned 15 runner-hours printing nothing.
        run: pnpm run check
