# Builds //shot:shot on macOS, natively, on x64 or arm64.
#
# The two runners are not the same machine, and the difference decides which
# one to trust first. GitHub documents macos-15-intel as 4 CPUs and 14 GB of
# RAM, which is the same class as the Linux and Windows runners; the arm64
# images (macos-14, macos-15) are 3 CPUs and 7 GB. Blink's Jumbo translation
# units peak around 1.2 GB each, so 7 GB is what sets `jobs` low rather than
# any preference -- and it is the reason x64 is the default here.
#
# Xcode comes from the runner. Chromium normally builds Mac with a hermetic
# Xcode fetched through an internal CIPD path, and build_overrides/build.gni
# decides between them by asking should_use_hermetic_xcode.py whether that
# hermetic copy is present. On a public runner it is not, so the answer is the
# system Xcode; `use_system_xcode = true` is set anyway so the build does not
# depend on that inference. The assert in mac_sdk.gni that would object to
# system Xcode in an official build is gated on is_chrome_branded, which is
# false here.
#
# As with Linux, `probe` runs sync + gn gen + `ninja -n` and stops. Every
# configuration error shows up there in about half an hour instead of four
# hours later at a link failure, and macOS is the platform most likely to have
# them: nothing in this tree has ever been compiled for it.
name: engine-macos
run-name: "engine-macos: ${{ inputs.arch }} ${{ inputs.mode }} (${{ inputs.shards }} shards)"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe (sync + gn gen + ninja -n) or build'
        type: choice
        options: [probe, build]
        default: probe
      arch:
        description: 'amd64 (macos-15-intel, 14 GB RAM) or arm64 (macos-15, 7 GB)'
        type: choice
        options: [amd64, arm64]
        default: amd64
      jobs:
        description: 'ninja -j (blink TUs peak at ~1.2 GB; arm64 has 7 GB total)'
        default: '3'
      run_checks:
        description: 'run the check suites if the build finishes'
        type: boolean
        default: true
      shards:
        description: 'auto: one runner when a build directory saved at this fingerprint exists, platform defaults otherwise; integer: explicit shard count'
        default: auto

  # engine.yml calls this for every architecture it finds missing at the
  # current fingerprint; the dispatch above stays for building one platform
  # by hand. Both declare the same inputs, because every step below reads
  # `inputs.*` -- never `github.event.inputs`, which under workflow_call is
  # the caller's event and would silently skip every conditional step.
  workflow_call:
    inputs:
      mode:
        type: string
        default: build
      arch:
        type: string
        required: true
      fingerprint:
        description: 'the engine fingerprint the artifacts are named after; computed here when empty'
        type: string
        default: ''
      jobs:
        type: string
        default: '3'
      run_checks:
        type: boolean
        default: true
      shards:
        type: string
        default: auto

# GN and the Node SDK spell the 64-bit architecture x64; the names
# people see spell it amd64. The build-directory artifacts are named with
# the public spelling; the toolchain cache keeps the GN one.
env:
  SHOT_CPU: ${{ inputs.arch == 'arm64' && 'arm64' || 'x64' }}

jobs:
  # Every job name below carries the engine fingerprint, and every artifact
  # is named after it. A job name can read an earlier job's outputs but not
  # a file, so one small job computes it first, along with how many shards
  # to use and which saved build directory to start from.
  meta:
    permissions:
      contents: read
      actions: read
    name: "resolve: shotium-macos-${{ inputs.arch }}"
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      compile_shards: ${{ steps.shards.outputs.list }}
      shard_count: ${{ steps.shards.outputs.count }}
      final_shard: ${{ steps.shards.outputs.final }}
      build_dir_run_id: ${{ steps.shards.outputs.build_dir_run_id }}
    steps:
      # A blobless sparse checkout: `git ls-tree` reads trees, which it has,
      # and the fingerprint reads nothing else.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            package.json
            scripts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - run: pnpm -C scripts install --frozen-lockfile
      - id: fingerprint
        env:
          FROM_CALLER: ${{ inputs.fingerprint }}
        # The caller computed it for the tree it is building; a dispatch
        # computes it here. Either way it names every artifact of this run.
        run: |
          if [ -n "$FROM_CALLER" ]; then
            echo "fingerprint=$FROM_CALLER" >> "$GITHUB_OUTPUT"
            echo "$FROM_CALLER (from the caller)"
          else
            pnpm ci:fingerprint --output
          fi
      - id: shards
        env:
          GH_TOKEN: ${{ github.token }}
          SHOT_PLATFORM: macos
          SHOT_SHARDS: ${{ inputs.shards }}
          SHOT_FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: pnpm ci:select-shards

  # Sharding. ninja's idea of "up to date" is the outputs plus .ninja_log and
  # .ninja_deps, and N runners that ran the same gn gen share one graph. So
  # each shard builds every Nth object of the graph (with whatever generated
  # files and host tools that needs), tars what it built with its two logs,
  # and the final job transplants the tars into its own build directory
  # (scripts/build/shards.ts merge) and finds only the link left to do.
  # Measured on Linux amd64: 73 minutes cold as one job, 47 as four shards
  # plus the final job; a warm run 18 minutes.
  #
  # These jobs are slices 0 to N-2. The last slice is the final job's, and it
  # starts with them rather than after them: the setup is the same work --
  # source, DEPS, gn gen, 13 minutes on Windows -- and running it after the
  # shards instead of beside them added that to every run for nothing.
  #
  # Every shard restores the build-directory cache too, so a warm run costs
  # what it did before sharding: a shard whose slice is already built packs
  # nothing (--since keeps the cache's files out of the tar). What travels
  # is more than objects: the generated sources GN writes at gen time (the
  # jumbo units) and the depfiles of edges that keep theirs on disk, because
  # the final job's own gn gen would write them newer than the objects and
  # ninja would rebuild everything below them.
  compile:
    name: "compile: shotium-macos-${{ inputs.arch }}-${{ needs.meta.outputs.fingerprint }} ${{ matrix.shard }}/${{ needs.meta.outputs.shard_count }}"
    needs: meta
    if: inputs.mode == 'build' && needs.meta.outputs.shard_count != '1'
    runs-on: ${{ inputs.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.meta.outputs.compile_shards) }}

    env:
      DEPOT_TOOLS_UPDATE: '0'

    steps:
      # Everything this job writes from here on is newer than this moment;
      # everything the build-directory cache restores is older. That is how
      # the pack step tells the shard's own work from the cache's.
      - name: remember when this job started
        run: date +%s > /tmp/job-started

      # The setup steps live in .github/actions/macos-source so the shards and
      # this job cannot drift apart. A local action has to be on disk before it
      # can be used, hence the sparse checkout of .github first.
      - name: this repository's actions
        uses: actions/checkout@v7
        with:
          path: actions
          sparse-checkout: .github/actions

      - name: source, DEPS, build directory, gn gen
        uses: ./actions/.github/actions/macos-source
        with:
          arch: ${{ inputs.arch }}
          cpu: ${{ env.SHOT_CPU }}
          platform: macos-${{ inputs.arch }}
          build-dir-run-id: ${{ needs.meta.outputs.build_dir_run_id }}

      - name: this shard's slice of the objects
        working-directory: src
        # -t inputs walks the graph below the two engine targets and names
        # every file it would read, objects included, in every toolchain.
        # `slice` spreads them by cost -- last run's durations from the
        # restored .ninja_log, or an estimate from the path -- longest first
        # onto the least-loaded shard, so the shards finish together; every
        # shard computes the same assignment from the same inputs.
        run: |
          ninja -C out/Shot -t inputs shot shot_c shot_node | grep -E '\.o$' \
            | pnpm --silent build:shards slice --build-dir out/Shot \
                --shards '${{ needs.meta.outputs.shard_count }}' --index '${{ matrix.shard }}' > /tmp/slice.txt

      - name: ninja
        working-directory: src
        continue-on-error: true
        timeout-minutes: 280
        # -k 0 so one shard's log names every broken unit in its slice, and
        # continue-on-error so what did compile still reaches the final job,
        # which is where the failure is reported.
        # stdin, not xargs -a: BSD xargs on macOS has no -a.
        run: xargs ninja -C out/Shot -j ${{ inputs.jobs }} -k 0 < /tmp/slice.txt

      - name: pack what this shard built
        working-directory: src
        run: |
          pnpm --silent build:shards list --build-dir out/Shot --since "$(cat /tmp/job-started)" > /tmp/built.txt
          echo "$(wc -l < /tmp/built.txt) outputs built by this shard"
          tar --format=pax -C out/Shot -cf "$GITHUB_WORKSPACE/shard.tar" -T /tmp/built.txt .ninja_log .ninja_deps
          ls -l "$GITHUB_WORKSPACE/shard.tar"

      - name: upload the shard
        uses: actions/upload-artifact@v7
        with:
          name: shard-macos-${{ inputs.arch }}-${{ matrix.shard }}
          path: shard.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  build:
    name: "${{ inputs.mode }}: shotium-macos-${{ inputs.arch }}-${{ needs.meta.outputs.fingerprint }}"
    # Deliberately not `needs: compile`. This job builds the last slice
    # itself and waits for the others' artifacts below, so its setup runs
    # while they compile instead of after them. A shard that fails is not
    # fatal either way: the merge brings in whatever did compile, ninja
    # rebuilds the rest, and the failure is reported here with the real
    # error rather than as a missing artifact.
    needs: meta
    runs-on: ${{ inputs.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 350

    permissions:
      contents: read
      actions: write   # so the run can prune the build-directory artifacts it supersedes

    env:
      DEPOT_TOOLS_UPDATE: '0'

    steps:
      # The setup steps live in .github/actions/macos-source so the shards and
      # this job cannot drift apart. A local action has to be on disk before it
      # can be used, hence the sparse checkout of .github first.
      - name: this repository's actions
        uses: actions/checkout@v7
        with:
          path: actions
          sparse-checkout: .github/actions

      - name: source, DEPS, build directory, gn gen
        uses: ./actions/.github/actions/macos-source
        with:
          arch: ${{ inputs.arch }}
          cpu: ${{ env.SHOT_CPU }}
          platform: macos-${{ inputs.arch }}
          build-dir-run-id: ${{ needs.meta.outputs.build_dir_run_id }}

      - name: this job's slice of the objects
        if: ${{ inputs.mode == 'build' && needs.meta.outputs.shard_count != '1' }}
        working-directory: src
        # The last slice, by the same assignment every shard computes.
        run: |
          ninja -C out/Shot -t inputs shot shot_c shot_node | grep -E '\.o$' \
            | pnpm --silent build:shards slice --build-dir out/Shot \
                --shards '${{ needs.meta.outputs.shard_count }}' --index '${{ needs.meta.outputs.final_shard }}' > /tmp/slice.txt

      - name: ninja this job's slice
        if: ${{ inputs.mode == 'build' && needs.meta.outputs.shard_count != '1' }}
        working-directory: src
        continue-on-error: true
        timeout-minutes: 280
        run: xargs ninja -C out/Shot -j ${{ inputs.jobs }} -k 0 < /tmp/slice.txt

      - name: wait for the other shards
        if: ${{ inputs.mode == 'build' && needs.meta.outputs.shard_count != '1' }}
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Polls this run's artifact list. It returns as soon as every shard
        # has uploaded, and also when every shard job has finished without
        # uploading -- ninja below then builds whatever never arrived.
        run: |
          pnpm --silent ci:await-shards \
            --prefix 'shard-macos-${{ inputs.arch }}-' \
            --shards '${{ needs.meta.outputs.shard_count }}' \
            --job-prefix 'compile: shotium-macos-${{ inputs.arch }}-${{ needs.meta.outputs.fingerprint }}'

      - name: download the shards
        if: ${{ inputs.mode == 'build' && needs.meta.outputs.shard_count != '1' }}
        continue-on-error: true   # no artifact at all is a slow build, not a failed one
        uses: actions/download-artifact@v8
        with:
          pattern: shard-macos-${{ inputs.arch }}-*
          path: shards

      - name: merge the shards into the build directory
        if: ${{ inputs.mode == 'build' && needs.meta.outputs.shard_count != '1' }}
        working-directory: src
        # One shard at a time, deleting each as it goes: the runner's disk
        # holds the build directory plus one unpacked shard, not plus all.
        run: |
          # nullglob: with every shard failed before it could upload, the
          # loop runs zero times and ninja below simply builds everything.
          shopt -s nullglob
          # download-artifact v8 flattens a single matching artifact.
          for tarball in "$GITHUB_WORKSPACE"/shards/shard.tar "$GITHUB_WORKSPACE"/shards/*/shard.tar; do
            [ -f "$tarball" ] || continue
            dir="${tarball%/shard.tar}/out"
            mkdir -p "$dir"
            tar -C "$dir" -xf "$tarball"
            rm -f "$tarball"
            pnpm build:shards merge --build-dir out/Shot --shard "$dir"
            rm -rf "$dir"
          done
          df -h /

      - name: probe
        if: ${{ inputs.mode == 'probe' }}
        working-directory: src
        # `ninja -n` resolves the entire graph and names every edge it would
        # run, without compiling anything, so a BUILD.gn that references a file
        # the pruning removed fails here in seconds rather than hours. When it
        # does, pnpm restore:upstream --log takes this output and
        # puts those files back from the upstream baseline.
        run: |
          if ! ninja -C out/Shot shot shot_c shot_node -n > /tmp/probe.txt 2>&1; then
            echo "=== ninja refused the graph ==="
            tail -40 /tmp/probe.txt
            echo
            echo "If these are missing files, feed this log to"
            echo "  pnpm restore:upstream --log probe.log"
            exit 1
          fi
          echo "edges ninja would run: $(grep -c '^\[' /tmp/probe.txt || true)"
          grep -oE '^\[[0-9]+/[0-9]+\] [A-Z_]+' /tmp/probe.txt \
            | awk '{print $2}' | sort | uniq -c | sort -rn | head
          echo
          echo "probe clean -- re-run this workflow with mode: build"

      - name: probe log
        if: ${{ always() && inputs.mode == 'probe' }}
        uses: actions/upload-artifact@v7
        with:
          name: probe-macos-${{ inputs.arch }}
          path: /tmp/probe.txt
          if-no-files-found: ignore

      - name: why is the restored build directory dirty
        if: ${{ inputs.mode == 'build' }}
        working-directory: src
        # The cache restores ~300 MB of objects, yet recent runs re-ran nearly
        # every CXX edge they had already built -- a cached run should be a
        # fraction of a full one. `-d explain` makes ninja say why each dirty
        # edge is dirty; the root causes appear at the top, so a head of the
        # output is the whole answer. Diagnosis only: nothing is built here.
        run: ninja -C out/Shot shot shot_c shot_node -n -d explain 2>&1 | head -120 || true

      - name: forget the previous binary
        # The build directory is restored from cache, so out/Shot still
        # holds the previous run's executable -- and when a compile fails,
        # "did the build finish" would find that stale binary, call the run
        # a success, and ship yesterday's build as today's artifact. It
        # did, once. Deleting it first means only this run's link can
        # satisfy the check; the relink costs a couple of minutes.
        if: ${{ inputs.mode == 'build' }}
        working-directory: src
        run: rm -f out/Shot/shotium out/Shot/libshotium.dylib out/Shot/shotium.node

      # A restored build directory can hold a depfile that names a file the
      # tree no longer has; ninja refuses to start on it ("missing and no
      # known rule to make it"). Dropping the depfile makes the action rerun.
      - name: drop depfiles that name deleted files
        if: ${{ inputs.mode == 'build' }}
        working-directory: src
        run: pnpm depfiles:prune out/Shot

      - name: ninja
        if: ${{ inputs.mode == 'build' }}
        working-directory: src
        continue-on-error: true
        timeout-minutes: 280
        # -k 0: this platform is still being brought up, and each round costs
        # a runner-hour -- keep compiling past a failure so one log names every
        # broken translation unit, not just the first.
        run: ninja -C out/Shot shot shot_c shot_node -j ${{ inputs.jobs }} -k 0

      # What this run read: ninja's inputs and deps log, gn's build.ninja.d,
      # the jumbo source lists. A probe exports the graph without the deps log.
      # `pnpm trim-tree plan` takes the six platforms' exports and computes
      # which tracked files no build opens. macOS is the one platform whose
      # graph cannot be generated on the development host.
      - name: export the build graph
        if: always()
        continue-on-error: true
        working-directory: src
        run: pnpm graph:export --build-dir out/Shot --out ../graph

      - name: upload the build graph
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: graph-macos-${{ inputs.arch }}
          path: graph
          if-no-files-found: warn

      - name: pack the build directory
        id: pack
        if: always() && inputs.mode == 'build'
        shell: bash
        working-directory: src
        # The build directory is what makes the next run warm, so it is
        # saved whether or not ninja finished. It goes to an artifact rather
        # than the Actions cache: the cache is 10 GB for the whole repository
        # and evicts whatever went unused for seven days, and an entry
        # written on a branch was invisible to every other branch -- both of
        # which turned warm builds cold. An artifact is visible repository-
        # wide for 90 days. The marker uploaded after "did the build finish"
        # says which fingerprint this directory is complete at, which is how
        # select-shards knows the next run at that fingerprint needs one
        # runner and no compiling.
        #
        # Only a directory gn gen produced. A job cancelled during the source
        # setup has nothing to save, and saving nothing once put a 173-byte
        # tar in front of every real build directory of the platform.
        run: |
          if [ ! -f out/Shot/build.ninja ]; then
            echo "no build directory to save: out/Shot/build.ninja is missing"
            exit 0
          fi
          tar --format=pax -cf - out/Shot | zstd -T0 -3 --long=27 -o "$RUNNER_TEMP/build-dir.tar.zst"
          ls -l "$RUNNER_TEMP/build-dir.tar.zst"
          echo "saved=true" >> "$GITHUB_OUTPUT"

      - name: save the build directory
        if: always() && steps.pack.outputs.saved == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-dir-macos-${{ inputs.arch }}
          path: ${{ runner.temp }}/build-dir.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: true

      - name: drop the build directories this one replaces
        if: always() && steps.pack.outputs.saved == 'true'
        continue-on-error: true
        shell: bash
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        # Artifact storage is not metered on a public repository, but a list
        # that only grows is slow to search. Three per platform: this run's
        # and two to fall back on. Never fatal: a build that finished is
        # still a build that finished.
        run: pnpm ci:engine-artifacts prune --name build-dir-macos-${{ inputs.arch }} --keep 3

      - name: did the build finish
        if: ${{ inputs.mode == 'build' }}
        working-directory: src
        run: |
          for wanted in out/Shot/shotium out/Shot/libshotium.dylib out/Shot/shotium.node; do
            if [ ! -f "$wanted" ]; then
              echo "$wanted was not produced -- the build got further, but is not done."
              echo "Run this workflow again; the cache carries the objects over."
              exit 1
            fi
          done
          ls -l out/Shot/shotium out/Shot/libshotium.dylib out/Shot/shotium.node
          file out/Shot/shotium out/Shot/libshotium.dylib

      - name: mark the build directory as complete at this fingerprint
        # Only after "did the build finish": an exact marker is how the next
        # run at this fingerprint knows it may use one runner, and a build
        # that ran out of time must not say that.
        if: ${{ inputs.mode == 'build' }}
        shell: bash
        working-directory: src
        run: pnpm ci:engine-artifacts marker --platform macos-${{ inputs.arch }} --fingerprint ${{ needs.meta.outputs.fingerprint }} --out "$RUNNER_TEMP/build-dir.json"

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.mode == 'build' }}
        with:
          name: build-dir-macos-${{ inputs.arch }}-${{ needs.meta.outputs.fingerprint }}
          path: ${{ runner.temp }}/build-dir.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: package
        if: ${{ success() && inputs.mode == 'build' }}
        working-directory: src
        # .7z like the other two platforms, rather than the tar.xz this job used
        # to produce. It is the same LZMA2 either way, so the only thing that
        # changed is that one format now covers everything. macOS images do not
        # all carry a 7-Zip, and the name differs between the ones that do (7zz
        # from the official build, 7z or 7za from p7zip), so the binary is
        # looked up rather than assumed, and installed if the image has none.
        #
        # CLI and C ABI are independent deliveries. Each archive and its root
        # directory have a stable name; the Release tag identifies the version.
        run: |
          sevenzip=$(command -v 7zz || command -v 7z || command -v 7za || true)
          if [ -z "$sevenzip" ]; then
            brew install --quiet sevenzip
            sevenzip=$(command -v 7zz || true)
          fi
          if [ -z "$sevenzip" ]; then
            echo "no 7z on this runner and brew could not supply one"
            exit 1
          fi
          echo "using $sevenzip"
          cli_stem="shotium-cli-macos-${{ inputs.arch }}"
          abi_stem="shotium-c-abi-macos-${{ inputs.arch }}"
          node_stem="shotium-node-macos-${{ inputs.arch }}"
          rm -rf dist "$cli_stem.7z" "$abi_stem.7z" "$node_stem.7z"
          pnpm package:cli --build out/Shot --os mac --dest "dist/$cli_stem"
          pnpm package:c-abi --build out/Shot --os mac --dest "dist/$abi_stem"
          # The addon delivery carries no version: publish.yml and the
          # previews turn it into the npm platform package for whatever
          # version they ship (pnpm package:platform --from-archive).
          pnpm package:node --build out/Shot --os mac --dest "dist/$node_stem"
          pnpm ci:engine-artifacts provenance --platform "macos-${{ inputs.arch }}" \
            --fingerprint "${{ needs.meta.outputs.fingerprint }}" --out provenance.json
          for package_stem in "$cli_stem" "$abi_stem" "$node_stem"; do
            ( cd dist && "$sevenzip" a -t7z -mx=9 "../$package_stem.7z" "$package_stem" )
          done
          {
            echo "SHOT_CLI_ARCHIVE=$cli_stem.7z"
            echo "SHOT_C_ABI_ARCHIVE=$abi_stem.7z"
            echo "SHOT_NODE_ARCHIVE=$node_stem.7z"
          } >> "$GITHUB_ENV"

      - name: upload the engine
        if: ${{ success() && inputs.mode == 'build' }}
        uses: actions/upload-artifact@v7
        with:
          name: engine-macos-${{ inputs.arch }}-${{ needs.meta.outputs.fingerprint }}
          path: |
            src/${{ env.SHOT_CLI_ARCHIVE }}
            src/${{ env.SHOT_C_ABI_ARCHIVE }}
            src/${{ env.SHOT_NODE_ARCHIVE }}
            src/provenance.json
          if-no-files-found: error
          # upload-artifact always wraps what it is handed in a zip and only
          # lets you pick a deflate level; no switch turns the wrapper off.
          # Level 0 stores the .7z as-is; anything higher spends CI time
          # re-compressing data that is already compressed and gives back
          # nothing.
          compression-level: 0
          retention-days: 90
          overwrite: true

      - name: checks
        if: ${{ success() && inputs.mode == 'build'
                && inputs.run_checks }}
        working-directory: src
        run: |
          pnpm verify:serve out/Shot/shotium
          pnpm verify:net out/Shot/shotium
          # The GN build already produced the self-contained Node addon.
          # The package is TypeScript, so what the check suites import is a
          # build output rather than a file in the tree. There is no frozen
          # lockfile -- see checks.yml for why it cannot carry the six
          # optionalDependencies yet.
          ( cd apps/typescript && pnpm install --no-lockfile && pnpm run build )

          pnpm verify:node out/Shot/shotium
          pnpm verify:node-entry
          pnpm verify:bilibili --package apps/typescript
          pnpm verify:daemon out/Shot/shotium
          pnpm verify:daemon-protocol

          pnpm verify:charset out/Shot/shotium
          pnpm verify:demos out/Shot/shotium

  ffi:
    needs: [meta, build]
    if: ${{ inputs.mode == 'build' && inputs.run_checks }}
    uses: ./.github/workflows/check-ffi.yml
    with:
      runner: ${{ inputs.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
      platform: macos-${{ inputs.arch }}
      artifact: engine-macos-${{ inputs.arch }}-${{ needs.meta.outputs.fingerprint }}
      evidence: ffi-evidence-macos-${{ inputs.arch }}-${{ needs.meta.outputs.fingerprint }}
