# Builds //shot:shot on macOS, natively, on x64 or arm64.
#
# The two runners are not the same machine, and the difference decides which
# one to trust first. GitHub documents macos-15-intel as 4 CPUs and 14 GB of
# RAM, which is the same class as the Linux and Windows runners; the arm64
# images (macos-14, macos-15) are 3 CPUs and 7 GB. Blink's Jumbo translation
# units peak around 1.2 GB each, so 7 GB is what sets `jobs` low rather than
# any preference -- and it is the reason x64 is the default here.
#
# Xcode comes from the runner. Chromium normally builds Mac with a hermetic
# Xcode fetched through an internal CIPD path, and build_overrides/build.gni
# decides between them by asking should_use_hermetic_xcode.py whether that
# hermetic copy is present. On a public runner it is not, so the answer is the
# system Xcode; `use_system_xcode = true` is set anyway so the build does not
# depend on that inference. The assert in mac_sdk.gni that would object to
# system Xcode in an official build is gated on is_chrome_branded, which is
# false here.
#
# As with Linux, `probe` runs sync + gn gen + `ninja -n` and stops. Every
# configuration error shows up there in about half an hour instead of four
# hours later at a link failure, and macOS is the platform most likely to have
# them: nothing in this tree has ever been compiled for it.
name: engine (macos)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe (sync + gn gen + ninja -n) or build'
        type: choice
        options: [probe, build]
        default: probe
      arch:
        description: 'x64 (macos-15-intel, 14 GB RAM) or arm64 (macos-15, 7 GB)'
        type: choice
        options: [x64, arm64]
        default: x64
      jobs:
        description: 'ninja -j (blink TUs peak at ~1.2 GB; arm64 has 7 GB total)'
        default: '3'
      run_checks:
        description: 'run the check suites if the build finishes'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ${{ github.event.inputs.arch == 'arm64'
                 && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 350

    permissions:
      contents: write  # the release step creates and uploads to a draft release
      actions: write   # so the run can delete the cache entries it supersedes

    env:
      DEPOT_TOOLS_UPDATE: '0'

    steps:
      - name: free up disk and report the toolchain
        # The spare Xcodes are the only large removable thing on a macOS image
        # -- several GB each -- and this build uses exactly one. Everything
        # else worth deleting on Linux is not present here.
        run: |
          df -h /
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          # The image defaults to Xcode 16.4 but ships up to 26.x, and the
          # tree is cut from a Chromium that builds against the SDK 26 era:
          # base/process/launch_mac.cc calls posix_spawn_file_actions_addchdir
          # under __builtin_available(macOS 26), a name SDK 15.5 does not
          # declare. Selecting the newest installed Xcode makes that whole
          # class of failure disappear instead of patching each call site.
          # Xcode_26.3.app is a symlink to Xcode_26.3.0.app, and the first
          # attempt selected the symlink and then deleted its target: the
          # deletion loop compared path strings, "the newest Xcode" pointed at
          # nothing, and the developer directory collapsed to CommandLineTools
          # -- which is what gn gen then found. Resolve every path first and
          # compare resolved paths only.
          newest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          newest="$(readlink -f "$newest")"
          sudo xcode-select -s "$newest"
          for app in /Applications/Xcode*.app; do
            if [ "$(readlink -f "$app")" != "$newest" ]; then
              echo "removing $app"
              sudo rm -rf "$app" || true
            fi
          done
          # Prove the selection survived the deletions before spending an hour
          # on a sync that would fail at gn gen.
          xcodebuild -version
          xcode-select -p
          df -h /

      - name: checkout
        uses: actions/checkout@v7
        with:
          path: src
          # Read by tools/shot/ci_stamp_mtimes.py, which needs the commit that
          # last touched each file for the build cache to be worth anything.
          fetch-depth: 0
          submodules: false

      - name: set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: depot_tools
        # Invoked by hand for the same reason the Windows job calls
        # win_tools.bat: DEPOT_TOOLS_UPDATE=0 pins the depot_tools this run
        # cloned, and that skips the call that would otherwise bootstrap it.
        # The bootstrap writes python3_bin_reldir.txt, which the `gn` and
        # `ninja` wrappers read to find their interpreter -- and gclient sync
        # succeeds without it, so the failure surfaces later at gn gen than the
        # step that caused it.
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          "$HOME/depot_tools/ensure_bootstrap"
          test -f "$HOME/depot_tools/python3_bin_reldir.txt" \
            || { echo "bootstrap produced no python3_bin_reldir.txt"; exit 1; }
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: gclient solution
        # target_os decides which DEPS entries exist at all. The .gclient
        # checked into this tree says ["win"], so a sync that inherited it
        # would omit every mac-gated dependency and fail much later, on a
        # missing include rather than on anything that names the cause.
        run: |
          cat > .gclient <<'EOF'
          solutions = [{
            "name": "src",
            "url": "https://github.com/${{ github.repository }}.git",
            "managed": False,
            "custom_deps": {},
            "custom_vars": {"checkout_configuration": "small"},
          }]
          target_os = ["mac"]
          EOF
          cat .gclient

      - name: gclient sync
        # FORCE_MAC_TOOLCHAIN is deliberately unset: setting it asks for the
        # hermetic Xcode, which needs access this runner does not have.
        run: |
          gclient sync --nohooks --no-history --shallow --verbose
          gclient runhooks
          df -h /

      - name: make source timestamps content-faithful
        run: python3 src/tools/shot/ci_stamp_mtimes.py .

      - name: restore the build directory
        uses: actions/cache/restore@v6
        # See engine-windows.yml for why the build directory itself is the
        # cache, and why nothing else is allowed to share the repository's
        # 10 GB with it.
        with:
          path: src/out/Shot
          key: out-shot-macos-${{ github.event.inputs.arch }}-${{ github.run_id }}
          restore-keys: |
            out-shot-macos-${{ github.event.inputs.arch }}-

      - name: patch the Skia checkout
        working-directory: src
        # Skia is DEPS-managed, so Shot's Skia changes have to be reapplied
        # after every sync. Keep this after cache restore: the new source
        # timestamps then invalidate exactly the affected Skia objects.
        run: |
          git -C third_party/skia apply --verbose ../../patches/third_party_skia_parallel_blur.patch
          git -C third_party/skia apply --verbose ../../patches/third_party_skia_incremental_row_limit.patch

      - name: build the shot ICU data set
        working-directory: src
        # third_party/icu is a DEPS checkout, so the trimmed data set is
        # generated per run rather than checked in. Failing loudly beats
        # quietly building against `cast` and shipping 0.81 MB more than the
        # numbers claim.
        run: |
          mkdir -p third_party/icu/shot
          python3 tools/shot/icu_repack.py \
            third_party/icu/cast/icudtl.dat \
            third_party/icu/shot/icudtl.dat --preset shot

      - name: gn gen
        working-directory: src
        # No target_cpu: the build is native, so GN takes the host's. Naming it
        # would only be a claim that could disagree with the runner.
        run: |
          mkdir -p out/Shot
          cat > out/Shot/args.gn <<'EOF'
          import("//build/args/shot-mac.gn")
          EOF
          cat out/Shot/args.gn
          gn gen out/Shot

      - name: probe
        if: ${{ github.event.inputs.mode == 'probe' }}
        working-directory: src
        # `ninja -n` resolves the entire graph and names every edge it would
        # run, without compiling anything, so a BUILD.gn that references a file
        # the pruning removed fails here in seconds rather than hours. When it
        # does, tools/shot/restore_from_upstream.py --log takes this output and
        # puts those files back from the upstream baseline.
        run: |
          if ! ninja -C out/Shot shot shot_c -n > /tmp/probe.txt 2>&1; then
            echo "=== ninja refused the graph ==="
            tail -40 /tmp/probe.txt
            echo
            echo "If these are missing files, feed this log to"
            echo "  python3 tools/shot/restore_from_upstream.py --log probe.log"
            exit 1
          fi
          echo "edges ninja would run: $(grep -c '^\[' /tmp/probe.txt || true)"
          grep -oE '^\[[0-9]+/[0-9]+\] [A-Z_]+' /tmp/probe.txt \
            | awk '{print $2}' | sort | uniq -c | sort -rn | head
          echo
          echo "probe clean -- re-run this workflow with mode: build"

      - name: probe log
        if: ${{ always() && github.event.inputs.mode == 'probe' }}
        uses: actions/upload-artifact@v7
        with:
          name: probe-mac-${{ github.event.inputs.arch }}
          path: /tmp/probe.txt
          if-no-files-found: ignore

      - name: why is the restored build directory dirty
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: src
        # The cache restores ~300 MB of objects, yet recent runs re-ran nearly
        # every CXX edge they had already built -- a cached run should be a
        # fraction of a full one. `-d explain` makes ninja say why each dirty
        # edge is dirty; the root causes appear at the top, so a head of the
        # output is the whole answer. Diagnosis only: nothing is built here.
        run: ninja -C out/Shot shot shot_c -n -d explain 2>&1 | head -120 || true

      - name: forget the previous binary
        # The build directory is restored from cache, so out/Shot still
        # holds the previous run's executable -- and when a compile fails,
        # "did the build finish" would find that stale binary, call the run
        # a success, and ship yesterday's build as today's artifact. It
        # did, once. Deleting it first means only this run's link can
        # satisfy the check; the relink costs a couple of minutes.
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: src
        run: rm -f out/Shot/shotium out/Shot/libshotium.dylib

      - name: ninja
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: src
        continue-on-error: true
        timeout-minutes: 280
        # -k 0: this platform is still being brought up, and each round costs
        # a runner-hour -- keep compiling past a failure so one log names every
        # broken translation unit, not just the first.
        run: ninja -C out/Shot shot shot_c -j ${{ github.event.inputs.jobs }} -k 0

      - name: save the build directory
        if: ${{ always() && github.event.inputs.mode == 'build' }}
        uses: actions/cache/save@v6
        with:
          path: src/out/Shot
          key: out-shot-macos-${{ github.event.inputs.arch }}-${{ github.run_id }}

      - name: drop the build directories this one replaces
        if: ${{ always() && github.event.inputs.mode == 'build' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # The repository gets 10 GB of Actions cache in total and one build
        # directory is several GB, so entries that are no longer wanted have to
        # go or they evict the one that is. Never fatal: this is an
        # optimisation, and a finished build is still finished.
        run: |
          prefix="out-shot-macos-${{ github.event.inputs.arch }}-"
          # .[2:] keeps the newest two: this run's entry, and one spare to fall
          # back on if this run's turns out to be unusable.
          ids=$(gh cache list --repo "${{ github.repository }}" \
                  --key "$prefix" --limit 100 \
                  --sort created_at --order desc \
                  --json id --jq '.[2:][].id' 2>/dev/null || true)
          for id in $ids; do
            echo "deleting cache entry $id"
            gh cache delete "$id" --repo "${{ github.repository }}" || true
          done

      - name: did the build finish
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: src
        run: |
          for wanted in out/Shot/shotium out/Shot/libshotium.dylib; do
            if [ ! -f "$wanted" ]; then
              echo "$wanted was not produced -- the build got further, but is not done."
              echo "Run this workflow again; the cache carries the objects over."
              exit 1
            fi
          done
          ls -l out/Shot/shotium out/Shot/libshotium.dylib
          file out/Shot/shotium out/Shot/libshotium.dylib

      - name: package
        if: ${{ success() && github.event.inputs.mode == 'build' }}
        working-directory: src
        # .7z like the other two platforms, rather than the tar.xz this job used
        # to produce. It is the same LZMA2 either way, so the only thing that
        # changed is that one format now covers everything. macOS images do not
        # all carry a 7-Zip, and the name differs between the ones that do (7zz
        # from the official build, 7z or 7za from p7zip), so the binary is
        # looked up rather than assumed, and installed if the image has none.
        #
        # The archive holds exactly one directory, named for the platform and
        # the architecture and nothing else. The version lives in the file name
        # instead, so unpacking a newer build over an older one replaces it in
        # place rather than leaving two versioned directories side by side.
        run: |
          sevenzip=$(command -v 7zz || command -v 7z || command -v 7za || true)
          if [ -z "$sevenzip" ]; then
            brew install --quiet sevenzip
            sevenzip=$(command -v 7zz || true)
          fi
          if [ -z "$sevenzip" ]; then
            echo "no 7z on this runner and brew could not supply one"
            exit 1
          fi
          echo "using $sevenzip"
          version=$(python3 -c \
            "import json;print(json.load(open('shotium/package.json'))['version'])")
          stem="shotium-mac-${{ github.event.inputs.arch }}"
          archive="$stem-v$version.7z"
          rm -rf dist "$archive"
          mkdir -p "dist/$stem"
          cp out/Shot/shotium out/Shot/libshotium.dylib \
             out/Shot/shotium_data.pak out/Shot/shotium_strings.pak "dist/$stem/"
          ls -l "dist/$stem"
          ( cd dist && "$sevenzip" a -t7z -mx=9 "../$archive" "$stem" )
          ls -l "$archive"
          {
            echo "SHOT_VERSION=$version"
            echo "SHOT_STEM=$stem"
            echo "SHOT_ARCHIVE=$archive"
          } >> "$GITHUB_ENV"

      - name: upload
        if: ${{ success() && github.event.inputs.mode == 'build' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SHOT_STEM }}
          path: src/${{ env.SHOT_ARCHIVE }}
          if-no-files-found: error
          # upload-artifact always wraps what it is handed in a zip and only
          # exposes a deflate level; no switch turns the wrapper off. 0 stores
          # the .7z as-is instead of re-compressing compressed bytes. The
          # release step below is where a download is the .7z itself.
          compression-level: 0

      - name: checks
        if: ${{ success() && github.event.inputs.mode == 'build'
                && github.event.inputs.run_checks == 'true' }}
        working-directory: src
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || \
            python3 -m pip install --quiet pillow
          python3 tools/shot/serve_check.py out/Shot/shotium
          python3 tools/shot/net_check.py out/Shot/shotium
          # The node addon, and the C ABI under it. Built here rather than
          # taken from anywhere else, because the library it links against is
          # the one this job has just produced -- an addon checked against a
          # different build would be checking nothing.
          #
          # Before the node suites, not after: the addon is what they load. An
          # A package-manager install carries the library and the addon and not the
          # executable, so there is no second path for them to fall back to.
          ( cd shotium/native \
            && SHOT_INCLUDE_DIR="$PWD/../../shot" \
               SHOT_LIB_DIR="$PWD/../../out/Shot" \
               pnpm dlx node-gyp@13 rebuild )
          cp out/Shot/libshotium.dylib out/Shot/shotium_data.pak \
             out/Shot/shotium_strings.pak shotium/native/build/Release/

          # The package is TypeScript, so what the check suites import is a
          # build output rather than a file in the tree. There is no frozen
          # lockfile -- see checks.yml for why it cannot carry the six
          # optionalDependencies yet.
          ( cd shotium && pnpm install --no-lockfile && pnpm run build )

          node tools/shot/node_check.cjs out/Shot/shotium
          node tools/shot/daemon_check.cjs out/Shot/shotium
          node tools/shot/daemon_protocol_check.cjs

          python3 tools/shot/charset_check.py out/Shot/shotium
          python3 tools/shot/demo_check.py out/Shot/shotium

      - name: npm platform package
        if: ${{ success() && github.event.inputs.mode == 'build' }}
        working-directory: src
        # One of the six @shotkit/shotium-<os>-<arch> packages: the shared
        # library, the addon linked against it, and the two resource packs, in
        # a package npm can install. @shotkit/shotium depends on all six as
        # optionalDependencies with os/cpu set, so an install pulls the one
        # that matches and skips the rest. See
        # tools/shot/make_platform_package.cjs.
        #
        # Not the executable. It is a second, independent copy of the same
        # engine -- shot_core is a source_set, so its objects link into both
        # the executable and the library -- and node has no use for it now
        # that rendering is in-process. It still goes out in the .7z on the
        # releases page, for using the engine without node.
        #
        # Which makes the addon the only thing in the package that node can
        # call. Both macOS runners are native, so the checks step has usually
        # built one already; with run_checks off it has not, and this builds
        # it rather than shipping a package that installs and cannot render.
        run: |
          arch="${{ github.event.inputs.arch }}"
          addon="shotium/native/build/Release/shotium.node"
          if [ ! -f "$addon" ]; then
            ( cd shotium/native \
              && SHOT_INCLUDE_DIR="$PWD/../../shot" \
                 SHOT_LIB_DIR="$PWD/../../out/Shot" \
                 pnpm dlx node-gyp@13 rebuild )
            cp out/Shot/libshotium.dylib out/Shot/shotium_data.pak \
               out/Shot/shotium_strings.pak shotium/native/build/Release/
          fi
          if [ ! -f "$addon" ]; then
            echo "no $addon -- the package would install and then be unable"
            echo "to render, since the addon is the only thing in it node can"
            echo "call. Not shipping that."
            exit 1
          fi
          node tools/shot/make_platform_package.cjs \
            --build out/Shot --os mac --arch "$arch" --dest dist/npm \
            --addon "$addon"
          ( cd "dist/npm/shotium-mac-$arch" && npm pack --pack-destination .. )
          tarball=$(ls dist/npm/*.tgz | head -1)
          ls -l "$tarball"
          echo "SHOT_NPM_TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: upload the npm package
        if: ${{ success() && github.event.inputs.mode == 'build' }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-shotium-mac-${{ github.event.inputs.arch }}
          path: src/${{ env.SHOT_NPM_TARBALL }}
          if-no-files-found: error
          compression-level: 0
