# The paired performance comparison, candidate against a published
# baseline, on all six platforms. The candidate engines are the artifacts
# at this tree's fingerprint -- whatever engine.yml built or found for it --
# so there is nothing to dispatch first and no run ids to paste: if the
# engines are missing, resolve says so and engine.yml is the fix.
name: perf-gate
run-name: "perf-gate: candidate vs v${{ inputs.baseline_version }}"

on:
  workflow_dispatch:
    inputs:
      baseline_version:
        description: Exact published npm version
        required: true
        default: '0.7.4'
        type: string
      fingerprint:
        description: 'engine fingerprint to measure; empty computes it from this ref'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  # Every job name below carries the package version. A job name can
  # read an earlier job's outputs but not a file, so one small job
  # reads package.json first.
  meta:
    name: "resolve: shotium"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: apps/typescript/package.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(jq -r .version apps/typescript/package.json)" >> "$GITHUB_OUTPUT"

  resolve:
    name: "resolve: shotium-v${{ needs.meta.outputs.version }}"
    needs: meta
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: repository scripts
        working-directory: scripts
        run: pnpm install --frozen-lockfile
      - id: fingerprint
        env:
          FROM_INPUT: ${{ inputs.fingerprint }}
        run: |
          if [ -n "$FROM_INPUT" ]; then echo "fingerprint=$FROM_INPUT" >> "$GITHUB_OUTPUT"; else pnpm ci:fingerprint --output; fi
      - id: plan
        name: Require all six engines with evidence at this fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          BASELINE_VERSION: ${{ inputs.baseline_version }}
        run: pnpm perf:ci plan
      - uses: actions/upload-artifact@v7
        with:
          name: performance-plan
          path: performance-plan.json

  platform:
    name: "measure: shotium-${{ matrix.target.label }}-v${{ needs.meta.outputs.version }}"
    needs: [meta, resolve]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: repository scripts
        working-directory: scripts
        run: pnpm install --frozen-lockfile
      - name: Build the candidate JavaScript
        working-directory: apps/typescript
        run: |
          pnpm install --no-lockfile
          pnpm run build
          pnpm run check:types
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target.artifactName }}
          run-id: ${{ matrix.target.runId }}
          github-token: ${{ github.token }}
          path: out/performance/engine
      - name: The npm platform package, from the engine's node archive
        env:
          LABEL: ${{ matrix.target.label }}
          PACKAGE_OS: ${{ matrix.target.packageOs }}
          CPU: ${{ matrix.target.cpu }}
        # The same assembly publish.yml does, so the candidate is the package
        # a user would install for this engine.
        run: |
          sevenzip=$(command -v 7zz || command -v 7z || command -v 7za || true)
          if [ -z "$sevenzip" ]; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then brew install --quiet sevenzip;
            elif [[ "$RUNNER_OS" == "Linux" ]]; then sudo apt-get update && sudo apt-get install -y p7zip-full;
            fi
            sevenzip=$(command -v 7zz || command -v 7z || command -v 7za || true)
          fi
          [ -n "$sevenzip" ] || { echo "7-Zip is required" >&2; exit 1; }
          pnpm package:platform --from-archive "out/performance/engine/shotium-node-$LABEL.7z" \
            --os "$PACKAGE_OS" --arch "$CPU" --dest out/performance/stage --sevenzip "$sevenzip"
          mkdir -p out/performance/download
          ( cd "out/performance/stage/shotium-$PACKAGE_OS-$CPU" && npm pack --pack-destination ../../download )
      - name: Install both immutable candidates
        env:
          BASELINE_VERSION: ${{ inputs.baseline_version }}
          FINGERPRINT: ${{ matrix.target.fingerprint }}
        run: |
          npm install --prefix out/performance/baseline --ignore-scripts --no-audit --no-fund "@pixel.js/shotium@$BASELINE_VERSION"
          pnpm perf:ci stage out/performance/download out/performance/candidate
      - name: Validate the two real long articles
        run: pnpm verify:bilibili --package out/performance/candidate
      - name: Complete paired performance matrix
        id: performance
        run: >-
          pnpm perf:compare
          out/performance/baseline/node_modules/@pixel.js/shotium
          out/performance/candidate
          out/performance/result.json --samples=100 --calibrate --check
      - name: Independently compare every rendered case
        if: always() && steps.performance.outcome != 'skipped'
        run: pnpm perf:images out/performance/result.json
      - name: Preserve failures and raw evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ matrix.target.label }}
          path: |
            out/performance/result*
            out/performance/candidate/provenance.json
            out/performance/baseline/package-lock.json
            shot/testdata/out/bilibili-*
          if-no-files-found: error
          retention-days: 90

  acceptance:
    name: "gate: shotium-v${{ needs.meta.outputs.version }}"
    if: always()
    needs: [meta, resolve, platform]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: repository scripts
        working-directory: scripts
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: performance-*
          path: out/evidence
      - name: Require complete results on all six platforms
        shell: bash
        run: |
          pnpm perf:report out/evidence/performance-*/result.json --output out/performance-acceptance.md
          test '${{ needs.platform.result }}' = success
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-acceptance
          path: out/performance-acceptance.md
          if-no-files-found: error
