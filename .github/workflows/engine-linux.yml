# Builds //shot:shot on Linux for x64 or arm64, both on an x64 host.
#
# arm64 is cross-compiled, and not by preference. It was native at first, on
# ubuntu-24.04-arm, which GitHub documents as the same machine as the x64
# runner; the appeal was that the check suites would run the binary on the
# architecture it ships for. gclient sync refuses:
#
#   failed to resolve infra/3pp/tools/gperf/linux-arm64@version:3@3.2
#   no such package: infra/3pp/tools/gperf/linux-arm64
#
# DEPS asks for infra/3pp/tools/gperf/${platform} whenever host_os is linux,
# and upstream has never published that package for linux-arm64, because
# upstream has never built there: Chromium's own linux-arm64 is cross-compiled
# from an x64 host, where ${platform} resolves to linux-amd64 and the package
# exists. Nothing in this fork can conjure a CIPD package that was never built,
# so the fix is to build the way the package list assumes.
#
# Cross-compiling also settles the sysroot, which is the other half of the same
# assumption: debian_bullseye_arm64-sysroot is gated on checkout_arm64, so
# target_cpu in .gclient is what fetches it.
#
# The cost is real and worth stating: an x64 runner cannot execute an arm64
# binary, so run_checks is ignored for that architecture. windows-arm64 is in
# the same position for the same reason.
#
# This is deliberately a separate workflow from engine-windows.yml rather than
# a matrix entry on it. The Windows build works; folding an unproven target
# into the same job would put it at risk for no gain, and the two have almost
# no steps in common anyway -- no Visual Studio, no SDK hunt, different
# packaging.
#
# What is genuinely unknown here is how much of the cutting assumed Windows.
# Every round of it was verified by building and rendering on Windows only, and
# a cut that removed something only a POSIX file reads would not have shown up.
# The audit that preceded this workflow sampled 19 Linux-specific sources
# across base, net, skia, blink and ui and found all 19 still present, so the
# source tree is probably not the problem -- but "probably" is why `mode:
# probe` exists.
#
#   probe   sync, gn gen, and ask ninja what it *would* do. About 30 minutes,
#           and it surfaces every configuration error: an arg that does not
#           exist on this platform, a source a BUILD.gn names that the pruning
#           removed, a missing dependency. Iterate here.
#   build   the real thing, once probe is clean.
#
# Discovering a one-line GN error costs half an hour this way instead of the
# four it takes to reach the link step and fail there.
name: engine-linux
run-name: "engine-linux: ${{ inputs.arch }} ${{ inputs.mode }} (${{ inputs.shards }} shards)"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe (sync + gn gen + ninja -n) or build'
        type: choice
        options: [probe, build]
        default: probe
      arch:
        description: 'amd64 (native) or arm64 (cross-compiled from this amd64 host)'
        type: choice
        options: [amd64, arm64]
        default: amd64
      jobs:
        description: 'ninja -j (4 cores; blink layout TUs peak at ~1.2 GB each)'
        default: '4'
      run_checks:
        description: 'run the check suites if the build finishes'
        type: boolean
        default: true
      shards:
        description: 'compile jobs that split the objects between them before the final job links; auto = 4 for amd64, 3 for arm64; 1 = one job does everything'
        default: auto

# GN, the SDK and node-gyp spell the 64-bit architecture x64; the names
# people see spell it amd64. The build-directory cache is keyed by the GN
# spelling so that renaming labels did not throw away six warm build
# directories.
env:
  SHOT_CPU: ${{ inputs.arch == 'arm64' && 'arm64' || 'x64' }}

jobs:
  # Every job name below carries the package version. A job name can
  # read an earlier job's outputs but not a file, so one small job
  # reads package.json first.
  meta:
    name: "resolve: shotium-linux-${{ inputs.arch }}"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      shards: ${{ steps.shards.outputs.list }}
      shard_count: ${{ steps.shards.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: shotium/package.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(jq -r .version shotium/package.json)" >> "$GITHUB_OUTPUT"
      - id: shards
        # `auto` is the per-platform count that keeps a full six-platform
        # dispatch inside the free plan's 20 concurrent jobs (macOS: 5):
        # Windows 4+4, Linux 4+3, macOS 2+3. The matrix wants a JSON list of
        # indices; a matrix cannot count on its own.
        run: |
          n='${{ inputs.shards }}'
          if [ "$n" = auto ]; then n=$([ '${{ inputs.arch }}' = arm64 ] && echo 3 || echo 4); fi
          case "$n" in ''|*[!0-9]*|0) echo "shards must be auto or a positive integer, got '$n'" >&2; exit 1 ;; esac
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "list=$(jq -cn --argjson n "$n" '[range($n)]')" >> "$GITHUB_OUTPUT"

  # Sharding. ninja's idea of "up to date" is the outputs plus .ninja_log and
  # .ninja_deps, and N runners that ran the same gn gen share one graph. So
  # each shard builds every Nth object of the graph (with whatever generated
  # files and host tools that needs), tars what it built with its two logs,
  # and the final job transplants the tars into its own build directory
  # (scripts/build-shards.ts merge) and finds only the link left to do.
  # Measured on Linux amd64: 73 minutes cold as one job, 47 as four shards
  # plus the final job; a warm run 18 minutes. A compiler cache in front of
  # the final job was measured first and lost: every sccache hit still
  # preprocessed the unit, 1-2 s each, 20 minutes on the final job for
  # nothing.
  #
  # Every shard restores the build-directory cache too, so a warm run costs
  # what it did before sharding: a shard whose slice is already built packs
  # nothing (--since keeps the cache's files out of the tar). What travels
  # is more than objects: the generated sources GN writes at gen time (the
  # jumbo units) and the depfiles of edges that keep theirs on disk, because
  # the final job's own gn gen would write them newer than the objects and
  # ninja would rebuild everything below them.
  compile:
    name: "compile: shotium-linux-${{ inputs.arch }}-v${{ needs.meta.outputs.version }} ${{ matrix.shard }}/${{ needs.meta.outputs.shard_count }}"
    needs: meta
    if: inputs.mode == 'build' && needs.meta.outputs.shard_count != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.meta.outputs.shards) }}

    env:
      DEPOT_TOOLS_UPDATE: '0'

    steps:
      # Everything this job writes from here on is newer than this moment;
      # everything the build-directory cache restores is older. That is how
      # the pack step tells the shard's own work from the cache's.
      - name: remember when this job started
        run: date +%s > /tmp/job-started

      # The setup steps live in .github/actions/linux-source so the shards and
      # this job cannot drift apart. A local action has to be on disk before it
      # can be used, hence the sparse checkout of .github first.
      - name: this repository's actions
        uses: actions/checkout@v7
        with:
          path: actions
          sparse-checkout: .github/actions

      - name: source, DEPS, build directory, gn gen
        uses: ./actions/.github/actions/linux-source
        with:
          arch: ${{ inputs.arch }}
          cpu: ${{ env.SHOT_CPU }}
          restore-cache: 'true'

      - name: this shard's slice of the objects
        working-directory: src
        # -t inputs walks the graph below the two engine targets and names
        # every file it would read, objects included, in every toolchain.
        # `slice` spreads them by cost -- last run's durations from the
        # restored .ninja_log, or an estimate from the path -- longest first
        # onto the least-loaded shard, so the shards finish together; every
        # shard computes the same assignment from the same inputs.
        run: |
          ninja -C out/Shot -t inputs shot shot_c | grep -E '\.o$' \
            | pnpm --silent build:shards slice --build-dir out/Shot \
                --shards '${{ needs.meta.outputs.shard_count }}' --index '${{ matrix.shard }}' > /tmp/slice.txt

      - name: ninja
        working-directory: src
        continue-on-error: true
        timeout-minutes: 280
        # -k 0 so one shard's log names every broken unit in its slice, and
        # continue-on-error so what did compile still reaches the final job,
        # which is where the failure is reported.
        # stdin, not xargs -a: BSD xargs on macOS has no -a.
        run: xargs ninja -C out/Shot -j ${{ inputs.jobs }} -k 0 < /tmp/slice.txt

      - name: pack what this shard built
        working-directory: src
        run: |
          pnpm --silent build:shards list --build-dir out/Shot --since "$(cat /tmp/job-started)" > /tmp/built.txt
          echo "$(wc -l < /tmp/built.txt) outputs built by this shard"
          tar --format=pax -C out/Shot -cf "$GITHUB_WORKSPACE/shard.tar" -T /tmp/built.txt .ninja_log .ninja_deps
          ls -l "$GITHUB_WORKSPACE/shard.tar"

      - name: upload the shard
        uses: actions/upload-artifact@v7
        with:
          name: shard-linux-${{ inputs.arch }}-${{ matrix.shard }}
          path: shard.tar
          if-no-files-found: error
          retention-days: 1
          # Objects are bitcode and generated files are text; level 1 halves
          # the upload for a few seconds of CPU, higher levels buy little.
          compression-level: 1

  build:
    name: "${{ inputs.mode }}: shotium-linux-${{ inputs.arch }}-v${{ needs.meta.outputs.version }}"
    # Runs after the shards even when one of them failed: the merge brings in
    # whatever they did compile, ninja rebuilds the rest, and the failure is
    # reported here with the real error rather than as a missing artifact.
    needs: [meta, compile]
    if: ${{ always() && needs.meta.result == 'success' && needs.compile.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    permissions:
      contents: write  # the release step creates and uploads to a draft release
      actions: write   # so the run can delete the cache entries it supersedes

    env:
      DEPOT_TOOLS_UPDATE: '0'

    steps:
      # The setup steps live in .github/actions/linux-source so the shards and
      # this job cannot drift apart. A local action has to be on disk before it
      # can be used, hence the sparse checkout of .github first.
      - name: this repository's actions
        uses: actions/checkout@v7
        with:
          path: actions
          sparse-checkout: .github/actions

      - name: source, DEPS, build directory, gn gen
        uses: ./actions/.github/actions/linux-source
        with:
          arch: ${{ inputs.arch }}
          cpu: ${{ env.SHOT_CPU }}
          restore-cache: 'true'

      - name: download the shards
        if: ${{ inputs.mode == 'build' && needs.meta.outputs.shard_count != '1' }}
        uses: actions/download-artifact@v8
        with:
          pattern: shard-linux-${{ inputs.arch }}-*
          path: shards

      - name: merge the shards into the build directory
        if: ${{ inputs.mode == 'build' && needs.meta.outputs.shard_count != '1' }}
        working-directory: src
        # One shard at a time, deleting each as it goes: the runner's disk
        # holds the build directory plus one unpacked shard, not plus four.
        run: |
          for tarball in "$GITHUB_WORKSPACE"/shards/*/shard.tar; do
            dir="${tarball%/shard.tar}/out"
            mkdir -p "$dir"
            tar -C "$dir" -xf "$tarball"
            rm -f "$tarball"
            pnpm build:shards merge --build-dir out/Shot --shard "$dir"
            rm -rf "$dir"
          done
          df -h /

      - name: probe
        if: ${{ github.event.inputs.mode == 'probe' }}
        working-directory: src
        # `ninja -n` resolves the whole graph and names every edge it would run
        # without compiling anything, so a BUILD.gn that references a file the
        # pruning removed fails here in seconds. The edge count is the useful
        # output: it says how much of this platform is actually configured.
        run: |
          ninja -C out/Shot shot shot_c -n > /tmp/probe.txt 2>&1 || {
            echo "=== ninja refused the graph ==="
            tail -40 /tmp/probe.txt
            exit 1
          }
          echo "edges ninja would run: $(grep -c '^\[' /tmp/probe.txt || true)"
          grep -oE '^\[[0-9]+/[0-9]+\] [A-Z_]+' /tmp/probe.txt \
            | awk '{print $2}' | sort | uniq -c | sort -rn | head
          echo
          echo "probe clean -- re-run this workflow with mode: build"

      - name: probe log
        if: ${{ always() && github.event.inputs.mode == 'probe' }}
        uses: actions/upload-artifact@v7
        # Uploaded whether the probe passed or failed, because the failing case
        # is the one worth having: pnpm restore:upstream --log
        # reads exactly this file and puts back whatever it names.
        with:
          name: probe-linux-${{ inputs.arch }}
          path: /tmp/probe.txt
          if-no-files-found: ignore

      - name: why is the restored build directory dirty
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: src
        # The cache restores ~300 MB of objects, yet recent runs re-ran nearly
        # every CXX edge they had already built -- a cached run should be a
        # fraction of a full one. `-d explain` makes ninja say why each dirty
        # edge is dirty; the root causes appear at the top, so a head of the
        # output is the whole answer. Diagnosis only: nothing is built here.
        run: ninja -C out/Shot shot shot_c -n -d explain 2>&1 | head -120 || true

      - name: forget the previous binary
        # The build directory is restored from cache, so out/Shot still
        # holds the previous run's executable -- and when a compile fails,
        # "did the build finish" would find that stale binary, call the run
        # a success, and ship yesterday's build as today's artifact. It
        # did, once. Deleting it first means only this run's link can
        # satisfy the check; the relink costs a couple of minutes.
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: src
        run: rm -f out/Shot/shotium out/Shot/libshotium.so

      # A restored build directory can hold a depfile that names a file the
      # tree no longer has; ninja refuses to start on it ("missing and no
      # known rule to make it"). Dropping the depfile makes the action rerun.
      - name: drop depfiles that name deleted files
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: src
        run: pnpm depfiles:prune out/Shot

      - name: ninja
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: src
        continue-on-error: true
        timeout-minutes: 280
        # -k 0: this platform is still being brought up, and each round costs
        # a runner-hour -- keep compiling past a failure so one log names every
        # broken translation unit, not just the first.
        # shot_c is the same engine behind a C ABI, for shotium's node addon.
        # The second link shares this directory's ThinLTO cache with the first,
        # so it reuses that codegen and costs minutes rather than an hour.
        run: ninja -C out/Shot shot shot_c -j ${{ github.event.inputs.jobs }} -k 0

      # What this run read: ninja's inputs and deps log, gn's build.ninja.d,
      # the jumbo source lists. A probe exports the graph without the deps log.
      # `pnpm trim-tree plan` takes the six platforms' exports and computes
      # which tracked files no build opens.
      - name: export the build graph
        if: always()
        continue-on-error: true
        working-directory: src
        run: pnpm graph:export --build-dir out/Shot --out ../graph

      - name: upload the build graph
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: graph-linux-${{ inputs.arch }}
          path: graph
          if-no-files-found: warn

      - name: save the build directory
        if: ${{ always() && github.event.inputs.mode == 'build' }}
        uses: actions/cache/save@v6
        with:
          path: src/out/Shot
          key: out-shot-linux-${{ env.SHOT_CPU }}-${{ github.run_id }}

      - name: drop the build directories this one replaces
        if: ${{ always() && github.event.inputs.mode == 'build' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # The repository gets 10 GB of Actions cache in total and one build
        # directory is 6.1 GB before compression, so entries that are no longer
        # wanted have to go or they evict the one that is. Never fatal: the
        # cache is an optimisation.
        run: |
          prefix="out-shot-linux-${{ env.SHOT_CPU }}-"
          # .[2:] keeps the newest two: this run's entry, and one spare to fall
          # back on if this run's turns out to be unusable.
          ids=$(gh cache list --repo "${{ github.repository }}" \
                  --key "$prefix" --limit 100 \
                  --sort created_at --order desc \
                  --json id --jq '.[2:][].id' 2>/dev/null || true)
          for id in $ids; do
            echo "deleting cache entry $id"
            gh cache delete "$id" --repo "${{ github.repository }}" || true
          done

      - name: did the build finish
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: src
        run: |
          for wanted in out/Shot/shotium out/Shot/libshotium.so; do
            if [ ! -f "$wanted" ]; then
              echo "$wanted was not produced -- the build got further, but is not done."
              echo "Run this workflow again; the cache carries the objects over."
              exit 1
            fi
          done
          ls -l out/Shot/shotium out/Shot/libshotium.so

      - name: checks
        # x64 only. The runner is x64 for both architectures now, so there is
        # nothing here that can execute an arm64 binary; asking would fail on
        # "cannot execute binary file" and read as a broken engine rather than
        # a host that cannot run it. An arm64 artifact therefore ships checked
        # by nothing but the compiler and the linker -- worth remembering
        # before trusting one.
        if: ${{ success() && github.event.inputs.mode == 'build'
                && github.event.inputs.run_checks == 'true'
                && inputs.arch == 'amd64' }}
        working-directory: src
        run: |
          pnpm verify:serve out/Shot/shotium
          pnpm verify:net out/Shot/shotium

          # The node addon, and the C ABI under it. Built here rather than
          # taken from anywhere else, because the library it links against is
          # the one this job has just produced -- an addon checked against a
          # different build would be checking nothing.
          #
          # Before the node suites, not after: the addon is what they load.
          # A package-manager install carries the library and the addon and not the
          # executable, so there is no second path for them to fall back to.
          ( cd shotium/native             && SHOT_INCLUDE_DIR="$PWD/../../shot" SHOT_LIB_DIR="$PWD/../../out/Shot"                pnpm dlx node-gyp@13 rebuild )
          cp out/Shot/libshotium.so out/Shot/shotium_data.pak out/Shot/shotium_strings.pak              shotium/native/build/Release/

          # The package is TypeScript, so what the check suites import is a
          # build output rather than a file in the tree. There is no frozen
          # lockfile -- see checks.yml for why it cannot carry the six
          # optionalDependencies yet.
          ( cd shotium && pnpm install --no-lockfile && pnpm run build )

          # Under a backtrace if it dies. This build is is_official_build, and
          # an official build compiles CHECK() down to a bare trap with no
          # message -- so a failed CHECK inside the library arrives as
          # "Trace/breakpoint trap" and nothing else. symbol_level is 0, but
          # only -g0: .symtab survives the link, so gdb still names the
          # functions even though it cannot name the lines.
          #
          # Which is why the strip step runs after this one rather than before.
          # A stripped library gives back a backtrace of hex addresses.
          pnpm verify:node out/Shot/shotium || {
            status=$?
            echo "::group::check-node died with $status -- backtrace"
            readelf -SW out/Shot/libshotium.so | grep -E 'symtab|dynsym' || true
            sudo apt-get update -qq && sudo apt-get install -y -qq gdb || true
            gdb -q -batch \
                -ex 'set confirm off' \
                -ex run \
                -ex 'thread apply all bt 40' \
                --args node scripts/node_modules/tsx/dist/cli.mjs scripts/check-node.ts out/Shot/shotium || true
            echo "::endgroup::"
            exit "$status"
          }
          pnpm verify:bilibili --package shotium
          # The daemon runs here as well as on Windows because
          # shotium/src/lib/endpoint.ts has two branches -- a named pipe on
          # Windows, a unix socket everywhere else -- and the Windows job
          # exercises exactly one of them.
          pnpm verify:daemon out/Shot/shotium
          pnpm verify:daemon-protocol

          pnpm verify:charset out/Shot/shotium
          pnpm verify:demos out/Shot/shotium

      - name: keep the symbols before stripping them
        if: ${{ success() && github.event.inputs.mode == 'build' }}
        uses: actions/upload-artifact@v7
        with:
          name: unstripped-linux-${{ inputs.arch }}
          path: |
            src/out/Shot/shotium
            src/out/Shot/libshotium.so
          if-no-files-found: error
          compression-level: 6

      - name: strip
        if: ${{ success() && github.event.inputs.mode == 'build' }}
        working-directory: src
        # Linux was shipping 36.5% debugging leftovers.
        #
        # `symbol_level = 0` turns off DWARF, and it is easy to read that as
        # "no symbols". It is not: the linker still writes .symtab and .strtab,
        # the static symbol table, which nothing at run time reads. Measured on
        # the v0.1.0 libshotium.so, 73,285,608 bytes on disk:
        #
        #   .text      26,335,938  35.9%
        #   .strtab    22,004,373  30.0%   <- this
        #   .rodata    14,603,493  19.9%
        #   .symtab     4,743,360   6.5%   <- and this
        #   .dynsym        10,800   0.0%
        #
        # .dynsym is what the dynamic linker resolves against and it is 10 KB,
        # because shot_api.exports hides everything except the eight shot_*
        # entry points. So the export list was already right; the 26.7 MB was
        # the other table.
        #
        # Windows does not have this problem -- PE symbols go to a .pdb, which
        # is not shipped -- and macOS keeps a compact one. Linux was the only
        # platform where a .7z came to 31 MB against Windows' 15 and macOS' 13.
        #
        # The unstripped pair went up as an artifact in the step above, which
        # is not optional: an official build's CHECK failure arrives as a bare
        # SIGTRAP with no message, and reading the stack needs exactly the
        # table this removes.
        run: |
          before=$(stat -c%s out/Shot/libshotium.so)
          llvm_strip=third_party/llvm-build/Release+Asserts/bin/llvm-strip
          if [ -x "$llvm_strip" ]; then
            strip_binary="$llvm_strip"
          else
            strip_binary=strip
          fi
          echo "using $strip_binary"
          # --strip-all removes .symtab and .strtab and leaves .dynsym alone,
          # which is the whole distinction that matters here. On the shared
          # library that is what keeps it loadable at all.
          "$strip_binary" --strip-all out/Shot/shotium out/Shot/libshotium.so
          after=$(stat -c%s out/Shot/libshotium.so)
          ls -l out/Shot/shotium out/Shot/libshotium.so
          echo "libshotium.so: $before -> $after bytes"
          # A strip that silently did nothing would ship the same 70 MB and
          # look like it worked, so this fails rather than reports.
          if [ "$after" -ge "$before" ]; then
            echo "strip changed nothing -- it is not doing what this step is for"
            exit 1
          fi

      - name: package
        if: ${{ success() && github.event.inputs.mode == 'build' }}
        working-directory: src
        # One archive shape for all three platforms: .7z, LZMA2, -mx=9. See the
        # Windows job for the measurement that picked it over zip.
        #
        # The archive holds exactly one directory, named for the platform and
        # the architecture and nothing else. The version lives in the file name
        # instead, so unpacking a newer build over an older one replaces it in
        # place rather than leaving two versioned directories side by side.
        run: |
          version=$(python3 -c \
            "import json;print(json.load(open('shotium/package.json'))['version'])")
          stem="shotium-linux-${{ inputs.arch }}"
          archive="$stem-v$version.7z"
          rm -rf dist "$archive"
          mkdir -p "dist/$stem"
          # libshotium.so ships beside shotium rather than in an archive of its own:
          # they are the same engine, the resource packs serve both, and a
          # caller who wants the addon should not have to work out which two
          # downloads go together.
          cp out/Shot/shotium out/Shot/libshotium.so              out/Shot/shotium_data.pak out/Shot/shotium_strings.pak "dist/$stem/"
          ls -l "dist/$stem"
          ( cd dist && 7z a -t7z -mx=9 "../$archive" "$stem" )
          ls -l "$archive"
          {
            echo "SHOT_VERSION=$version"
            echo "SHOT_STEM=$stem"
            echo "SHOT_ARCHIVE=$archive"
          } >> "$GITHUB_ENV"

      - name: upload
        if: ${{ success() && github.event.inputs.mode == 'build' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SHOT_STEM }}
          path: src/${{ env.SHOT_ARCHIVE }}
          if-no-files-found: error
          # upload-artifact always wraps what it is handed in a zip and only
          # exposes a deflate level; no switch turns the wrapper off. 0 stores
          # the .7z as-is instead of re-compressing compressed bytes. The
          # release step below is where a download is the .7z itself.
          compression-level: 0

      - name: npm platform package
        if: ${{ success() && github.event.inputs.mode == 'build' }}
        working-directory: src
        # One of the six @shotkit/shotium-<os>-<arch> packages: the shared
        # library, the addon linked against it, and the two resource packs, in
        # a package npm can install. @shotkit/shotium depends on all six as
        # optionalDependencies with os/cpu set, so an install pulls the one
        # that matches and skips the rest. See
        # scripts/make-platform-package.ts.
        #
        # Not the executable. It is a second, independent copy of the same
        # engine -- shot_core is a source_set, so its objects link into both
        # the executable and the library -- and node has no use for it now that
        # rendering is in-process. Shipping it doubled the download. It still
        # goes out in the .7z on the releases page, for using the engine
        # without node.
        #
        # Which makes the addon the only thing in the package that node can
        # call, so this step fails rather than warns if there is not one. It
        # used to warn and ship anyway, back when a package without an addon
        # could still drive the worker pool; there is no pool to fall back to.
        #
        # On x64 the addon already exists: the checks step built it against
        # this job's own library and proved it renders the same bytes as the
        # executable. On arm64 the checks did not run -- the runner cannot
        # execute an arm64 binary -- so it is cross-compiled here and ships
        # having been checked by nothing but the compiler and the linker.
        # node-gyp compiles binding.cc with the system compiler rather than
        # the one Chromium brought, which is why a second toolchain has to be
        # installed for it and for nothing else.
        run: |
          arch="${{ env.SHOT_CPU }}"
          addon="shotium/native/build/Release/shotium.node"
          if [ ! -f "$addon" ] && [ "$arch" = arm64 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq g++-aarch64-linux-gnu
            ( cd shotium/native \
              && SHOT_INCLUDE_DIR="$PWD/../../shot" \
                 SHOT_LIB_DIR="$PWD/../../out/Shot" \
                 CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ \
                 pnpm dlx node-gyp@13 rebuild --arch=arm64 )
          fi
          if [ ! -f "$addon" ]; then
            echo "no $addon -- the package would install and then be unable"
            echo "to render, since the addon is the only thing in it node can"
            echo "call. Not shipping that."
            exit 1
          fi
          pnpm package:platform \
            --build out/Shot --os linux --arch "$arch" --dest dist/npm \
            --addon "$addon"
          ( cd "dist/npm/shotium-linux-$arch" && npm pack --pack-destination .. )
          tarball=$(ls dist/npm/*.tgz | head -1)
          ls -l "$tarball"
          echo "SHOT_NPM_TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: upload the npm package
        if: ${{ success() && github.event.inputs.mode == 'build' }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-shotium-linux-${{ inputs.arch }}
          path: src/${{ env.SHOT_NPM_TARBALL }}
          if-no-files-found: error
          compression-level: 0
