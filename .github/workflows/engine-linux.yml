# Builds //shot:shot on Linux for x64 or arm64, both on an x64 host.
#
# arm64 is cross-compiled, and not by preference. It was native at first, on
# ubuntu-24.04-arm, which GitHub documents as the same machine as the x64
# runner; the appeal was that the check suites would run the binary on the
# architecture it ships for. gclient sync refuses:
#
#   failed to resolve infra/3pp/tools/gperf/linux-arm64@version:3@3.2
#   no such package: infra/3pp/tools/gperf/linux-arm64
#
# DEPS asks for infra/3pp/tools/gperf/${platform} whenever host_os is linux,
# and upstream has never published that package for linux-arm64, because
# upstream has never built there: Chromium's own linux-arm64 is cross-compiled
# from an x64 host, where ${platform} resolves to linux-amd64 and the package
# exists. Nothing in this fork can conjure a CIPD package that was never built,
# so the fix is to build the way the package list assumes.
#
# Cross-compiling also settles the sysroot, which is the other half of the same
# assumption: debian_bullseye_arm64-sysroot is gated on checkout_arm64, so
# target_cpu in .gclient is what fetches it.
#
# The cost is real and worth stating: an x64 runner cannot execute an arm64
# binary, so run_checks is ignored for that architecture. windows-arm64 is in
# the same position for the same reason.
#
# This is deliberately a separate workflow from engine-windows.yml rather than
# a matrix entry on it. The Windows build works; folding an unproven target
# into the same job would put it at risk for no gain, and the two have almost
# no steps in common anyway -- no Visual Studio, no SDK hunt, different
# packaging.
#
# What is genuinely unknown here is how much of the cutting assumed Windows.
# Every round of it was verified by building and rendering on Windows only, and
# a cut that removed something only a POSIX file reads would not have shown up.
# The audit that preceded this workflow sampled 19 Linux-specific sources
# across base, net, skia, blink and ui and found all 19 still present, so the
# source tree is probably not the problem -- but "probably" is why `mode:
# probe` exists.
#
#   probe   sync, gn gen, and ask ninja what it *would* do. About 30 minutes,
#           and it surfaces every configuration error: an arg that does not
#           exist on this platform, a source a BUILD.gn names that the pruning
#           removed, a missing dependency. Iterate here.
#   build   the real thing, once probe is clean.
#
# Discovering a one-line GN error costs half an hour this way instead of the
# four it takes to reach the link step and fail there.
name: engine (linux)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe (sync + gn gen + ninja -n) or build'
        type: choice
        options: [probe, build]
        default: probe
      arch:
        description: 'x64 (native) or arm64 (cross-compiled from this x64 host)'
        type: choice
        options: [x64, arm64]
        default: x64
      jobs:
        description: 'ninja -j (4 cores; blink layout TUs peak at ~1.2 GB each)'
        default: '4'
      run_checks:
        description: 'run the check suites if the build finishes'
        type: boolean
        default: true
      release:
        description: 'upload the archive to the draft release for this version'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    permissions:
      contents: write  # the release step creates and uploads to a draft release
      actions: write   # so the run can delete the cache entries it supersedes

    env:
      DEPOT_TOOLS_UPDATE: '0'

    steps:
      - name: free up disk
        # GitHub documents 14 GB of SSD and does not say how much of it a job
        # actually gets. A Chromium checkout plus a build directory does not
        # fit next to the preinstalled toolchains either way, and the same step
        # is what makes the Windows job fit. These are the big ones and none of
        # them is a build input here; df before and after says what it bought.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: checkout
        uses: actions/checkout@v4
        with:
          path: src
          # Read by tools/shot/ci_stamp_mtimes.py, which needs the commit that
          # last touched each file for the build cache to be worth anything.
          fetch-depth: 0
          submodules: false

      - name: depot_tools
        # The bootstrap has to be invoked by hand, for the same reason the
        # Windows job calls win_tools.bat: DEPOT_TOOLS_UPDATE=0 is set so a run
        # pins the depot_tools it cloned instead of pulling a newer one
        # mid-build, and that skips the call that would otherwise bootstrap it.
        # The bootstrap is not only the self-update -- it writes
        # python3_bin_reldir.txt, which the `gn` and `ninja` wrappers read to
        # find their interpreter.
        #
        # gclient sync works without it, which is what makes this worth a
        # comment: the failure surfaces much later, at gn gen, as
        #   python3_bin_reldir.txt not found. need to initialize depot_tools
        # long after the step that should have done it reported success.
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          "$HOME/depot_tools/ensure_bootstrap"
          test -f "$HOME/depot_tools/python3_bin_reldir.txt" \
            || { echo "bootstrap produced no python3_bin_reldir.txt"; exit 1; }
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: gclient solution
        # target_os is the whole reason a Linux sync produces anything usable:
        # DEPS gates entries like third_party/fontconfig/src on checkout_linux,
        # and the local .gclient in this tree says ["win"], so a naive sync here
        # would silently omit them and fail much later with a missing include.
        run: |
          cat > .gclient <<'EOF'
          solutions = [{
            "name": "src",
            "url": "https://github.com/${{ github.repository }}.git",
            "managed": False,
            "custom_deps": {},
            "custom_vars": {"checkout_configuration": "small"},
          }]
          target_os = ["linux"]
          target_cpu = ["x64", "arm64"]
          EOF
          cat .gclient

      - name: gclient sync
        run: |
          gclient sync --nohooks --no-history --shallow --verbose
          gclient runhooks
          df -h /

      - name: build dependencies
        # --no-prompt because there is no terminal, --no-nacl because it is not
        # in this build graph.
        #
        # These are host packages, and for x64 they are also what the compiler
        # links against. arm64 links against debian_bullseye_arm64-sysroot
        # instead, which gclient fetches because .gclient names arm64 in
        # target_cpu -- so there is no install-sysroot.py step here; DEPS has
        # already done it.
        working-directory: src
        run: |
          sudo ./build/install-build-deps.sh --no-prompt --no-nacl || \
          sudo ./build/install-build-deps.sh --no-prompt

      - name: make source timestamps content-faithful
        run: python3 src/tools/shot/ci_stamp_mtimes.py .

      - name: restore the build directory
        uses: actions/cache/restore@v4
        # See engine-windows.yml for why the build directory itself is the
        # cache and why nothing else shares the budget with it. The key carries
        # the architecture as well as the platform: the two produce entirely
        # different objects even from the same host, and restoring one into the
        # other would rebuild everything having evicted something useful.
        with:
          path: src/out/Shot
          key: out-shot-linux-${{ github.event.inputs.arch }}-${{ github.run_id }}
          restore-keys: |
            out-shot-linux-${{ github.event.inputs.arch }}-

      - name: build the shot ICU data set
        working-directory: src
        # Same as the Windows job: third_party/icu is a DEPS checkout, so the
        # trimmed data set has to be regenerated on every run rather than
        # checked in. Failing loudly beats quietly building against `cast` and
        # shipping a binary 0.81 MB larger than the numbers claim.
        run: |
          mkdir -p third_party/icu/shot
          python3 tools/shot/icu_repack.py \
            third_party/icu/cast/icudtl.dat \
            third_party/icu/shot/icudtl.dat --preset shot

      - name: gn gen
        working-directory: src
        # The args file is imported rather than passed on the command line: it
        # has quoted values that do not survive interpolation, and writing the
        # same bytes every run is what keeps a restored build directory valid.
        # No target_cpu: the build is native, so GN takes the host's. Naming
        # it would only be a claim that could disagree with the runner.
        run: |
          mkdir -p out/Shot
          {
            echo 'import("//build/args/shot-linux.gn")'
            echo 'target_cpu = "${{ github.event.inputs.arch }}"'
          } > out/Shot/args.gn
          cat out/Shot/args.gn
          gn gen out/Shot

      - name: probe
        if: ${{ github.event.inputs.mode == 'probe' }}
        working-directory: src
        # `ninja -n` resolves the whole graph and names every edge it would run
        # without compiling anything, so a BUILD.gn that references a file the
        # pruning removed fails here in seconds. The edge count is the useful
        # output: it says how much of this platform is actually configured.
        run: |
          ninja -C out/Shot shot shot_c -n > /tmp/probe.txt 2>&1 || {
            echo "=== ninja refused the graph ==="
            tail -40 /tmp/probe.txt
            exit 1
          }
          echo "edges ninja would run: $(grep -c '^\[' /tmp/probe.txt || true)"
          grep -oE '^\[[0-9]+/[0-9]+\] [A-Z_]+' /tmp/probe.txt \
            | awk '{print $2}' | sort | uniq -c | sort -rn | head
          echo
          echo "probe clean -- re-run this workflow with mode: build"

      - name: probe log
        if: ${{ always() && github.event.inputs.mode == 'probe' }}
        uses: actions/upload-artifact@v4
        # Uploaded whether the probe passed or failed, because the failing case
        # is the one worth having: tools/shot/restore_from_upstream.py --log
        # reads exactly this file and puts back whatever it names.
        with:
          name: probe-linux-${{ github.event.inputs.arch }}
          path: /tmp/probe.txt
          if-no-files-found: ignore

      - name: why is the restored build directory dirty
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: src
        # The cache restores ~300 MB of objects, yet recent runs re-ran nearly
        # every CXX edge they had already built -- a cached run should be a
        # fraction of a full one. `-d explain` makes ninja say why each dirty
        # edge is dirty; the root causes appear at the top, so a head of the
        # output is the whole answer. Diagnosis only: nothing is built here.
        run: ninja -C out/Shot shot shot_c -n -d explain 2>&1 | head -120 || true

      - name: forget the previous binary
        # The build directory is restored from cache, so out/Shot still
        # holds the previous run's executable -- and when a compile fails,
        # "did the build finish" would find that stale binary, call the run
        # a success, and ship yesterday's build as today's artifact. It
        # did, once. Deleting it first means only this run's link can
        # satisfy the check; the relink costs a couple of minutes.
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: src
        run: rm -f out/Shot/shotium out/Shot/libshotium.so

      - name: ninja
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: src
        continue-on-error: true
        timeout-minutes: 280
        # -k 0: this platform is still being brought up, and each round costs
        # a runner-hour -- keep compiling past a failure so one log names every
        # broken translation unit, not just the first.
        # shot_c is the same engine behind a C ABI, for shotium's node addon.
        # The second link shares this directory's ThinLTO cache with the first,
        # so it reuses that codegen and costs minutes rather than an hour.
        run: ninja -C out/Shot shot shot_c -j ${{ github.event.inputs.jobs }} -k 0

      - name: save the build directory
        if: ${{ always() && github.event.inputs.mode == 'build' }}
        uses: actions/cache/save@v4
        with:
          path: src/out/Shot
          key: out-shot-linux-${{ github.event.inputs.arch }}-${{ github.run_id }}

      - name: drop the build directories this one replaces
        if: ${{ always() && github.event.inputs.mode == 'build' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # The repository gets 10 GB of Actions cache in total and one build
        # directory is 6.1 GB before compression, so entries that are no longer
        # wanted have to go or they evict the one that is. Never fatal: the
        # cache is an optimisation.
        run: |
          prefix="out-shot-linux-${{ github.event.inputs.arch }}-"
          # .[2:] keeps the newest two: this run's entry, and one spare to fall
          # back on if this run's turns out to be unusable.
          ids=$(gh cache list --repo "${{ github.repository }}" \
                  --key "$prefix" --limit 100 \
                  --sort created_at --order desc \
                  --json id --jq '.[2:][].id' 2>/dev/null || true)
          for id in $ids; do
            echo "deleting cache entry $id"
            gh cache delete "$id" --repo "${{ github.repository }}" || true
          done

      - name: did the build finish
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: src
        run: |
          for wanted in out/Shot/shotium out/Shot/libshotium.so; do
            if [ ! -f "$wanted" ]; then
              echo "$wanted was not produced -- the build got further, but is not done."
              echo "Run this workflow again; the cache carries the objects over."
              exit 1
            fi
          done
          ls -l out/Shot/shotium out/Shot/libshotium.so

      - name: package
        if: ${{ success() && github.event.inputs.mode == 'build' }}
        working-directory: src
        # One archive shape for all three platforms: .7z, LZMA2, -mx=9. See the
        # Windows job for the measurement that picked it over zip.
        #
        # The archive holds exactly one directory, named for the platform and
        # the architecture and nothing else. The version lives in the file name
        # instead, so unpacking a newer build over an older one replaces it in
        # place rather than leaving two versioned directories side by side.
        run: |
          version=$(python3 -c \
            "import json;print(json.load(open('shotium/package.json'))['version'])")
          stem="shotium-linux-${{ github.event.inputs.arch }}"
          archive="$stem-v$version.7z"
          rm -rf dist "$archive"
          mkdir -p "dist/$stem"
          # libshotium.so ships beside shotium rather than in an archive of its own:
          # they are the same engine, the resource packs serve both, and a
          # caller who wants the addon should not have to work out which two
          # downloads go together.
          cp out/Shot/shotium out/Shot/libshotium.so              out/Shot/shotium_data.pak out/Shot/shotium_strings.pak "dist/$stem/"
          ls -l "dist/$stem"
          ( cd dist && 7z a -t7z -mx=9 "../$archive" "$stem" )
          ls -l "$archive"
          {
            echo "SHOT_VERSION=$version"
            echo "SHOT_STEM=$stem"
            echo "SHOT_ARCHIVE=$archive"
          } >> "$GITHUB_ENV"

      - name: upload
        if: ${{ success() && github.event.inputs.mode == 'build' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SHOT_STEM }}
          path: src/${{ env.SHOT_ARCHIVE }}
          if-no-files-found: error
          # upload-artifact always wraps what it is handed in a zip and only
          # exposes a deflate level; no switch turns the wrapper off. 0 stores
          # the .7z as-is instead of re-compressing compressed bytes. The
          # release step below is where a download is the .7z itself.
          compression-level: 0

      - name: checks
        # x64 only. The runner is x64 for both architectures now, so there is
        # nothing here that can execute an arm64 binary; asking would fail on
        # "cannot execute binary file" and read as a broken engine rather than
        # a host that cannot run it. An arm64 artifact therefore ships checked
        # by nothing but the compiler and the linker -- worth remembering
        # before trusting one.
        if: ${{ success() && github.event.inputs.mode == 'build'
                && github.event.inputs.run_checks == 'true'
                && github.event.inputs.arch == 'x64' }}
        working-directory: src
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/shot/serve_check.py out/Shot/shotium
          python3 tools/shot/net_check.py out/Shot/shotium
          # The two node suites run here as well as on Windows because
          # shotium/lib/endpoint.js has two branches -- a named pipe on
          # Windows, a unix socket everywhere else -- and the Windows job
          # exercises exactly one of them.
          node tools/shot/node_check.cjs out/Shot/shotium
          node tools/shot/daemon_check.cjs out/Shot/shotium
          # The node addon, and the C ABI under it. Built here rather than
          # taken from anywhere else, because the library it links against is
          # the one this job has just produced -- an addon checked against a
          # different build would be checking nothing.
          ( cd shotium/native             && SHOT_INCLUDE_DIR="$PWD/../../shot" SHOT_LIB_DIR="$PWD/../../out/Shot"                npx --yes node-gyp@13 rebuild )
          cp out/Shot/libshotium.so out/Shot/shotium_data.pak out/Shot/shotium_strings.pak              shotium/native/build/Release/
          # Under a backtrace if it dies. This build is is_official_build, and
          # an official build compiles CHECK() down to a bare trap with no
          # message -- so a failed CHECK inside the library arrives as
          # "Trace/breakpoint trap" and nothing else. symbol_level is 0, but
          # only -g0: .symtab survives the link, so gdb still names the
          # functions even though it cannot name the lines. Costs nothing when
          # the check passes.
          node tools/shot/native_check.cjs out/Shot/shotium || {
            status=$?
            echo "::group::native_check died with $status -- backtrace"
            readelf -SW out/Shot/libshotium.so | grep -E 'symtab|dynsym' || true
            sudo apt-get update -qq && sudo apt-get install -y -qq gdb || true
            gdb -q -batch \
                -ex 'set confirm off' \
                -ex run \
                -ex 'thread apply all bt 40' \
                --args node tools/shot/native_check.cjs out/Shot/shotium || true
            echo "::endgroup::"
            exit "$status"
          }
          python3 tools/shot/charset_check.py out/Shot/shotium
          python3 tools/shot/demo_check.py out/Shot/shotium

      - name: npm platform package
        if: ${{ success() && github.event.inputs.mode == 'build' }}
        working-directory: src
        # One of the six @shotkit/shotium-<os>-<arch> packages: the engine, the
        # shared library, the two resource packs and the addon, in a package
        # npm can install. @shotkit/shotium depends on all six as
        # optionalDependencies with os/cpu set, so an install pulls the one
        # that matches and skips the rest. See
        # tools/shot/make_platform_package.cjs.
        #
        # On x64 the addon already exists: the checks step built it against
        # this job's own library and compared its output against the
        # executable's. On arm64 the checks did not run, so it is
        # cross-compiled here and shipped unchecked -- node-gyp compiles
        # binding.cc with the system compiler rather than the one Chromium
        # brought, which is why a second toolchain has to be installed for it
        # and for nothing else.
        #
        # A failure to cross-compile is not a failure of the job. The package
        # is still complete for the worker pool and the daemon, which is what
        # require("@shotkit/shotium") uses; only require(".../native") wants
        # the addon, and native.js reports it missing rather than crashing.
        run: |
          arch="${{ github.event.inputs.arch }}"
          addon="shotium/native/build/Release/shotium.node"
          if [ ! -f "$addon" ] && [ "$arch" = arm64 ]; then
            sudo apt-get update -qq \
              && sudo apt-get install -y -qq g++-aarch64-linux-gnu || true
            ( cd shotium/native \
              && SHOT_INCLUDE_DIR="$PWD/../../shot" \
                 SHOT_LIB_DIR="$PWD/../../out/Shot" \
                 CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ \
                 npx --yes node-gyp@13 rebuild --arch=arm64 ) \
              || echo "::warning::the arm64 addon did not cross-compile;" \
                      "the package ships without it"
          fi
          argv=(--build out/Shot --os linux --arch "$arch" --dest dist/npm)
          if [ -f "$addon" ]; then
            argv+=(--addon "$addon")
          else
            echo "::warning::no addon was built; the package ships without it"
          fi
          node tools/shot/make_platform_package.cjs "${argv[@]}"
          ( cd "dist/npm/shotium-linux-$arch" && npm pack --pack-destination .. )
          tarball=$(ls dist/npm/*.tgz | head -1)
          ls -l "$tarball"
          echo "SHOT_NPM_TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: upload the npm package
        if: ${{ success() && github.event.inputs.mode == 'build' }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-shotium-linux-${{ github.event.inputs.arch }}
          path: src/${{ env.SHOT_NPM_TARBALL }}
          if-no-files-found: error
          compression-level: 0

      - name: release
        if: ${{ success() && github.event.inputs.mode == 'build'
                && github.event.inputs.release == 'true' }}
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        # A release asset is served as the bytes that were uploaded, so this
        # copy has no zip around it. It goes to a draft release: one run builds
        # one architecture, the release fills up over six of them, and nothing
        # is public until someone publishes it by hand.
        #
        # It is the last step in the job, after the checks, so a binary that
        # fails its own suites never becomes an asset.
        run: |
          tag="v$SHOT_VERSION"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --draft --title "$tag" \
                 --notes "shotium $SHOT_VERSION" --target "$GITHUB_SHA" \
            || gh release view "$tag" >/dev/null
          gh release upload "$tag" "$SHOT_ARCHIVE" --clobber
          gh release upload "$tag" "$SHOT_NPM_TARBALL" --clobber
