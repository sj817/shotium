name: Save and verify build cache
description: Confirm the cache exists and retry a failed reservation under a fresh key.
inputs:
  path:
    required: true
    description: Build directory to preserve
  key:
    required: true
    description: Primary cache key
runs:
  using: composite
  steps:
    - uses: actions/cache/save@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
    - id: verify
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        CACHE_KEY: ${{ inputs.key }}
      with:
        script: |
          for (let attempt = 0; attempt < 3; attempt++) {
            const {data} = await github.rest.actions.getActionsCacheList({
              ...context.repo, ref: context.ref, key: process.env.CACHE_KEY
            });
            if (data.actions_caches.some(c => c.key === process.env.CACHE_KEY)) {
              core.setOutput('missing', 'false'); return;
            }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          core.setOutput('missing', 'true');
          core.warning('Primary cache was not saved; retrying with a fresh reservation.');
    - if: steps.verify.outputs.missing == 'true' || steps.verify.outcome != 'success'
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}-retry
    - if: steps.verify.outputs.missing == 'true' || steps.verify.outcome != 'success'
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        CACHE_KEY: ${{ inputs.key }}-retry
      with:
        script: |
          const {data} = await github.rest.actions.getActionsCacheList({
            ...context.repo, ref: context.ref, key: process.env.CACHE_KEY
          });
          if (!data.actions_caches.some(c => c.key === process.env.CACHE_KEY)) {
            core.warning('Build cache was not persisted after retry; next run may rebuild.');
          }
