name: linux source
description: >-
  Everything a Linux engine job does before ninja: free the disk, check out
  the tree and its DEPS, stamp source mtimes, restore the build directory when
  asked, patch Skia, build the ICU data set and run gn gen. The compile shards
  and the final job of engine-linux.yml both use it, and must, because a
  shard's objects are only valid in the final job if both ran the same gn gen
  on the same sources. A workflow cannot reference a local action before the
  repository is checked out, so the caller checks out .github first (a sparse
  checkout, seconds) and this action does the real one into src/.

inputs:
  arch:
    description: amd64 or arm64, as the workflow input spells it
    required: true
  cpu:
    description: GN target_cpu, x64 or arm64
    required: true
  platform:
    description: the public platform label, windows-amd64 ... macos-arm64, which names the build-directory artifact
    required: true
  build-dir-run-id:
    description: the run whose build-dir-<platform> artifact to start from (ci:select-shards found it); empty restores from the Actions cache instead
    default: ''

runs:
  using: composite
  steps:
    - name: free up disk
      shell: bash
      # GitHub documents 14 GB of SSD, but an ubuntu-24.04 runner turns out
      # to hand the job a 145 GB root with 87 GB free, and this build wants
      # about 35 of it. So the deletions below are a fallback for an image
      # that is smaller than the one measured, not something every run
      # should pay: on Windows the same step cost 7 minutes and freed a
      # drive nothing used. Under 80 GB free they run; df says either way
      # what the job had, which is what a later ENOSPC needs.
      run: |
        df -h /
        free_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
        if [ "${free_gb:-0}" -gt 80 ]; then
          echo "${free_gb} GB free; keeping the preinstalled toolchains"
          exit 0
        fi
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                    /opt/ghc /usr/local/share/boost \
                    "$AGENT_TOOLSDIRECTORY" || true
        sudo apt-get clean
        df -h /

    - name: checkout
      uses: actions/checkout@v7
      with:
        path: src
        # Read by scripts/ci/stamp-mtimes.ts, which needs the commit that
        # last touched each file for the build cache to be worth anything.
        fetch-depth: 0
        submodules: false

    - name: set up node
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 9.15.9

    - name: repository scripts
      shell: bash
      working-directory: src/scripts
      run: pnpm install --frozen-lockfile

    - name: depot_tools
      shell: bash
      # The bootstrap has to be invoked by hand, for the same reason the
      # Windows job calls win_tools.bat: DEPOT_TOOLS_UPDATE=0 is set so a run
      # pins the depot_tools it cloned instead of pulling a newer one
      # mid-run, and with self-update off nothing else fetches the CIPD
      # python that gclient needs. ensure_bootstrap is that fetch on its own.
      run: |
        git clone --depth 1 \
          https://chromium.googlesource.com/chromium/tools/depot_tools.git \
          "$HOME/depot_tools"
        "$HOME/depot_tools/ensure_bootstrap"
        test -f "$HOME/depot_tools/python3_bin_reldir.txt" \
          || { echo "bootstrap produced no python3_bin_reldir.txt"; exit 1; }
        echo "$HOME/depot_tools" >> "$GITHUB_PATH"

    - name: gclient solution
      shell: bash
      # target_os is the whole reason a Linux sync produces anything usable:
      # DEPS gates entries like third_party/fontconfig/src on checkout_linux,
      # and the local .gclient in this tree says ["win"], so a naive sync here
      # would silently omit them and fail much later with a missing include.
      run: |
        cat > .gclient <<'EOF'
        solutions = [{
          "name": "src",
          "url": "https://github.com/${{ github.repository }}.git",
          "managed": False,
          "custom_deps": {},
          "custom_vars": {"checkout_configuration": "small"},
        }]
        target_os = ["linux"]
        target_cpu = ["x64", "arm64"]
        EOF
        cat .gclient

    - name: restore the downloaded compiler toolchains
      id: toolchains
      uses: actions/cache/restore@v6
      with:
        # Both Linux targets use the same x64 host tools. Include GCS receipt
        # files with the extracted trees so gclient can verify and reuse them.
        # No prefix fallback: changed dependency definitions start a fresh cache.
        path: |
          src/third_party/llvm-build
          src/third_party/rust-toolchain
          .gcs_entries
        key: toolchains-linux-x64-v1-${{ hashFiles('src/DEPS', 'src/tools/clang/scripts/update.py', 'src/tools/rust/update_rust.py') }}

    - name: gclient sync
      shell: bash
      run: |
        gclient sync --nohooks --no-history --shallow --verbose
        gclient runhooks
        df -h /

    - name: save the downloaded compiler toolchains
      if: steps.toolchains.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          src/third_party/llvm-build
          src/third_party/rust-toolchain
          .gcs_entries
        key: ${{ steps.toolchains.outputs.cache-primary-key }}

    - name: build dependencies
      shell: bash
      # --no-prompt because there is no terminal, --no-nacl because it is not
      # in this build graph.
      #
      # These are host packages, and for x64 they are also what the compiler
      # links against. arm64 links against debian_bullseye_arm64-sysroot
      # instead, which gclient fetches because .gclient names arm64 in
      # target_cpu -- so there is no install-sysroot.py step here; DEPS has
      # already done it.
      working-directory: src
      run: |
        sudo ./build/install-build-deps.sh --no-prompt --no-nacl || \
        sudo ./build/install-build-deps.sh --no-prompt

    - name: restore the build directory
      if: inputs.build-dir-run-id != ''
      uses: actions/download-artifact@v8
      # See .github/actions/windows-source for why the build directory
      # itself travels, as an artifact, and why nothing is left out of it.
      # The name carries the architecture as well as the platform: the two
      # produce entirely different objects even from the same host.
      with:
        name: build-dir-${{ inputs.platform }}
        run-id: ${{ inputs.build-dir-run-id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/build-dir

    - name: unpack the build directory
      if: inputs.build-dir-run-id != ''
      shell: bash
      working-directory: src
      # An artifact that does not unpack to a build directory is a cold
      # start, not a failed job: the run that saved it may have been
      # cancelled mid-way. ci:select-shards already ignores tiny blobs.
      run: |
        if zstd -d -T0 --long=27 -c "$RUNNER_TEMP/build-dir/build-dir.tar.zst" | tar -xf - && [ -f out/Shot/build.ninja ]; then
          du -sh out/Shot
        else
          echo "::warning::build-dir-${{ inputs.platform }} from run ${{ inputs.build-dir-run-id }} is unusable; starting cold"
          rm -rf out/Shot
        fi
        rm -f "$RUNNER_TEMP/build-dir/build-dir.tar.zst"

    - name: restore the build directory from the Actions cache
      if: inputs.build-dir-run-id == ''
      uses: actions/cache/restore@v6
      # Transitional: the first runs after the switch to artifacts have no
      # build-dir-<platform> artifact yet, so they start from the cache
      # entries the previous workflows wrote. Remove once every platform has
      # saved one.
      with:
        path: src/out/Shot
        key: out-shot-linux-${{ inputs.cpu }}-${{ github.run_id }}
        restore-keys: |
          out-shot-linux-${{ inputs.cpu }}-

    - name: make source timestamps content-faithful
      shell: bash
      run: pnpm -C src ci:stamp-mtimes "$GITHUB_WORKSPACE"

    - name: build the shot ICU data set
      shell: bash
      working-directory: src
      # Generate Shot data from the directly tracked ICU cast data.
      run: |
        mkdir -p third_party/icu/shot
        pnpm icu:repack \
          third_party/icu/cast/icudtl.dat \
          third_party/icu/shot/icudtl.dat --preset shot
        # The repack writes icudtl.dat with "now" for an mtime on every run,
        # and ninja then redoes the data assembly, the ICU library and every
        # library that links it. Use the latest ICU source or repack-script commit.
        when=$(git log -1 --format=%ct -- third_party/icu)
        for f in scripts/build/icu-repack.ts; do
          t=$(git log -1 --format=%ct -- "$f"); [ "$t" -gt "$when" ] && when=$t
        done
        touch -t "$(date -u -d "@$when" +%Y%m%d%H%M.%S 2>/dev/null || date -u -r "$when" +%Y%m%d%H%M.%S)" third_party/icu/shot/icudtl.dat

    - name: prepare pinned Node SDK
      shell: bash
      working-directory: src
      run: pnpm build:node-sdk

    - name: gn gen
      shell: bash
      working-directory: src
      # The args file is imported rather than passed on the command line: it
      # has quoted values that do not survive interpolation, and writing the
      # same bytes every run is what keeps a restored build directory valid
      # and what makes every shard's graph identical to the final job's.
      run: |
        mkdir -p out/Shot
        {
          echo 'import("//build/args/shot-linux.gn")'
          echo 'target_cpu = "${{ inputs.cpu }}"'
        } > out/Shot/args.gn
        cat out/Shot/args.gn
        gn gen out/Shot
