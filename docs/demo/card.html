<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=720, initial-scale=1">
  <title>Boarding Pass</title>
  <style>
    :root {
      --paper: #ffffff;
      --paper-2: #f8f9fa;
      --ink: #111318;
      --ink-2: #4b5059;
      --ink-3: #8a9099;
      --hair: #e5e7eb;
      --hair-2: #d7dae0;
      --ok: #2f9e5f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 720px;
      height: 380px;
      overflow: hidden;
    }

    body {
      position: relative;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "Segoe UI Variable Display", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-feature-settings: "tnum" 1, "kern" 1;
      background:
        radial-gradient(1100px 620px at 50% -10%, #f9fafb 0%, #eff1f4 55%, #e9ebef 100%);
    }

    /* Shadow lives on a wrapper: the pass itself is masked (notches),
       and a mask would clip its own box-shadow away. */
    .lift {
      position: absolute;
      inset: 24px;
      border-radius: 20px;
      box-shadow:
        0 1px 1px rgba(17, 19, 24, 0.03),
        0 3px 8px rgba(17, 19, 24, 0.05),
        0 28px 48px -22px rgba(17, 19, 24, 0.22);
    }

    .pass {
      position: absolute;
      inset: 24px;
      border-radius: 20px;
      background: var(--paper);
      display: grid;
      grid-template-columns: 448px 224px;
      box-shadow: inset 0 0 0 1px rgba(17, 19, 24, 0.06);
      -webkit-mask:
        radial-gradient(12px circle at 448px 0, transparent 11.5px, #000 12.5px),
        radial-gradient(12px circle at 448px 100%, transparent 11.5px, #000 12.5px);
      -webkit-mask-composite: source-in;
      mask:
        radial-gradient(12px circle at 448px 0, transparent 11.5px, #000 12.5px),
        radial-gradient(12px circle at 448px 100%, transparent 11.5px, #000 12.5px);
      mask-composite: intersect;
    }

    /* ---------- Main leaf ---------- */

    .main {
      padding: 28px 32px 26px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--ink);
    }
    .brand svg { width: 22px; height: 22px; display: block; }
    .brand .thin { font-weight: 400; color: var(--ink-3); letter-spacing: 0.22em; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 24px;
      padding: 0 11px 0 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--ink-2);
      background: var(--paper-2);
      border: 1px solid var(--hair);
    }
    .status i {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 3px rgba(47, 158, 95, 0.12);
    }

    .route {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      column-gap: 18px;
    }
    .port .code {
      font-size: 48px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.035em;
      color: var(--ink);
    }
    .port .meta {
      margin-top: 8px;
      font-size: 12.5px;
      line-height: 1;
      font-weight: 500;
      color: var(--ink-3);
      white-space: nowrap;
    }
    .port .meta b {
      font-weight: 600;
      color: var(--ink-2);
    }
    .port.to { text-align: right; }
    .port .meta sup {
      font-size: 9px;
      vertical-align: top;
      position: relative;
      top: -1px;
      margin-left: 1px;
    }

    .path {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding-top: 6px;
    }
    .path .line {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .path .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      border: 1.5px solid var(--ink);
      background: var(--paper);
      flex: none;
    }
    .path .dot.solid { background: var(--ink); }
    .path .seg {
      flex: 1;
      height: 0;
      border-top: 1.5px dashed var(--hair-2);
    }
    .path svg {
      width: 20px; height: 20px;
      display: block;
      flex: none;
      color: var(--ink);
    }
    .path .dur {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-2);
      white-space: nowrap;
    }
    .path .dur + .dur {
      margin-top: -3px;
      color: var(--ink-3);
    }

    .facts {
      display: grid;
      grid-template-columns: 1.55fr 1fr 1fr 0.9fr;
      row-gap: 16px;
      column-gap: 12px;
      padding-top: 18px;
      border-top: 1px solid var(--hair);
    }
    .fact .k {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .fact .v {
      margin-top: 5px;
      font-size: 14.5px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: -0.005em;
      color: var(--ink);
      white-space: nowrap;
    }

    /* ---------- Stub ---------- */

    .stub {
      border-left: 1.5px dashed var(--hair-2);
      background: linear-gradient(180deg, #fbfbfc 0%, #f5f6f8 100%);
      padding: 26px 22px 22px 22px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
    }

    .stub .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .stub .top .fact.r { text-align: right; }

    .qr {
      align-self: center;
      width: 122px;
      height: 122px;
      padding: 10px;
      border-radius: 10px;
      background: var(--paper);
      border: 1px solid var(--hair);
      box-shadow: 0 1px 2px rgba(17, 19, 24, 0.04);
    }
    .qr svg { width: 100px; height: 100px; display: block; }

    .seat-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      text-align: center;
    }
    .seat-row .k {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .seat-row .v {
      margin-top: 5px;
      font-size: 19px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .seat-row > div + div { border-left: 1px solid var(--hair); }

    .stub .note {
      text-align: center;
      font-size: 10.5px;
      font-weight: 500;
      color: var(--ink-3);
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <div class="lift" aria-hidden="true"></div>

  <article class="pass" aria-label="Boarding pass">

    <section class="main">
      <header class="head">
        <div class="brand">
          <svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="11" cy="11" r="11" fill="#111318"/>
            <path d="M5.2 11c2.1-3.6 9.5-3.6 11.6 0-2.1 3.6-9.5 3.6-11.6 0z" fill="#ffffff"/>
            <circle cx="11" cy="11" r="1.7" fill="#111318"/>
          </svg>
          <span>MERIDIAN <span class="thin">AIR</span></span>
        </div>
        <span class="status"><i></i>On time</span>
      </header>

      <div class="route">
        <div class="port from">
          <div class="code">SFO</div>
          <div class="meta">San Francisco &nbsp;<b>08:45</b></div>
        </div>

        <div class="path" aria-hidden="true">
          <div class="line">
            <span class="dot solid"></span>
            <span class="seg"></span>
            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path transform="rotate(90 12 12)"
                    d="M21 16v-2l-8-5V3.5C13 2.67 12.33 2 11.5 2S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
            </svg>
            <span class="seg"></span>
            <span class="dot"></span>
          </div>
          <div class="dur">11h 25m</div>
          <div class="dur">Nonstop</div>
        </div>

        <div class="port to">
          <div class="code">HND</div>
          <div class="meta">Tokyo Haneda &nbsp;<b>12:10<sup>+1</sup></b></div>
        </div>
      </div>

      <div class="facts">
        <div class="fact"><div class="k">Passenger</div><div class="v">Eleanor Whitmore</div></div>
        <div class="fact"><div class="k">Flight</div><div class="v">MR 128</div></div>
        <div class="fact"><div class="k">Date</div><div class="v">14 Oct 2026</div></div>
        <div class="fact"><div class="k">Class</div><div class="v">First</div></div>

        <div class="fact"><div class="k">Boarding</div><div class="v">08:05</div></div>
        <div class="fact"><div class="k">Gate</div><div class="v">B22</div></div>
        <div class="fact"><div class="k">Seat</div><div class="v">2A</div></div>
        <div class="fact"><div class="k">Terminal</div><div class="v">I</div></div>
      </div>
    </section>

    <aside class="stub">
      <div class="top">
        <div class="fact"><div class="k">Flight</div><div class="v">MR 128</div></div>
        <div class="fact r"><div class="k">Seq</div><div class="v">014</div></div>
      </div>

      <div class="qr" aria-hidden="true">
        <svg viewBox="0 0 25 25" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
          <path fill="#111318" d="M0 0h7v1h-7zM12 0h1v1h-1zM14 0h1v1h-1zM18 0h7v1h-7zM0 1h1v1h-1zM6 1h1v1h-1zM8 1h3v1h-3zM12 1h1v1h-1zM14 1h1v1h-1zM16 1h1v1h-1zM18 1h1v1h-1zM24 1h1v1h-1zM0 2h1v1h-1zM2 2h3v1h-3zM6 2h1v1h-1zM8 2h1v1h-1zM10 2h1v1h-1zM12 2h1v1h-1zM14 2h1v1h-1zM16 2h1v1h-1zM18 2h1v1h-1zM20 2h3v1h-3zM24 2h1v1h-1zM0 3h1v1h-1zM2 3h3v1h-3zM6 3h1v1h-1zM8 3h2v1h-2zM12 3h5v1h-5zM18 3h1v1h-1zM20 3h3v1h-3zM24 3h1v1h-1zM0 4h1v1h-1zM2 4h3v1h-3zM6 4h1v1h-1zM9 4h1v1h-1zM11 4h3v1h-3zM16 4h1v1h-1zM18 4h1v1h-1zM20 4h3v1h-3zM24 4h1v1h-1zM0 5h1v1h-1zM6 5h1v1h-1zM10 5h5v1h-5zM16 5h1v1h-1zM18 5h1v1h-1zM24 5h1v1h-1zM0 6h7v1h-7zM8 6h1v1h-1zM10 6h1v1h-1zM12 6h1v1h-1zM14 6h1v1h-1zM16 6h1v1h-1zM18 6h7v1h-7zM8 7h3v1h-3zM14 7h2v1h-2zM0 8h1v1h-1zM6 8h1v1h-1zM8 8h2v1h-2zM12 8h4v1h-4zM17 8h2v1h-2zM21 8h3v1h-3zM2 9h1v1h-1zM4 9h2v1h-2zM8 9h1v1h-1zM12 9h1v1h-1zM15 9h1v1h-1zM19 9h5v1h-5zM1 10h2v1h-2zM4 10h4v1h-4zM9 10h1v1h-1zM11 10h3v1h-3zM15 10h1v1h-1zM19 10h3v1h-3zM23 10h2v1h-2zM0 11h4v1h-4zM8 11h2v1h-2zM11 11h1v1h-1zM14 11h6v1h-6zM21 11h1v1h-1zM24 11h1v1h-1zM1 12h2v1h-2zM4 12h1v1h-1zM6 12h6v1h-6zM16 12h1v1h-1zM18 12h2v1h-2zM24 12h1v1h-1zM0 13h1v1h-1zM2 13h2v1h-2zM12 13h2v1h-2zM15 13h1v1h-1zM17 13h1v1h-1zM19 13h1v1h-1zM23 13h1v1h-1zM0 14h1v1h-1zM2 14h3v1h-3zM6 14h1v1h-1zM8 14h3v1h-3zM13 14h1v1h-1zM15 14h1v1h-1zM17 14h5v1h-5zM23 14h2v1h-2zM0 15h1v1h-1zM2 15h1v1h-1zM4 15h1v1h-1zM7 15h1v1h-1zM9 15h2v1h-2zM12 15h1v1h-1zM14 15h3v1h-3zM18 15h2v1h-2zM21 15h2v1h-2zM24 15h1v1h-1zM0 16h1v1h-1zM4 16h3v1h-3zM8 16h3v1h-3zM12 16h2v1h-2zM15 16h6v1h-6zM22 16h1v1h-1zM8 17h3v1h-3zM13 17h2v1h-2zM16 17h1v1h-1zM20 17h1v1h-1zM0 18h7v1h-7zM9 18h2v1h-2zM12 18h3v1h-3zM16 18h1v1h-1zM18 18h1v1h-1zM20 18h1v1h-1zM24 18h1v1h-1zM0 19h1v1h-1zM6 19h1v1h-1zM10 19h2v1h-2zM15 19h2v1h-2zM20 19h1v1h-1zM24 19h1v1h-1zM0 20h1v1h-1zM2 20h3v1h-3zM6 20h1v1h-1zM9 20h5v1h-5zM15 20h6v1h-6zM22 20h1v1h-1zM0 21h1v1h-1zM2 21h3v1h-3zM6 21h1v1h-1zM9 21h2v1h-2zM12 21h1v1h-1zM15 21h4v1h-4zM23 21h2v1h-2zM0 22h1v1h-1zM2 22h3v1h-3zM6 22h1v1h-         </svg>
      </div>

      <div class="seat-row">
        <div><div class="k">Seat</div><div class="v">2A</div></div>
        <div><div class="k">Gate</div><div class="v">B22</div></div>
        <div><div class="k">Group</div><div class="v">1</div></div>
      </div>

      <div class="note">Gate closes 08:20</div>
    </aside>

  </article>
</body>
</html>
