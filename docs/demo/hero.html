<!doctype html>
<meta charset="utf-8">
<title>shotium</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 16px/1.5 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #e6edf7;
    background:
      radial-gradient(820px 520px at 82% -20%, rgba(56, 132, 255, 0.42) 0%, transparent 62%),
      radial-gradient(680px 460px at 6% 118%, rgba(124, 58, 237, 0.38) 0%, transparent 58%),
      linear-gradient(160deg, #0a0f1c 0%, #0d1526 55%, #0a0f1c 100%);
    display: grid;
    place-items: center;
  }
  .hero { width: 1080px; padding: 0 8px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .mark {
    width: 56px; height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    box-shadow: 0 12px 30px rgba(59, 130, 246, 0.35);
    display: grid; place-items: center;
    font-size: 30px; font-weight: 700; color: #fff;
  }
  h1 {
    margin: 0; font-size: 52px; line-height: 1;
    letter-spacing: -0.035em; font-weight: 700;
    background: linear-gradient(96deg, #ffffff 18%, #9ec5ff 78%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .tagline {
    margin: 16px 0 0; font-size: 20px; color: #a9b8d0; letter-spacing: -0.01em;
  }
  .tagline b { color: #e6edf7; font-weight: 600; }
  .stats {
    margin-top: 34px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
  }
  .stat {
    border: 1px solid rgba(148, 178, 255, 0.20);
    background: linear-gradient(180deg, rgba(148, 178, 255, 0.10), rgba(148, 178, 255, 0.03));
    border-radius: 14px; padding: 14px 16px;
  }
  .stat b {
    display: block; font-size: 26px; letter-spacing: -0.03em; color: #ffffff;
  }
  .stat span { font-size: 12.5px; color: #90a2be; }
  .cut {
    margin-top: 26px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 13px; color: #7f8ea8;
  }
  .cut em {
    font-style: normal; color: #ff9aa2; text-decoration: line-through;
    text-decoration-color: rgba(255, 154, 162, 0.55);
    border: 1px solid rgba(255, 154, 162, 0.28);
    border-radius: 999px; padding: 4px 11px;
  }
</style>
<div class="hero">
  <div class="brand">
    <div class="mark">S</div>
    <h1>shotium</h1>
  </div>

  <p class="tagline">
    HTML &amp; CSS to PNG from a stripped Chromium —
    <b>Blink + Skia + //net</b>, and nothing else.
  </p>

  <div class="stats">
    <div class="stat"><b>No V8</b><span>no script execution at all</span></div>
    <div class="stat"><b>~31 ms</b><span>per in-process shot</span></div>
    <div class="stat"><b>19.4 MB</b><span>npm download, win32-x64</span></div>
    <div class="stat"><b>58 MiB</b><span>idle daemon footprint</span></div>
  </div>

  <div class="cut">
    Removed from the build:
    <em>V8</em><em>Browser Shell</em><em>DevTools</em><em>GPU Process</em><em>//content</em>
  </div>
</div>
