<title>Shot benchmark: CSS heavy</title>

<style>
  :root { --unit: 9px; }
  .matrix { display: grid; grid-template-columns: repeat(12,1fr); gap: 7px; margin-top: 24px; padding: 18px; }
  .cell { position: relative; min-width: 0; height: 61px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--tone) 52%, white); border-radius: calc(5px + var(--r)); background: color-mix(in srgb, var(--tone) 13%, white); box-shadow: inset 0 -8px 18px rgba(18,31,55,.06); }
  .cell::before { content: attr(data-i); position: absolute; left: 8px; top: 7px; color: color-mix(in srgb, var(--tone) 65%, #152238); font-size: 10px; font-weight: 700; }
  .cell::after { content: ""; position: absolute; width: var(--unit); height: calc(var(--unit) * 3); right: 9px; bottom: 8px; border-radius: 999px; background: var(--tone); transform: rotate(calc(var(--i) * 3deg)); opacity: .82; }
  .cell:nth-child(4n+1) { --tone:#2563eb; --r:2px; } .cell:nth-child(4n+2) { --tone:#0f9f75; --r:7px; }
  .cell:nth-child(4n+3) { --tone:#d97706; --r:12px; } .cell:nth-child(4n) { --tone:#9333ea; --r:17px; }
  .cell:nth-child(3n) { border-style:dashed; } .cell:nth-child(5n) { filter:saturate(1.25); }
  .cell:nth-child(7n)::after { width:calc(var(--unit)*3); height:var(--unit); }
  .summary { display:flex; gap:12px; margin-top:18px; }
  .summary span { flex:1; padding:15px; border:1px solid var(--line); border-radius:10px; background:white; }
  @media (min-width:1100px) { .matrix { outline: 2px solid rgba(37,99,235,.15); outline-offset:4px; } }
</style>
