<svg xmlns="http://www.w3.org/2000/svg" width="820" height="190" viewBox="0 0 820 190" role="img" aria-labelledby="title">
<title id="title">shotium benchmark comparison</title>
<defs>
  <!-- Card background: elevated rich slate-navy, no pitch-black falloff -->
  <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1c1f2b"/>
    <stop offset="55%" stop-color="#161924"/>
    <stop offset="100%" stop-color="#131520"/>
  </linearGradient>

  <!-- Card borders with clear top-to-bottom definition -->
  <linearGradient id="cardBorderCyan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
    <stop offset="35%" stop-color="#353b50" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#272c3d" stop-opacity="0.8"/>
  </linearGradient>

  <linearGradient id="cardBorderIndigo" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
    <stop offset="35%" stop-color="#353b50" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#272c3d" stop-opacity="0.8"/>
  </linearGradient>

  <!-- Specular top highlight line -->
  <linearGradient id="specularGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="30%" stop-color="#ffffff" stop-opacity="0.28"/>
    <stop offset="70%" stop-color="#ffffff" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <!-- Key light (top-right) -->
  <radialGradient id="keyCyan" cx="85%" cy="12%" r="65%">
    <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="keyIndigo" cx="85%" cy="12%" r="65%">
    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
  </radialGradient>

  <!-- Fill light (bottom-left) to illuminate the bottom and left areas -->
  <radialGradient id="fillCyan" cx="12%" cy="88%" r="60%">
    <stop offset="0%" stop-color="#0284c7" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="fillIndigo" cx="12%" cy="88%" r="60%">
    <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
  </radialGradient>

  <!-- Metric text gradients -->
  <linearGradient id="metricCyan" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#60a5fa"/>
  </linearGradient>

  <linearGradient id="metricIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#a78bfa"/>
    <stop offset="100%" stop-color="#c084fc"/>
  </linearGradient>

  <!-- Bar gradients -->
  <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#60a5fa"/>
  </linearGradient>

  <linearGradient id="barIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#818cf8"/>
    <stop offset="100%" stop-color="#c084fc"/>
  </linearGradient>

  <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#2563eb"/>
  </linearGradient>
</defs>

<!-- LEFT CARD: COLD START -->
<g transform="translate(0 0)">
  <!-- Subtle elevation shadow -->
  <rect x="0.5" y="2" width="395" height="149" rx="14" fill="#000000" opacity="0.18"/>
  <!-- Card base -->
  <rect x="0.5" y="0.5" width="395" height="149" rx="14" fill="url(#cardBg)" stroke="url(#cardBorderCyan)"/>
  <!-- Key light (top-right) -->
  <rect x="0.5" y="0.5" width="395" height="149" rx="14" fill="url(#keyCyan)"/>
  <!-- Fill light (bottom-left) -->
  <rect x="0.5" y="0.5" width="395" height="149" rx="14" fill="url(#fillCyan)"/>
  <!-- Specular top edge -->
  <path d="M 20 1 L 375 1" stroke="url(#specularGlow)" stroke-width="1"/>

  <!-- Title & Metric -->
  <text x="24" y="47" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <tspan font-size="18" font-weight="700" fill="#ffffff">Cold start</tspan>
    <tspan font-size="16" font-weight="400" fill="#64748b"> · </tspan>
    <tspan font-size="28" font-weight="800" fill="url(#metricCyan)">14.6×</tspan>
    <tspan font-size="14" font-weight="500" fill="#94a3b8"> faster</tspan>
  </text>

  <!-- Row 1: Shotium -->
  <circle cx="34" cy="88" r="9.5" fill="url(#lensGrad)"/><circle cx="34" cy="88" r="5.2" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.95"/><circle cx="34" cy="88" r="1.8" fill="#ffffff"/>
  <text x="50" y="92" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Shotium</text>
  <rect x="124" y="83" width="175" height="10" rx="5" fill="#1e222e" stroke="#2d3345" stroke-width="0.75"/>
  <rect x="124" y="83" width="12" height="10" rx="5" fill="url(#barCyan)"/>
  <text x="371" y="92" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">67 ms</text>

  <!-- Row 2: Playwright -->
  <path d="M 34 118 L 25.77 113.25 A 9.5 9.5 0 0 1 42.23 113.25 Z" fill="#db4437"/><path d="M 34 118 L 42.23 113.25 A 9.5 9.5 0 0 1 34.00 127.50 Z" fill="#0f9d58"/><path d="M 34 118 L 34.00 127.50 A 9.5 9.5 0 0 1 25.77 113.25 Z" fill="#f4b400"/><circle cx="34" cy="118" r="4.3" fill="#ffffff"/><circle cx="34" cy="118" r="3.2" fill="#4285f4"/>
  <text x="50" y="122" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#a4adc0">Playwright</text>
  <rect x="124" y="113" width="175" height="10" rx="5" fill="#1e222e" stroke="#2d3345" stroke-width="0.75"/>
  <rect x="124" y="113" width="175" height="10" rx="5" fill="#44485a"/>
  <text x="371" y="122" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#a4adc0">980 ms</text>
</g>

<!-- RIGHT CARD: MEMORY PEAK -->
<g transform="translate(425 0)">
  <!-- Subtle elevation shadow -->
  <rect x="0.5" y="2" width="395" height="149" rx="14" fill="#000000" opacity="0.18"/>
  <!-- Card base -->
  <rect x="0.5" y="0.5" width="395" height="149" rx="14" fill="url(#cardBg)" stroke="url(#cardBorderIndigo)"/>
  <!-- Key light (top-right) -->
  <rect x="0.5" y="0.5" width="395" height="149" rx="14" fill="url(#keyIndigo)"/>
  <!-- Fill light (bottom-left) -->
  <rect x="0.5" y="0.5" width="395" height="149" rx="14" fill="url(#fillIndigo)"/>
  <!-- Specular top edge -->
  <path d="M 20 1 L 375 1" stroke="url(#specularGlow)" stroke-width="1"/>

  <!-- Title & Metric -->
  <text x="24" y="47" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <tspan font-size="18" font-weight="700" fill="#ffffff">Memory peak</tspan>
    <tspan font-size="16" font-weight="400" fill="#64748b"> · </tspan>
    <tspan font-size="28" font-weight="800" fill="url(#metricIndigo)">12.0×</tspan>
    <tspan font-size="14" font-weight="500" fill="#94a3b8"> less memory</tspan>
  </text>

  <!-- Row 1: Shotium -->
  <circle cx="34" cy="88" r="9.5" fill="url(#lensGrad)"/><circle cx="34" cy="88" r="5.2" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.95"/><circle cx="34" cy="88" r="1.8" fill="#ffffff"/>
  <text x="50" y="92" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Shotium</text>
  <rect x="124" y="83" width="175" height="10" rx="5" fill="#1e222e" stroke="#2d3345" stroke-width="0.75"/>
  <rect x="124" y="83" width="15" height="10" rx="5" fill="url(#barIndigo)"/>
  <text x="371" y="92" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#c084fc">263 MB</text>

  <!-- Row 2: Chrome -->
  <path d="M 34 118 L 25.77 113.25 A 9.5 9.5 0 0 1 42.23 113.25 Z" fill="#db4437"/><path d="M 34 118 L 42.23 113.25 A 9.5 9.5 0 0 1 34.00 127.50 Z" fill="#0f9d58"/><path d="M 34 118 L 34.00 127.50 A 9.5 9.5 0 0 1 25.77 113.25 Z" fill="#f4b400"/><circle cx="34" cy="118" r="4.3" fill="#ffffff"/><circle cx="34" cy="118" r="3.2" fill="#4285f4"/>
  <text x="50" y="122" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#a4adc0">Chrome</text>
  <rect x="124" y="113" width="175" height="10" rx="5" fill="#1e222e" stroke="#2d3345" stroke-width="0.75"/>
  <rect x="124" y="113" width="175" height="10" rx="5" fill="#44485a"/>
  <text x="371" y="122" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#a4adc0">3.1 GB</text>
</g>

<!-- FOOTERS -->
<text x="410" y="167" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#717a8c">Cold start p50 on linux-x64 (Shotium 67 ms vs Playwright 980 ms) · Memory peak at c4 1,000 shots (263 MB vs 3.1 GB)</text>
<text x="410" y="182" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#717a8c">shotium 0.11.1 vs Playwright + Chromium &amp; Puppeteer + Chrome · linux-x64 GitHub Actions runner · verified in benchmark section</text>
</svg>