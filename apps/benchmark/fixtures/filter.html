<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shot benchmark: filters</title><link rel="stylesheet" href="assets/base.css">
<style>
  body { background:#20263a; color:white; }
  .page .lede { color:#bdc7d8; }
  .stage { position:relative; height:500px; margin-top:25px; overflow:hidden; border:1px solid #46506a; border-radius:22px; background:linear-gradient(135deg,#273555,#4d2864); }
  .blob { position:absolute; width:250px; height:250px; border-radius:50%; filter:blur(24px); opacity:.78; }
  .b1 { left:30px; top:34px; background:#22d3ee; } .b2 { right:120px; bottom:-30px; background:#f43f5e; }
  .cards { position:absolute; inset:55px; display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
  .card { display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden; padding:19px; border:1px solid rgba(255,255,255,.4); border-radius:17px; background:rgba(255,255,255,.14); box-shadow:0 18px 34px rgba(0,0,0,.26); backdrop-filter:blur(16px) saturate(1.3); }
  .card::before { content:""; height:170px; margin-bottom:20px; border-radius:13px; background:url("assets/pattern.svg") center/cover; }
  .card:nth-child(2)::before { filter:grayscale(1) contrast(1.35); }
  .card:nth-child(3)::before { filter:hue-rotate(95deg) saturate(1.7); }
  .card:nth-child(4)::before { filter:sepia(.8) brightness(1.05); }
  .card b { font-size:18px; } .card small { margin-top:5px; color:#d9e2ef; }
</style>
<main class="page"><span class="eyebrow">Filter fixture</span><h1>Filter and backdrop composition</h1><p class="lede">Blur surfaces, color matrices, opacity, rounded clipping, shadows, and layered backdrops.</p><section class="stage"><i class="blob b1"></i><i class="blob b2"></i><div class="cards"><article class="card"><b>Original</b><small>unfiltered SVG image</small></article><article class="card"><b>Contrast</b><small>grayscale and contrast</small></article><article class="card"><b>Hue</b><small>rotation and saturation</small></article><article class="card"><b>Sepia</b><small>sepia and brightness</small></article></div></section></main></html>
