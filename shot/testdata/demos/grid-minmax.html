<!doctype html><meta charset="utf-8"><title>minmax() and auto-fill</title><style>html,body{margin:0;padding:0;background:#fff}body{width:400px;height:200px}.g{position:absolute;left:0;top:0;width:200px;height:40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr))}.g>i{display:block;height:40px}.g>i:nth-child(1){background:#c00}.g>i:nth-child(2){background:#06c}.g>i:nth-child(3){background:#093}.g>i:nth-child(4){background:#fc0}</style><div class=g><i></i><i></i><i></i><i></i></div>
