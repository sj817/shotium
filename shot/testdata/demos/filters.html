<!doctype html><meta charset="utf-8"><title>the filter shorthand functions</title><style>html,body{margin:0;padding:0;background:#fff}body{width:400px;height:200px}i{display:block;position:absolute;top:0;width:40px;height:80px;background:linear-gradient(#c00,#06c)}.a{left:0}.b{left:40px;filter:blur(3px)}.c{left:80px;filter:brightness(1.5)}.d{left:120px;filter:contrast(2)}.e{left:160px;filter:grayscale(1)}.f{left:200px;filter:hue-rotate(90deg)}.g{left:240px;filter:invert(1)}.h{left:280px;filter:saturate(3)}.i{left:320px;filter:sepia(1) drop-shadow(2px 2px 2px #000)}</style><i class=a></i><i class=b></i><i class=c></i><i class=d></i><i class=e></i><i class=f></i><i class=g></i><i class=h></i><i class=i></i>
