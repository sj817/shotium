<!doctype html>
<meta charset="utf-8">
<title>Transparent backdrop effects survive culling, clipping and masks</title>
<style>
html,body{margin:0;background:white}
.bg{position:absolute;top:10px;width:100px;height:80px;background:red}
.bg.b{left:140px;background:blue}.bg.c{left:270px;background:green}
.glass{position:absolute;left:20px;top:10px;width:60px;height:40px;backdrop-filter:invert(1);pointer-events:none}
.b .glass{clip-path:inset(0 30px 0 0)}
.c .glass{mask-image:linear-gradient(to right,black 30px,transparent 30px)}
</style>
<div class=bg style="left:10px"><div class=glass></div></div>
<div class="bg b"><div class=glass></div></div>
<div class="bg c"><div class=glass></div></div>
<div class=bg style="left:10px;top:110px"><div class=glass style="visibility:hidden"></div></div>
<div class=bg style="left:140px;top:110px"><div class=glass style="display:none"></div></div>
<div class=bg style="left:270px;top:110px"><div class=glass style="opacity:0"></div></div>
