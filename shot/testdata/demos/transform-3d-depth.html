<!doctype html>
<meta charset="utf-8">
<title>Depth sorting is scoped to preserve-3d and respects flattening groups</title>
<!-- Composited group opacity can round by one channel value. -->
<meta name="fuzzy" content="maxDifference=1;totalPixels=0-4800">
<style>
html,body{margin:0;background:white}
.scene{position:absolute;top:0;width:100px;height:80px;transform-style:preserve-3d}
.plane{position:absolute;left:10px;top:10px;width:80px;height:60px}
.near{background:blue;transform:translateZ(50px)}.far{background:red;transform:translateZ(-50px)}
</style>
<div class=scene style="left:0"><div class="plane near"></div><div class="plane far"></div></div>
<div class=scene style="left:100px;transform-style:flat"><div class="plane near"></div><div class="plane far"></div></div>
<div class=scene style="left:200px"><div class="plane near" style="transform:translateZ(10px)"></div><div class="plane far" style="transform:translateZ(10px)"></div></div>
<div class=scene style="left:310px;top:10px;width:80px;height:60px;background:green"><div class="plane far" style="left:0;top:0"></div></div>
<div class=scene style="left:0;top:100px"><div class="plane near"><div style="width:80px;height:60px;background:red;transform:translateZ(-500px)"></div></div><div class=plane style="background:green"></div></div>
<div class=scene style="left:100px;top:100px"><div style="transform:translateZ(20px);transform-style:preserve-3d"><div class="plane near"></div></div><div class="plane far" style="transform:translateZ(40px)"></div></div>
<div class=scene style="left:200px;top:100px"><div class="plane near" style="opacity:.5"><div style="width:80px;height:60px;background:red"></div></div><div class=plane style="background:green"></div></div>
<div class=scene style="left:300px;top:100px;perspective:200px"><div class="plane near" style="left:30px;top:25px;width:40px;height:30px;transform:translateZ(100px)"></div><div class="plane far" style="left:30px;top:25px;width:40px;height:30px;transform:translateZ(-100px)"></div></div>
