<!doctype html><meta charset="utf-8"><title>Reference: clip a normally blurred copy of the background</title><style>html,body{margin:0;padding:0;background:#fff}body{width:400px;height:200px}.bg{position:absolute;left:0;top:0;width:200px;height:100px;background:#ccc}.blue{position:absolute;left:70px;top:40px;width:60px;height:20px;background:blue}.red{position:absolute;left:10px;top:10px;width:20px;height:20px;background:red}.fg{position:absolute;left:50px;top:25px;width:100px;height:50px;overflow:hidden}.fg .bg{left:-50px;top:-25px;filter:blur(4px)}</style><div class=bg><div class=blue></div><div class=red></div></div><div class=fg><div class=bg><div class=blue></div><div class=red></div></div></div>
